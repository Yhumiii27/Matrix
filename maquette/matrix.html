  ];

  function draw() {
    if (!root || !window.cytoscape) return;
    const els = st.vue === 'tables' ? elementsTables() : st.vue === 'reseau' ? elementsReseau() : elementsEcrans();
    if (!cy) {
      cy = cytoscape({ container: $('cy'), elements: els, style: STYLE(), minZoom: 0.03, maxZoom: 4, boxSelectionEnabled: false });
      cy.on('tap', 'node', e => select(e.target));
      cy.on('tap', 'edge', e => { const d = e.target.data(); if (d.flux) { st.sel = { type: 'flux', id: d.flux }; panel(); } });
      cy.on('tap', e => { if (e.target === cy) { st.sel = null; cy.elements().removeClass('dim hl'); panel(); } });
      cy.on('mouseover', 'node[kind="table"], node[kind="ecran"], node[kind="hub"]', e => highlight(e.target));
      cy.on('mouseout', 'node', () => { if (!st.sel) cy.elements().removeClass('dim hl'); else if (st.sel.node) highlight(cy.getElementById(st.sel.node)); });
    } else { cy.resize(); cy.elements().remove(); cy.add(els); }
    legend();
    layout(false);
    panel();
  }
  function highlight(n) {
    if (!n || !n.length) return;
    const nb = n.closedNeighborhood().add(n.ancestors());
    cy.elements().addClass('dim'); nb.removeClass('dim'); n.connectedEdges().addClass('hl');
    cy.nodes('[kind="app"], [kind="grp"]').removeClass('dim');
  }
  function select(n) {
    const d = n.data();
    if (d.kind === 'table') st.sel = { type: 'table', key: d.id, tab: 'liens', node: d.id };
    else if (d.kind === 'hub') st.sel = { type: 'flux', id: d.flux, node: d.id };
    else if (d.kind === 'ecran') st.sel = { type: 'ecran', idx: d.idx, node: d.id };
    else if (d.kind === 'ext') st.sel = { type: 'ext', id: d.ext, node: d.id };
    else if (d.kind === 'app') st.sel = { type: 'app', id: d.id.slice(4) };
    else return;
    if (st.sel.node) highlight(n);
    panel();
  }
  // Disposition calculée hors écran (instance sans affichage), puis recopiée : évite que la disposition
  // globale, avec les groupes par outil, ne s'étale sur des dizaines de milliers de pixels.
  function headless(nodes, edges, opts) {
    const ids = new Set(nodes.map(n => n.id()));
    const tmp = cytoscape({ headless: true, styleEnabled: true,
      elements: [...nodes.map(n => ({ data: { id: n.id(), size: n.data('size') || 14 } })),
        ...edges.filter(e => ids.has(e.source().id()) && ids.has(e.target().id()) && e.source().id() !== e.target().id()).map(e => ({ data: { id: 'h' + e.id(), source: e.source().id(), target: e.target().id() } }))],
      style: [{ selector: 'node', style: { width: 'data(size)', height: 'data(size)' } }] });
    tmp.layout({ animate: false, randomize: true, fit: false, ...opts }).run();
    const bb = tmp.elements().boundingBox();
    const pos = {}; tmp.nodes().forEach(n => { const p = n.position(); pos[n.id()] = { x: p.x - bb.x1, y: p.y - bb.y1 }; });
    tmp.destroy();
    return { pos, w: bb.w, h: bb.h };
  }
  const COSE = { name: 'cose', idealEdgeLength: 50, nodeRepulsion: 4500, gravity: 1, numIter: 1000, componentSpacing: 30, nodeOverlap: 8 };
  function grid(nodes, cols, dx = 132, dy = 30) {
    const pos = {}; nodes.forEach((n, i) => pos[n.id()] = { x: (i % cols) * dx, y: Math.floor(i / cols) * dy });
    return { pos, w: (Math.min(cols, nodes.length) - 1) * dx, h: (Math.ceil(nodes.length / cols) - 1) * dy };
  }
  function layout(animate) {
    if (!cy) return;
    $('g-loading').hidden = true;
    const pos = {};
    const place = (blk, x, y) => { for (const [id, p] of Object.entries(blk.pos)) pos[id] = { x: p.x + x, y: p.y + y }; };
    if (st.vue === 'ecrans') {
      // Deux colonnes : écrans à gauche, tables à droite, ordonnées pour limiter les croisements.
      const ecr = cy.nodes('[kind="ecran"]'), tbs = cy.nodes('[kind="table"]');
      const rank = {}; tbs.forEach(t => { const src = t.incomers('node[kind="ecran"]'); rank[t.id()] = src.length ? src.map(s => s.data('idx')).reduce((x, y) => x + y, 0) / src.length : 0; });
      const sorted = tbs.sort((x, y) => rank[x.id()] - rank[y.id()]);
      const H = Math.max(ecr.length * 46, sorted.length * 22);
      ecr.forEach((e, i) => pos[e.id()] = { x: 0, y: (i + 0.5) * H / ecr.length });
      sorted.forEach((t, i) => pos[t.id()] = { x: 520, y: (i + 0.5) * H / sorted.length });
    } else if (st.vue === 'tables' && st.focus) {
      const blk = headless(cy.nodes('[kind="table"]'), cy.edges(), cy.nodes().length < 60
        ? { name: 'concentric', concentric: n => n.id() === st.focus ? 2 : 1, levelWidth: () => 1, minNodeSpacing: 34 }
        : COSE);
      place(blk, 0, 0);
    } else if (st.vue === 'tables') {
      // Un bloc par outil : Keystone à gauche, les autres empilés à droite.
      const blocks = APP_IDS.map(a => { const kids = cy.getElementById('app:' + a).children(); return kids.length ? { a, ...headless(kids, kids.connectedEdges(), COSE) } : null; }).filter(Boolean);
      const big = blocks.find(b => b.a === 'keystone'), rest = blocks.filter(b => b !== big);
      let x = 0;
      if (big) { place(big, 0, 0); x = big.w + 160; }
      let y = 0;
      for (const b of rest) { if (big) { place(b, x, y); y += b.h + 140; } else { place(b, x, 0); x += b.w + 160; } }
    } else {
      // Échanges : un outil par coin, les flux (losanges) entre les deux outils qu'ils relient.
      const blocks = {};
      for (const a of APP_IDS) { const kids = cy.getElementById('app:' + a).children(); blocks[a] = grid(kids.sort((p, q) => p.data('label').localeCompare(q.data('label'))), a === 'keystone' ? 4 : 3); }
      const G = 380;
      const colW = Math.max(blocks.keystone.w, blocks.cursus.w), rowH = Math.max(blocks.keystone.h, blocks.codex.h);
      const colW2 = Math.max(blocks.codex.w, blocks.vigie.w);
      const origin = { keystone: [0, 0], codex: [colW + G, 0], cursus: [0, rowH + G], vigie: [colW + G, rowH + G], arche: [colW + G + colW2 + G, 0], crucible: [colW + G + colW2 + G, rowH + G] };
      const center = {};
      for (const a of APP_IDS) { place(blocks[a], ...origin[a]); center[a] = { x: origin[a][0] + blocks[a].w / 2, y: origin[a][1] + blocks[a].h / 2 }; }
      const pairs = {};
      for (const f of FLUX.flux) (pairs[[f.de, f.vers].sort().join('|')] ??= []).push(f);
      for (const list of Object.values(pairs)) list.forEach((f, i) => {
        const A = center[f.de], B = center[f.vers];
        const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
        const off = (i - (list.length - 1) / 2) * 52;
        pos['flux:' + f.id] = { x: (A.x + B.x) / 2 - dy / len * off, y: (A.y + B.y) / 2 + dx / len * off };
      });
      const extSide = { lucca: [-1, 0], x3: [-1, 0.6], sharepoint: [0, -1], sage: [0, 1], trackdechets: [0, 1] };
      const extCount = {};
      for (const e of FLUX.externes) {
        const c = center[e.app], b = blocks[e.app], [sx, sy] = extSide[e.id] || [1, 0];
        const k = extCount[e.app] = (extCount[e.app] || 0) + 1;
        pos['ext:' + e.id] = { x: c.x + sx * (b.w / 2 + 170) + (sy ? (k - 1) * 120 : 0), y: c.y + sy * (b.h / 2 + 120) + (sx ? (k - 1) * 70 : 0) };
      }
    }
    cy.layout({ name: 'preset', positions: n => pos[n.id()], fit: true, padding: 40, animate: !!animate, animationDuration: 300 }).run();
    if (cy.zoom() > 1.3) { cy.zoom(1.3); cy.center(); }
    cy.elements().unselect().removeClass('dim hl');
    if (st.sel?.node) { const n = cy.getElementById(st.sel.node); if (n.length) { n.select(); highlight(n); } }
  }
  function panel() {
    const q = $('g-quick'); if (!q) return;
    const s = st.sel;
    if (!s) {
      const info = st.vue === 'tables'
        ? `<p>${cy ? cy.nodes('[kind="table"]').length : 0} tables et ${cy ? cy.edges().length : 0} liens affichés.</p><p class="sub">Cliquez sur une table pour voir ses colonnes et ses liens. Saisissez un nom dans « Centrer sur une table » pour n’afficher que son voisinage.</p>`
        : st.vue === 'reseau' ? `<p>${FLUX.flux.length} flux entre les logiciels, ${FLUX.externes.length} systèmes externes.</p><p class="sub">Cliquez sur un losange pour voir quelles informations un logiciel extrait d’une table d’un autre logiciel.</p>`
        : `<p>${(USAGES[st.ecransApp] || []).length} écrans relevés dans ${APPS[st.ecransApp].nom}.</p><p class="sub">Cliquez sur un écran pour voir les tables qu’il lit et écrit.</p>`;
      q.innerHTML = `<div class="empty-pane">${icon('graph', 22)}${info}</div>`; return;
    }
    if (s.type === 'table') q.innerHTML = tableSheet(T.get(s.key), s.tab, { close: true, actions: false }) + `<div class="actions"><button class="btn btn-primary" data-graph="${esc(s.key)}">${icon('graph', 14)} Centrer ici</button><button class="btn btn-secondary" data-open="${esc(s.key)}">${icon('db', 14)} Ouvrir dans la bibliothèque</button></div>`;
    else if (s.type === 'flux') q.innerHTML = fluxSheet(FLUX.flux.find(f => f.id === s.id), { close: true, actions: false });
    else if (s.type === 'ecran') {
      const e = USAGES[st.ecransApp][s.idx];
      q.innerHTML = `<div class="quick-head"><div class="quick-title">${esc(e.ecran)}</div><button class="btn btn-ghost btn-icon" data-close aria-label="Fermer">${icon('close', 14)}</button></div>
        <div class="tags">${appTag(st.ecransApp)}<span class="tag tag-neutral mono">${esc(e.route)}</span></div>
        <div><div class="block-title">Écrit <span>${e.ecrit.length}</span></div>${e.ecrit.map(n => `<div class="link-row"><button class="link-btn mono" data-open="${esc(key(st.ecransApp, n))}">${esc(n)}</button></div>`).join('') || '<p class="sub text-muted">Écran en lecture seule.</p>'}</div>
        <div><div class="block-title">Lit <span>${e.lit.length}</span></div>${e.lit.map(n => `<div class="link-row"><button class="link-btn mono" data-open="${esc(key(st.ecransApp, n))}">${esc(n)}</button></div>`).join('')}</div>`;
    } else if (s.type === 'ext') {
      const e = FLUX.externes.find(x => x.id === s.id);
      q.innerHTML = `<div class="quick-head"><div class="quick-title">${esc(e.nom)}</div><button class="btn btn-ghost btn-icon" data-close aria-label="Fermer">${icon('close', 14)}</button></div>

    } else if (s.type === 'app') {
      const a = s.id, ts = tablesOf(a);
      q.innerHTML = `<div class="quick-head"><div class="quick-title">${APPS[a].nom}</div><button class="btn btn-ghost btn-icon" data-close aria-label="Fermer">${icon('close', 14)}</button></div>

        <div class="mini-kpis"><div><b>${ts.length}</b><span>tables</span></div><div><b>${FLUX.flux.filter(f => f.de === a).length}</b><span>flux sortants</span></div><div><b>${FLUX.flux.filter(f => f.vers === a).length}</b><span>flux entrants</span></div></div>
        <dl class="dl"><dt>Base</dt><dd>${esc(APPS[a].moteur)}</dd><dt>Données</dt><dd class="mono">${esc(APPS[a].donnees)}</dd></dl>

  };
})();

      <td>${natureTag(g.nature)}</td><td>${gravTag(g.gravite)}</td>
      <td class="nowrap"><span class="tag tag-ghost">${g.recommandation}</span></td>
      <td class="nowrap">${d ? `<span class="tag tag-accent" title="${g.decision && g.decision.option === d ? 'Décision ' + g.decision.statut + ' du ' + new Date(g.decision.le).toLocaleDateString('fr-FR') : 'Choix enregistré dans ce navigateur'}">${icon('tick', 10, 2)} ${d}${g.decision && g.decision.option === d && g.decision.statut === 'provisoire' ? ' · provisoire' : ''}</span>` : '<span class="text-muted sub">à trancher</span>'}</td></tr>`; }).join('') || `<tr><td colspan="7" class="empty">Aucun groupe dans ce filtre.</td></tr>`;
    $('db-foot').textContent = SERVEUR ? `${Decisions.count()} décision(s) sur ${DOUBLONS.length} · enregistrées sur le serveur Matrix et tracées dans le journal` : `${Decisions.count()} décision(s) sur ${DOUBLONS.length} · ${DOUBLONS.filter(g => g.decision).length} enregistrée(s) dans Matrix, les autres choix restent dans ce navigateur`;
    const g = DOUBLONS.find(x => x.id === st.sel); const d = Decisions.get(g.id);
    $('db-quick').innerHTML = `<div class="quick-head"><div class="quick-title">${esc(g.objet)}</div></div>
      <div class="tags"><span class="tag tag-ghost">${g.id}</span>${natureTag(g.nature)}${gravTag(g.gravite)}</div>
      <div><div class="block-title">Ce que contiennent les tables</div><p>${esc(g.contenu)}</p></div>
      <div><div class="block-title">Tables concernées <span>${g.tables.length}</span></div>
        ${g.tables.map(o => `<div class="link-row" style="flex-direction:column;align-items:flex-start;gap:2px"><div style="display:flex;gap:8px;align-items:center">${appMark(o.app)}${o.table === '—' ? '<span class="text-muted">aucune table</span>' : `<button class="link-btn mono" data-open="${esc(key(o.app, o.table))}">${esc(o.table)}</button>`}</div><div>${esc(o.role)}</div>${o.contenu ? `<div class="sub text-muted">${esc(o.contenu)}</div>` : ''}</div>`).join('')}</div>
      ${g.champs.length ? `<div><div class="block-title">Colonnes qui se correspondent</div>${g.champs.map(c => `<div class="link-row mono" style="font-size:11.5px">${esc(c)}</div>`).join('')}</div>` : ''}
      <div><div class="block-title">Options <span>proposé : ${g.recommandation}</span></div>
        <div style="display:flex;flex-direction:column;gap:8px">${g.options.map(o => `<button type="button" class="option" data-choix="${o.id}" aria-pressed="${d === o.id}">
          <span class="option-head"><span class="option-id">${o.id}</span><span>${esc(o.libelle)}</span>${o.id === g.recommandation ? '<span class="tag tag-ghost" style="margin-left:auto">proposé</span>' : ''}</span>
          <span class="sub text-muted">${esc(o.effet)}</span></button>`).join('')}</div></div>
      <p class="note"><b style="font-weight:500">Pourquoi ${g.recommandation} :</b> ${esc(g.raison)}</p>
      ${g.decision ? `<div><div class="block-title">Décision ${esc(g.decision.statut)} du ${new Date(g.decision.le).toLocaleDateString('fr-FR')}</div><p class="note">« ${esc(g.decision.citation)} »<br><span class="text-muted">${esc(g.decision.effet)}</span></p></div>` : ''}
      <div class="actions"><button class="btn btn-primary" id="db-graph">${icon('graph', 14)} Voir dans le graphe</button></div>`;
    $('db-graph').addEventListener('click', () => { const f = g.tables.find(o => o.table !== '—'); Graph.focusTable(key(f.app, f.table), { doublons: true }); });
  }
  return { render, open(id) { st.sel = id; st.filtre = 'tous'; go('doublons'); if (rendered.doublons) update(); } };
})();
RENDER.doublons = () => Dups.render();

// ── Qualité ─────────────────────────────────────────────────────────────
// ── Référentiels publiés par Matrix (D14 sites, D15 organigramme, D17 pays, D21 zones et filiales) ─────
RENDER.referentiels = () => {
  const root = $('s-referentiels');
  const NIVEAUX = [['departement', 'Département'], ['service', 'Service'], ['equipe', 'Équipe']];
  const DEF = {
    sites: { titre: 'Sites', decision: 'D14', cle: 'code', vue: 'matrix.pub_sites', nouveau: () => ({ code: '', libelle: '', ville: '', pays_iso2: 'FR', ordre: 0, actif: true, filiale_code: '' }),
      cols: [['code', 'Code', 'texte', 'lyon'], ['libelle', 'Libellé', 'texte'], ['ville', 'Ville', 'texte'], ['pays_iso2', 'Pays', 'pays'], ['filiale_code', 'Filiale', 'filiale'], ['ordre', 'Ordre', 'nombre'], ['actif', 'Actif', 'case']] },
    organigramme: { titre: 'Organigramme', decision: 'D15', cle: 'code', vue: 'matrix.pub_organigramme', nouveau: () => ({ code: '', niveau: 'service', parent_code: '', libelle_fr: '', libelle_en: '', responsable_matricule: '', site_code: '', ordre: 0, actif: true }),
      cols: [['code', 'Code', 'texte', 'PRJ-CPL'], ['niveau', 'Niveau', 'niveau'], ['parent_code', 'Rattaché à', 'parent'], ['libelle_fr', 'Libellé', 'texte'], ['libelle_en', 'Libellé anglais', 'texte'], ['responsable_matricule', 'Responsable', 'texte', 'Matricule'], ['site_code', 'Site', 'site'], ['ordre', 'Ordre', 'nombre'], ['actif', 'Actif', 'case']] },
    zones: { titre: 'Zones', decision: 'D21', cle: 'code', vue: 'matrix.pub_zones', nouveau: () => ({ code: '', libelle: '', responsable: '', ordre: 0, actif: true }),
      cols: [['code', 'Code', 'texte', 'AFN'], ['libelle', 'Libellé', 'texte', 'Afrique du Nord'], ['responsable', 'Directeur de Zone', 'texte'], ['ordre', 'Ordre', 'nombre'], ['actif', 'Actif', 'case']] },
    filiales: { titre: 'Filiales', decision: 'D21', cle: 'code', vue: 'matrix.pub_filiales', nouveau: () => ({ code: '', nom: '', pays_iso2: 'FR', zone_code: '', devise: 'EUR', ordre: 0, actif: true }),
      cols: [['code', 'Code', 'texte', 'APM'], ['nom', 'Nom', 'texte'], ['pays_iso2', 'Pays', 'pays'], ['zone_code', 'Zone', 'zone'], ['devise', 'Devise', 'texte', 'EUR'], ['ordre', 'Ordre', 'nombre'], ['actif', 'Actif', 'case']] },
    pays: { titre: 'Pays', decision: 'D17', cle: 'iso2', vue: 'matrix.pub_pays', nouveau: () => ({ iso2: '', iso3: '', nom_fr: '', nom_en: '', actif: true }),
      cols: [['iso2', 'ISO 2', 'texte', 'FR'], ['iso3', 'ISO 3', 'texte', 'FRA'], ['nom_fr', 'Nom', 'texte'], ['nom_en', 'Nom anglais', 'texte'], ['actif', 'Actif', 'case']] },
  };
  let liste = 'sites', brouillon = null;
  const copie = () => JSON.parse(JSON.stringify(EDITION.referentiels[liste]));
  const champ = (row, i, [k, , type, ph]) => {
    const v = row[k] ?? '', id = `ref-${liste}-${i}-${k}`;
    if (!SERVEUR) return type === 'case' ? (v ? icon('tick', 14, 1.8) : '<span class="text-muted">non</span>') : type === 'niveau' ? esc(NIVEAUX.find(n => n[0] === v)?.[1] || v) : `<span class="${k === 'code' || k === 'iso2' ? 'mono' : ''}">${esc(v) || '<span class="text-muted">—</span>'}</span>`;
    const sel = (opts) => `<select class="input" id="${id}" data-i="${i}" data-k="${k}">${opts.map(([val, lib]) => `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lib)}</option>`).join('')}</select>`;
    if (type === 'case') return `<input type="checkbox" id="${id}" data-i="${i}" data-k="${k}" ${v ? 'checked' : ''} aria-label="Actif">`;
    if (type === 'niveau') return sel(NIVEAUX);
    if (type === 'pays') return sel(EDITION.referentiels.pays.map(p => [p.iso2, `${p.iso2} · ${p.nom_fr}`]));
    if (type === 'site') return sel([['', '—'], ...EDITION.referentiels.sites.map(x => [x.code, x.libelle])]);
    if (type === 'zone') return sel([['', '—'], ...EDITION.referentiels.zones.map(x => [x.code, `${x.code} · ${x.libelle}`])]);
    if (type === 'filiale') return sel([['', '— (EPC2i)'], ...EDITION.referentiels.filiales.map(x => [x.code, `${x.code} · ${x.nom}`])]);
    if (type === 'parent') return sel([['', '—'], ...brouillon.filter((u, j) => j !== i && u.code && u.niveau !== 'equipe').map(u => [u.code, `${u.code} · ${u.libelle_fr}`])]);
    return `<input class="input ${k === 'code' || k === 'iso2' || k === 'iso3' ? 'mono' : ''}" id="${id}" data-i="${i}" data-k="${k}" ${type === 'nombre' ? 'type="number" step="1" style="width:80px"' : ''} placeholder="${esc(ph || '')}" value="${esc(v)}">`;
  };
  const draw = () => {
    const d = DEF[liste];
    brouillon ??= copie();
    const modifie = JSON.stringify(brouillon) !== JSON.stringify(EDITION.referentiels[liste]);
    root.innerHTML = `<div class="wrap">
      <div class="top" style="margin-bottom:14px"><div>${seg('ref', Object.entries(DEF).map(([k, x]) => [k, x.titre, EDITION.referentiels[k].length]), liste)}</div>
        ${SERVEUR ? `<div class="actions"><button class="btn btn-secondary btn-sm" id="ref-ajouter">${icon('plus', 13)} Ajouter une ligne</button><button class="btn btn-secondary btn-sm" id="ref-annuler" ${modifie ? '' : 'disabled'}>Annuler les modifications</button><button class="btn btn-primary btn-sm" id="ref-enregistrer" ${modifie ? '' : 'disabled'}>Enregistrer</button></div>` : ''}</div>
      <p class="text-muted prose" style="margin-bottom:12px">Liste unique décidée en ${d.decision}, publiée aux outils par la vue <span class="mono">${d.vue}</span> et par <span class="mono">GET /api/referentiels/${liste}</span>.${SERVEUR ? ' Chaque enregistrement est contrôlé avec les mêmes règles que la base et tracé dans le journal.' : ' La modification se fait sur le serveur Matrix.'}</p>
      <p class="form-error" id="ref-erreur" hidden></p>
      <div class="table-wrap"><table class="table"><thead><tr>${d.cols.map(c => `<th>${c[1]}</th>`).join('')}${SERVEUR ? '<th></th>' : ''}</tr></thead>
      <tbody>${brouillon.map((row, i) => `<tr>${d.cols.map(c => `<td>${champ(row, i, c)}</td>`).join('')}${SERVEUR ? `<td><button class="btn btn-ghost btn-icon" data-retirer="${i}" title="Retirer la ligne" aria-label="Retirer la ligne">${icon('close', 13)}</button></td>` : ''}</tr>`).join('') || `<tr><td colspan="${d.cols.length + 1}" class="empty">Liste vide.</td></tr>`}</tbody></table></div>
      ${modifie ? '<p class="sub text-muted" style="margin-top:10px">Modifications non enregistrées.</p>' : ''}</div>`;
  };
  root.addEventListener('input', e => {
    const f = e.target.closest('[data-k]'); if (!f) return;
    const row = brouillon[+f.dataset.i], k = f.dataset.k;
    row[k] = f.type === 'checkbox' ? f.checked : f.type === 'number' ? Number(f.value) : f.value;
    if (f.tagName === 'SELECT' || f.type === 'checkbox') draw();
    else { const b = $('ref-enregistrer'), a = $('ref-annuler'); if (b) b.disabled = a.disabled = false; }
  });
  root.addEventListener('click', async e => {
    if (e.target.closest('#ref-ajouter')) { brouillon.push(DEF[liste].nouveau()); draw(); return; }
    const r = e.target.closest('[data-retirer]'); if (r) { brouillon.splice(+r.dataset.retirer, 1); draw(); return; }
    if (e.target.closest('#ref-annuler')) { brouillon = copie(); draw(); return; }
    if (e.target.closest('#ref-enregistrer')) {
      const lignes = brouillon.map(x => Object.fromEntries(Object.entries(x).map(([k, v]) => [k, v === '' ? null : v])));
      try { await envoyer(`/api/referentiels/${liste}`, lignes); brouillon = copie(); draw(); toast(`${DEF[liste].titre} : enregistré`); }
      catch (err) { const p = $('ref-erreur'); p.textContent = err.message; p.hidden = false; }
    }
  });
  onSeg(root, 'ref', v => { liste = v; brouillon = null; draw(); });
  draw();
};

RENDER.qualite = () => {
  const m = APP_IDS.map(a => {
    const ts = tablesOf(a);
    const fks = ts.flatMap(t => t.fks);
    return { a, tables: ts.length, cols: ts.reduce((n, t) => n + t.columns.length, 0), decl: fks.filter(f => f.declared).length, log: fks.filter(f => !f.declared).length,
      iso: ts.filter(t => linkCount(t) === 0).length, json: ts.reduce((n, t) => n + t.columns.filter(c => /json/i.test(c.type)).length, 0),
      sens: ts.reduce((n, t) => n + (t.sensitive || []).length, 0), sansEcran: ts.filter(t => !t.lit.length && !t.ecrit.length).length };
  });
  $('s-qualite').innerHTML = `<div class="wrap">
    <div class="sec-head"><h6 class="sec-title">Indicateurs par base</h6><span class="sub text-muted">Calculés à partir des schémas lus</span></div>
    <div class="table-wrap"><table class="table"><thead><tr><th>Base</th><th class="num">Tables</th><th class="num">Colonnes</th><th class="num">Clés étrangères</th><th class="num">Liens logiques</th><th class="num">Tables isolées</th><th class="num">Colonnes JSON</th><th class="num">Colonnes sensibles</th><th class="num">Tables sans écran relevé</th></tr></thead>
    <tbody>${m.map(x => `<tr><td class="nowrap">${appMark(x.a)} ${APPS[x.a].nom}</td><td class="num">${x.tables}</td><td class="num">${fmt(x.cols)}</td><td class="num">${x.decl}</td><td class="num">${x.log ? `<span class="tag tag-outline">${x.log}</span>` : 0}</td><td class="num">${x.iso}</td><td class="num">${x.json}</td><td class="num">${x.sens}</td><td class="num">${x.sansEcran}</td></tr>`).join('')}</tbody></table></div>
    <div class="sec-head" style="margin-top:30px"><h6 class="sec-title">Points d’attention</h6><span class="sub text-muted">${FLUX.alertes.length} relevés</span></div>
    ${FLUX.alertes.map(a => `<div class="alert-row hairline">${gravTag(a.gravite)}<div style="min-width:0;flex:1"><div>${esc(a.titre)} <span class="text-muted sub">· ${a.app === 'toutes' ? 'toutes les bases' : APPS[a.app].nom}</span></div><div class="sub text-muted prose">${esc(a.detail)}</div></div></div>`).join('')}
  </div>`;
};

// ── Administration ──────────────────────────────────────────────────────
RENDER.administration = () => {
  const root = $('s-administration'); let tab = 'connexions';
  const ROLES = ['Administrateur des données', 'Responsable de domaine', 'Lecteur'];
  const PERMS = [['Consulter le catalogue et le graphe', [1, 1, 1]], ['Voir un extrait des données', [1, 1, 0]], ['Voir les données sensibles', [1, 0, 0]], ['Documenter une table ou une colonne', [1, 1, 0]], ['Lancer une collecte', [1, 0, 0]], ['Exécuter une requête de modification', [1, 0, 0]], ['Gérer les connexions et les droits', [1, 0, 0]]];
  const JOURNAL = (EDITION.journal || []).slice().reverse();
  const draw = () => {
    let body = '';
    if (tab === 'connexions') body = `<div class="table-wrap"><table class="table"><thead><tr><th>Base</th><th>Aujourd’hui</th><th>Cible validée le 15/10/2026</th><th>Rôle de l’outil</th><th>Accès de Matrix</th></tr></thead><tbody>
      ${APP_IDS.map(a => `<tr><td class="nowrap">${appMark(a)} ${APPS[a].nom}</td><td>${esc(APPS[a].moteur)}<div class="sub text-muted mono">${esc(APPS[a].donnees)}</div></td><td>Schéma <span class="mono">${a}</span> de la base <span class="mono">epc2i</span>${a === 'cursus' ? '<div class="sub text-muted">migration depuis SQLite, 37 clés étrangères à déclarer</div>' : ''}</td><td class="mono">${a}_app</td><td><span class="mono">matrix_lecture</span><div class="sub text-muted">lecture seule${a === 'cursus' || a === 'vigie' ? ', colonnes sensibles exclues' : ''}</div></td></tr>`).join('')}
      <tr><td class="nowrap">${icon('matrix', 16)} Matrix</td><td class="text-muted">—</td><td>Schéma <span class="mono">matrix</span></td><td class="mono">matrix_app</td><td class="text-muted">catalogue, correspondances, historique</td></tr></tbody></table></div>
      <p class="note" style="margin-top:14px">Serveur PostgreSQL commun avec un schéma par outil : validé le 15 octobre 2026. Chaque outil reste seul propriétaire de son schéma et ne voit pas ceux des autres. Matrix lit tout en lecture seule, sans les colonnes sensibles. En développement et dans l’application Mac, chaque outil garde sa base embarquée.</p>`;
    else if (tab === 'collecte') {
      const TYPES = { table_ajoutee: 'Table ajoutée', table_supprimee: 'Table supprimée', colonne_ajoutee: 'Colonne ajoutée', colonne_supprimee: 'Colonne supprimée' };
      body = `<div class="table-wrap"><table class="table"><thead><tr><th>Base</th><th>Source du schéma</th><th class="num">Tables</th><th class="num">À documenter</th></tr></thead><tbody>
        ${CAT.apps.map(a => `<tr><td class="nowrap">${appMark(a.id)} ${APPS[a.id].nom}</td><td>${esc(a.source.replace(/\d{4}-\d{2}-\d{2}T[\d:.]+Z/, d => new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })))}</td><td class="num">${a.tables.length}</td><td class="num">${a.tables.filter(t => t.nouvelle).length}</td></tr>`).join('')}</tbody></table></div>
        <div class="block-title" style="margin-top:22px">Déclaration des nouvelles tables</div>
        <ol class="prose" style="margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
          <li>Au démarrage, après ses migrations, chaque outil lit le schéma réel de sa base et l’envoie à Matrix (<span class="mono">POST /api/declarations</span>, jeton partagé).</li>
          <li>Matrix compare la déclaration à la collecte précédente. Une table inconnue est ajoutée à la bibliothèque, marquée « à documenter ».</li>
          <li>La nouvelle table est comparée à celles des autres outils. Si elle ressemble à une table existante, elle est signalée comme doublon possible.</li>
          <li>Tant qu’un outil n’envoie pas de déclaration, Matrix lit son schéma dans le code source (migrations).</li>
        </ol>
        <div class="block-title" style="margin-top:22px">Déclarations reçues <span>${(DATA.declarations || []).length}</span></div>
        ${(DATA.declarations || []).length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Outil</th><th>Reçue le</th><th>Version</th><th class="num">Tables</th></tr></thead><tbody>${DATA.declarations.map(d => `<tr><td class="nowrap">${appMark(d.app)} ${APPS[d.app].nom}</td><td class="tabnum">${new Date(d.declareLe).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })}</td><td class="mono text-muted">${esc(d.version || '—')}</td><td class="num">${d.tables}</td></tr>`).join('')}</tbody></table></div>`
          : `<p class="text-muted">Aucun outil n’a encore déclaré son schéma. Les déclarations arrivent quand le module de déclaration est installé dans l’outil et que MATRIX_URL et MATRIX_TOKEN y sont définis.</p>`}
        <div class="block-title" style="margin-top:22px">Historique des schémas <span>${HIST.length}</span></div>
        ${HIST.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Quand</th><th>Base</th><th>Changement</th><th>Objet</th></tr></thead><tbody>${HIST.slice().reverse().map(e => `<tr><td class="tabnum text-muted nowrap">${new Date(e.date).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })}</td><td>${APPS[e.app].nom}</td><td>${TYPES[e.type]}${e.doublonsPossibles ? ` <span class="tag tag-outline">doublon possible : ${esc(e.doublonsPossibles.join(', '))}</span>` : ''}</td><td class="mono">${esc(e.table)}${e.colonne ? '.' + esc(e.colonne) : ''}</td></tr>`).join('')}</tbody></table></div>`
          : `<p class="text-muted">Aucun changement depuis la première collecte du ${new Date(CAT.generatedAt).toLocaleDateString('fr-FR')}.</p>`}
        <div class="block-title" style="margin-top:22px">Commandes</div><div class="code">npm start                                # serveur Matrix (page + réception des déclarations)
node outils/collecteur.mjs ..            # relire les schémas dans les dépôts et comparer
node outils/construire-maquette.mjs      # reconstruire la maquette publiée</div>`;
    }
    else if (tab === 'droits') body = `<div class="table-wrap"><table class="table"><thead><tr><th>Droit</th>${ROLES.map(r => `<th style="text-align:center">${r}</th>`).join('')}</tr></thead><tbody>${PERMS.map(([p, g]) => `<tr><td>${p}</td>${g.map(v => `<td style="text-align:center"><span class="perm ${v ? 'on' : 'off'}">${icon(v ? 'tick' : 'dash', 15, 1.8)}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="sub text-muted" style="margin-top:10px">Matrice proposée, à valider. En attendant l’authentification commune aux outils (question O-02 de Codex), Matrix est protégé par un mot de passe (variable MATRIX_MOT_DE_PASSE) : toute personne qui le connaît a les droits d’administrateur, et ses modifications sont tracées sous l’identifiant saisi.</p>`;
    else body = JOURNAL.length ? `<p class="sub text-muted" style="margin-bottom:8px">Modifications faites dans Matrix : documentation, décisions, référentiels. ${JOURNAL.length} dernières.</p><div class="table-wrap"><table class="table"><thead><tr><th>Quand</th><th>Qui</th><th>Action</th><th>Objet</th><th>Détail</th></tr></thead><tbody>${JOURNAL.map(r => `<tr><td class="tabnum text-muted nowrap">${new Date(r.quand).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })}</td><td>${esc(r.qui)}</td><td>${esc(r.action)}</td><td class="mono">${esc(r.objet)}</td><td class="text-muted">${esc(r.detail)}</td></tr>`).join('')}</tbody></table></div>`
      : `<p class="text-muted">${SERVEUR ? 'Aucune modification pour l’instant. Chaque documentation de table, décision ou changement de référentiel fait dans Matrix apparaîtra ici, avec son auteur.' : 'Le journal est tenu par le serveur Matrix.'}</p>`;
    root.querySelector('#ad-body').innerHTML = body;
  };
  root.innerHTML = `<div class="wrap"><div style="margin-bottom:16px">${seg('ad', [['connexions', 'Connexions'], ['collecte', 'Collecte'], ['droits', 'Rôles & droits'], ['journal', 'Journal']], tab)}</div><div id="ad-body"></div></div>`;
  onSeg(root, 'ad', v => { tab = v; draw(); });
  draw();
};

show(location.hash.slice(1) || 'accueil');
})();
</script>
