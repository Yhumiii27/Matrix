    if (!SERVEUR) return type === 'case' ? (v ? icon('tick', 14, 1.8) : '<span class="text-muted">non</span>') : type === 'niveau' ? esc(NIVEAUX.find(n => n[0] === v)?.[1] || v) : `<span class="${k === 'code' || k === 'iso2' ? 'mono' : ''}">${esc(v) || '<span class="text-muted">—</span>'}</span>`;
    const sel = (opts) => `<select class="input" id="${id}" data-i="${i}" data-k="${k}">${opts.map(([val, lib]) => `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lib)}</option>`).join('')}</select>`;
    if (type === 'case') return `<input type="checkbox" id="${id}" data-i="${i}" data-k="${k}" ${v ? 'checked' : ''} aria-label="Actif">`;
    if (type === 'niveau') return sel(NIVEAUX);
    if (type === 'pays') return sel(EDITION.referentiels.pays.map(p => [p.iso2, `${p.iso2} · ${p.nom_fr}`]));
    if (type === 'site') return sel([['', '—'], ...EDITION.referentiels.sites.map(x => [x.code, x.libelle])]);
    if (type === 'zone') return sel([['', '—'], ...EDITION.referentiels.zones.map(x => [x.code, `${x.code} · ${x.libelle}`])]);
    if (type === 'filiale') return sel([['', '— (EPC2i)'], ...EDITION.referentiels.filiales.map(x => [x.code, `${x.code} · ${x.nom}`])]);
    if (type === 'parent') return sel([['', '—'], ...brouillon.filter((u, j) => j !== i && u.code && u.niveau !== 'equipe').map(u => [u.code, `${u.code} · ${u.libelle_fr}`])]);
    return `<input class="input ${k === 'code' || k === 'iso2' || k === 'iso3' ? 'mono' : ''}" id="${id}" data-i="${i}" data-k="${k}" ${type === 'nombre' ? 'type="number" step="1" style="width:80px"' : type === 'degres' ? 'type="number" step="any" style="width:96px"' : ''} placeholder="${esc(ph || '')}" value="${esc(v)}">`;
  };
  const draw = () => {
    const d = DEF[liste];
    brouillon ??= copie();
    const modifie = JSON.stringify(brouillon) !== JSON.stringify(EDITION.referentiels[liste]);
    root.innerHTML = `<div class="wrap">
      <div class="top" style="margin-bottom:14px"><div>${seg('ref', Object.entries(DEF).map(([k, x]) => [k, x.titre, EDITION.referentiels[k].length]), liste)}</div>
        ${SERVEUR ? `<div class="actions"><button class="btn btn-secondary btn-sm" id="ref-ajouter">${icon('plus', 13)} Ajouter une ligne</button><button class="btn btn-secondary btn-sm" id="ref-annuler" ${modifie ? '' : 'disabled'}>Annuler les modifications</button><button class="btn btn-primary btn-sm" id="ref-enregistrer" ${modifie ? '' : 'disabled'}>Enregistrer</button></div>` : ''}</div>
      <p class="text-muted prose" style="margin-bottom:12px">Liste unique décidée en ${d.decision}, publiée aux outils par la vue <span class="mono">${d.vue}</span> et par <span class="mono">GET /api/referentiels/${liste}</span>.${!SERVEUR ? ' La modification se fait sur le serveur Matrix.' : SERVEUR_COMMUN ? ` Chaque enregistrement est écrit dans la table <span class="mono">${d.vue.replace('pub_', '')}</span> du serveur commun, contrôlé par ses contraintes et tracé dans le journal ; une ligne retirée y est désactivée, jamais supprimée, car les outils gardent son code.` : ' Chaque enregistrement est contrôlé avec les mêmes règles que la base et tracé dans le journal. Serveur commun non relié (MATRIX_DATABASE_URL) : la liste reste dans Matrix et n’atteint pas encore les outils.'}</p>
      <p class="form-error" id="ref-erreur" hidden></p>
      <div class="table-wrap"><table class="table"><thead><tr>${d.cols.map(c => `<th>${c[1]}</th>`).join('')}${SERVEUR ? '<th></th>' : ''}</tr></thead>
      <tbody>${brouillon.map((row, i) => `<tr>${d.cols.map(c => `<td>${champ(row, i, c)}</td>`).join('')}${SERVEUR ? `<td><button class="btn btn-ghost btn-icon" data-retirer="${i}" title="Retirer la ligne" aria-label="Retirer la ligne">${icon('close', 13)}</button></td>` : ''}</tr>`).join('') || `<tr><td colspan="${d.cols.length + 1}" class="empty">Liste vide.</td></tr>`}</tbody></table></div>
      ${modifie ? '<p class="sub text-muted" style="margin-top:10px">Modifications non enregistrées.</p>' : ''}</div>`;
  };
  root.addEventListener('input', e => {
    const f = e.target.closest('[data-k]'); if (!f) return;
    const row = brouillon[+f.dataset.i], k = f.dataset.k;
    row[k] = f.type === 'checkbox' ? f.checked : f.type === 'number' ? (f.value === '' ? '' : Number(f.value)) : f.value;
    if (f.tagName === 'SELECT' || f.type === 'checkbox') draw();
    else { const b = $('ref-enregistrer'), a = $('ref-annuler'); if (b) b.disabled = a.disabled = false; }
  });
  root.addEventListener('click', async e => {
    if (e.target.closest('#ref-ajouter')) { brouillon.push(DEF[liste].nouveau()); draw(); return; }
    const r = e.target.closest('[data-retirer]'); if (r) { brouillon.splice(+r.dataset.retirer, 1); draw(); return; }
    if (e.target.closest('#ref-annuler')) { brouillon = copie(); draw(); return; }
    if (e.target.closest('#ref-enregistrer')) {
      const lignes = brouillon.map(x => Object.fromEntries(Object.entries(x).map(([k, v]) => [k, v === '' ? null : v])));
      try { await envoyer(`/api/referentiels/${liste}`, lignes); brouillon = copie(); draw(); toast(`${DEF[liste].titre} : enregistré${SERVEUR_COMMUN ? ' sur le serveur commun' : ''}`); }
      catch (err) { const p = $('ref-erreur'); p.textContent = err.message; p.hidden = false; }
    }
  });
  onSeg(root, 'ref', v => { liste = v; brouillon = null; draw(); });
  draw();
};

// ── Santé des tables et des liens (sonde du serveur commun) ─────────────
let SANTE = DATA.sante || null;
async function poster(chemin, corps) {
  const r = await fetch(chemin, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(corps ?? {}) });
  const j = await r.json().catch(() => ({ erreur: 'réponse illisible du serveur' }));
  if (!r.ok) throw new Error(j.erreur || `erreur ${r.status}`);
  return j;
}
const ETAT = { erreur: ['Erreur', 'tag-accent'], attention: ['Attention', 'tag-outline'], ok: ['OK', 'tag-neutral'], info: ['Info', 'tag-neutral'] };
const etatTag = g => `<span class="tag ${(ETAT[g] || ETAT.info)[1]}">${(ETAT[g] || ETAT.info)[0]}</span>`;
const octets = n => n == null ? '—' : n < 1024 * 1024 ? `${Math.round(n / 1024)} Ko` : n < 1024 ** 3 ? `${(n / 1024 / 1024).toFixed(1)} Mo` : `${(n / 1024 ** 3).toFixed(2)} Go`;
const quand = d => d ? new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const LIENS_A_TRAITER = ['a_retirer', 'hors_registre', 'a_appliquer', 'vue_absente', 'en_attente'];
const SANS_SONDE = `<div class="card" style="max-width:720px"><div class="card-kicker">Sonde du serveur commun</div>
  <p class="prose">Matrix n’a pas encore lu le serveur PostgreSQL commun. Définissez <span class="mono">MATRIX_DATABASE_URL</span> sur le serveur Matrix (rôle <span class="mono">matrix_app</span>) : Matrix lira lui-même les tables, les liens, les vues <span class="mono">pub_</span> et les droits de chaque outil, les reportera dans la bibliothèque et les graphes, et calculera cet état de santé à chaque lecture (toutes les heures par défaut, <span class="mono">MATRIX_SYNCHRO_MINUTES</span>).</p></div>`;
function navLiens() { const el = $('nav-liens'); if (!el) return; const n = (SANTE?.liens || []).filter(l => LIENS_A_TRAITER.includes(l.etat)).length; el.textContent = n; el.hidden = !n; el.title = n + ' lien(s) à traiter'; }
async function relire(bouton) {
  bouton.disabled = true; bouton.textContent = 'Lecture du serveur…';
  try { const j = await poster('/api/synchro'); SANTE = j.sante; toast('Serveur commun relu'); rendered.sante = rendered.liens = false; show(current); navLiens(); }
  catch (e) { toast(e.message); bouton.disabled = false; bouton.textContent = 'Relire le serveur'; }
}

RENDER.sante = () => {
  const root = $('s-sante');

  const st = { vue: 'tables', filtre: 'surveiller', app: 'toutes' };

  const draw = () => {
    const apps = Object.keys(S.parOutil);
    let body = '';
    if (st.vue === 'tables') {
      const lignes = S.tables.filter(t => (st.app === 'toutes' || t.app === st.app) && (st.filtre === 'toutes' || t.etat !== 'ok'))
        .sort((a, b) => ({ erreur: 0, attention: 1, ok: 2 }[a.etat] - { erreur: 0, attention: 1, ok: 2 }[b.etat]) || a.app.localeCompare(b.app) || a.table.localeCompare(b.table));
      body = `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">${seg('sfiltre', [['surveiller', 'À surveiller', S.tables.filter(t => t.etat !== 'ok').length], ['toutes', 'Toutes', S.tables.length]], st.filtre)}
        ${seg('sapp', [['toutes', 'Tous les outils'], ...apps.map(a => [a, APPS[a]?.nom || a])], st.app)}</div>
        ${lignes.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Table</th><th>État</th><th>Constats</th><th class="num">Lignes</th><th class="num">Taille</th><th>Analysée le</th></tr></thead><tbody>
        ${lignes.slice(0, 500).map(t => `<tr><td class="nowrap">${appMark(t.app, 16)} <button class="link-btn mono" data-open="${esc(key(t.app, t.table))}">${esc(t.table)}</button></td><td>${etatTag(t.etat)}</td>
          <td>${t.constats.filter(c => st.filtre === 'toutes' || c.gravite !== 'info').map(c => `<div class="sub"><span class="${c.gravite === 'info' ? 'text-muted' : ''}" title="${esc(R[c.regle].aide)}">${esc(R[c.regle].libelle)}</span>${c.detail ? ` <span class="text-muted mono">· ${esc(c.detail)}</span>` : ''}</div>`).join('') || '<span class="text-muted">—</span>'}</td>
          <td class="num">${t.stats?.lignes == null ? '—' : fmt(t.stats.lignes)}</td><td class="num">${octets(t.stats?.taille)}</td><td class="tabnum text-muted nowrap">${quand(t.stats?.analyseLe)}</td></tr>`).join('')}</tbody></table></div>`

        <div class="block-title" style="margin-top:22px">Règles</div>
        <div class="table-wrap"><table class="table"><tbody>${Object.entries(R).map(([k, r]) => `<tr><td class="nowrap">${etatTag(r.gravite)}</td><td>${esc(r.libelle)}</td><td class="text-muted">${esc(r.aide)}</td></tr>`).join('')}</tbody></table></div>`;
    } else if (st.vue === 'references') {

        <div class="table-wrap"><table class="table"><thead><tr><th>Réf.</th><th>Référence</th><th>De → vers</th><th>État</th><th class="num">Valeurs</th><th class="num">Orphelines</th><th>Exemples</th></tr></thead><tbody>
        ${S.references.map(r => `<tr><td class="mono">${esc(r.id)}</td><td>${esc(r.libelle)} <span class="text-muted sub">· ${esc(r.decision)}</span></td><td class="mono sub">${esc(r.de)} → ${esc(r.vers)}</td>
          <td>${r.etat === 'non_controlable' ? `<span class="text-muted" title="${esc(r.detail)}">Non contrôlable</span>` : etatTag(r.gravite)}</td><td class="num">${r.valeurs ?? '—'}</td><td class="num">${r.orphelines ?? '—'}</td><td class="mono sub">${esc((r.exemples || []).join(', '))}${r.etat === 'non_controlable' ? `<span class="text-muted">${esc(r.detail)}</span>` : ''}</td></tr>`).join('')}</tbody></table></div>`;

        ${M.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Outil</th><th>État</th><th>Journal</th><th class="num">Migrations</th><th>Dernière</th><th>Hors migration depuis</th></tr></thead><tbody>
        ${M.map(m => `<tr><td class="nowrap">${appMark(m.app, 16)} ${APPS[m.app]?.nom || esc(m.app)}</td><td>${etatTag(m.gravite)} <span class="sub">${esc(EM[m.etat]?.libelle || m.etat)}</span></td><td class="mono sub">${esc(m.journal || '—')}${m.erreur ? `<div class="text-muted">${esc(m.erreur)}</div>` : ''}</td>

      body = S.socle.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Gravité</th><th>Objet</th><th>Constat</th></tr></thead><tbody>${S.socle.map(v => `<tr><td>${etatTag(v.gravite)}</td><td class="mono">${esc(v.objet)}</td><td>${esc(v.constat)}</td></tr>`).join('')}</tbody></table></div>`

    }
    root.innerHTML = `<div class="wrap">
      <div class="top"><div><p class="text-muted">État global ${etatTag(S.etat)} · serveur commun lu le ${quand(S.luLe)}</p></div>
        ${SERVEUR ? `<div class="actions"><button class="btn btn-secondary" id="sante-relire">${icon('pulse', 14)} Relire le serveur</button><button class="btn btn-secondary" data-go="liens">${icon('ref', 14)} Liens entre outils</button></div>` : ''}</div>
      <div class="kpis">${apps.map(a => { const p = S.parOutil[a]; return `<button class="card kpi" data-sapp="${a}"><span class="card-kicker">${appMark(a, 14)} ${APPS[a]?.nom || a}</span><span class="kpi-value">${p.tables}</span><span class="card-meta">${etatTag(p.etat)} ${p.erreur ? p.erreur + ' en erreur · ' : ''}${p.attention} à surveiller · ${fmt(p.lignes)} lignes · ${octets(p.taille)}</span></button>`; }).join('')}</div>

  const outilDe = v => v.split('.')[0], appDe = l => l.replace(/_app$/, '');
  const decision = async (vue, lecteur, statut) => {
    let motif = null;
    if (statut === 'refuse') { motif = prompt(`Motif du refus : ${lecteur} ne lira pas ${vue}`); if (!motif) return; }
    else if (statut === 'autorise') motif = prompt(`Autoriser ${lecteur} à lire ${vue}. Motif (facultatif) :`) ?? null;
    try { const j = await poster('/api/liens', { vue, lecteur, statut, motif }); SANTE.liens = j.liens; toast(statut === 'autorise' ? 'Lien autorisé : droit posé au prochain passage de 90-droits.sql (15 minutes au plus)' : statut === 'refuse' ? 'Lien refusé : droit retiré au prochain passage de 90-droits.sql (15 minutes au plus)' : 'Demande enregistrée'); draw(); navLiens(); }
    catch (e) { toast(e.message); }
  };
  const draw = () => {
    const L = SANTE.liens;
    const lignes = L.filter(l => (st.filtre === 'tous' || (st.filtre === 'traiter' ? LIENS_A_TRAITER.includes(l.etat) : l.etat === st.filtre)) && (st.lecteur === 'tous' || l.lecteur === st.lecteur));
    const producteurs = [...new Set(L.map(l => outilDe(l.vue)))].sort(), lecteurs = [...new Set(L.map(l => l.lecteur))].sort();
    const nb = (p, l) => L.filter(x => outilDe(x.vue) === p && x.lecteur === l && x.statut === 'autorise').length;
    const vuesExistantes = (SANTE.vues || []).map(v => v.vue).sort();
    root.innerHTML = `<div class="wrap">
      <div class="top"><div><p class="text-muted prose">Un lien autorise un outil à lire la vue <span class="mono">pub_</span> d’un autre. Matrix tient le registre (<span class="mono">matrix.liens</span>) ; <span class="mono">partage/90-droits.sql</span> l’applique : droit posé pour un lien autorisé, retiré sinon. La tâche planifiée <span class="mono">appliquer-liens.sh</span> le rejoue dans les 15 minutes qui suivent une décision.</p></div>
        ${SERVEUR ? `<div class="actions"><button class="btn btn-secondary" id="liens-relire">${icon('pulse', 14)} Relire le serveur</button></div>` : ''}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
        ${seg('lfiltre', [['traiter', 'À traiter', L.filter(l => LIENS_A_TRAITER.includes(l.etat)).length], ['applique', 'Appliqués', L.filter(l => l.etat === 'applique').length], ['refuse', 'Refusés', L.filter(l => l.etat === 'refuse').length], ['outil_absent', 'Outil absent', L.filter(l => l.etat === 'outil_absent').length], ['tous', 'Tous', L.length]], st.filtre)}
        ${seg('llecteur', [['tous', 'Tous les lecteurs'], ...lecteurs.map(l => [l, APPS[appDe(l)]?.nom || 'Matrix'])], st.lecteur)}</div>
      ${lignes.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Vue publiée</th><th>Lecteur</th><th>Registre</th><th>État</th><th>Décision</th>${SERVEUR ? '<th></th>' : ''}</tr></thead><tbody>
        ${lignes.map(l => `<tr><td class="nowrap">${APPS[outilDe(l.vue)] ? appMark(outilDe(l.vue), 16) : icon('matrix', 16)} <span class="mono">${esc(l.vue)}</span></td>
          <td class="nowrap">${APPS[appDe(l.lecteur)] ? appMark(appDe(l.lecteur), 16) + ' ' + APPS[appDe(l.lecteur)].nom : 'Matrix'}</td>
          <td>${l.statut ? esc({ autorise: 'Autorisé', refuse: 'Refusé', demande: 'Demandé' }[l.statut]) : '<span class="text-muted">absent</span>'}${l.origine === 'convention' ? ' <span class="text-muted sub">· convention</span>' : ''}</td>
          <td>${etatTag(l.gravite)} <span class="sub">${esc(E[l.etat]?.libelle || l.etat)}</span></td>
          <td class="sub text-muted">${l.decide_par ? `${esc(l.decide_par)} · ${quand(l.decide_le)}` : l.demande_par ? `demandé par ${esc(l.demande_par)} · ${quand(l.demande_le)}` : '—'}${l.motif ? `<div>${esc(l.motif)}</div>` : ''}</td>
          ${SERVEUR ? `<td class="nowrap">${l.statut !== 'autorise' ? `<button class="btn btn-secondary btn-sm" data-decide="autorise" data-vue="${esc(l.vue)}" data-lecteur="${esc(l.lecteur)}">Autoriser</button>` : ''} ${l.statut !== 'refuse' ? `<button class="btn btn-ghost btn-sm" data-decide="refuse" data-vue="${esc(l.vue)}" data-lecteur="${esc(l.lecteur)}">Refuser</button>` : ''}</td>` : ''}</tr>`).join('')}</tbody></table></div>`
        : `<p class="text-muted">Aucun lien dans cette sélection.</p>`}
      ${SERVEUR ? `<div class="block-title" style="margin-top:22px">Nouvelle demande de lien</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <select class="input" id="ld-vue">${vuesExistantes.map(v => `<option>${esc(v)}</option>`).join('')}</select>
          <select class="input" id="ld-lecteur">${['keystone_app', 'codex_app', 'cursus_app', 'vigie_app', 'arche_app', 'crucible_app', 'matrix_app'].map(l => `<option value="${l}">${APPS[appDe(l)]?.nom || 'Matrix'}</option>`).join('')}</select>
          <input class="input" id="ld-motif" placeholder="Besoin de l’outil lecteur" style="flex:1;min-width:220px">
          <button class="btn btn-primary btn-sm" id="ld-envoyer">Enregistrer la demande</button></div>` : ''}
      <div class="block-title" style="margin-top:22px">Liens autorisés, par outil <span>publie → lit</span></div>
      <div class="table-wrap"><table class="table"><thead><tr><th>Outil qui publie</th>${lecteurs.map(l => `<th class="num">${APPS[appDe(l)]?.nom || 'Matrix'}</th>`).join('')}</tr></thead><tbody>
        ${producteurs.map(p => `<tr><td class="nowrap">${APPS[p] ? appMark(p, 16) + ' ' + APPS[p].nom : 'Matrix'}</td>${lecteurs.map(l => `<td class="num">${nb(p, l) || '<span class="text-muted">·</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div class="block-title" style="margin-top:22px">Journal des décisions <span>${(SANTE.journalLiens || []).length}</span></div>
      ${(SANTE.journalLiens || []).length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Quand</th><th>Qui</th><th>Lien</th><th>Changement</th><th>Motif</th></tr></thead><tbody>${SANTE.journalLiens.slice(0, 100).map(j => `<tr><td class="tabnum text-muted nowrap">${quand(j.le)}</td><td>${esc(j.par)}</td><td class="mono sub">${esc(j.lecteur)} → ${esc(j.vue)}</td><td>${esc(j.avant || 'nouveau')} → ${esc(j.apres)}</td><td class="text-muted">${esc(j.motif || '')}</td></tr>`).join('')}</tbody></table></div>` : '<p class="text-muted">Aucune décision.</p>'}
    </div>`;
  };
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-decide]'); if (b) return decision(b.dataset.vue, b.dataset.lecteur, b.dataset.decide);
    if (e.target.closest('#liens-relire')) return relire(e.target.closest('#liens-relire'));
    if (e.target.closest('#ld-envoyer')) {
      const vue = $('ld-vue').value, lecteur = $('ld-lecteur').value, motif = $('ld-motif').value.trim();
      if (!motif) return toast('Indiquez le besoin de l’outil lecteur');
      poster('/api/liens', { vue, lecteur, statut: 'demande', motif }).then(j => { SANTE.liens = j.liens; st.filtre = 'traiter'; toast('Demande enregistrée'); draw(); navLiens(); }, err => toast(err.message));
    }
  });
  onSeg(root, 'lfiltre', v => { st.filtre = v; draw(); });
  onSeg(root, 'llecteur', v => { st.lecteur = v; draw(); });
  draw();
};

const SANS_SERVEUR_COMMUN = quoi => `<div class="card" style="max-width:720px"><div class="card-kicker">Serveur commun</div>
  <p class="prose">${quoi} se lit sur le serveur PostgreSQL commun. Il s’affiche ici quand Matrix y est relié (<span class="mono">MATRIX_DATABASE_URL</span>, rôle <span class="mono">matrix_app</span>).</p></div>`;
async function lireApi(chemin, params = {}) {
  const q = new URLSearchParams(Object.entries(params).filter(([, v]) => v != null && v !== ''));
  const r = await fetch(`${chemin}${q.size ? '?' + q : ''}`);
  const j = await r.json().catch(() => ({ erreur: 'réponse illisible du serveur' }));
  if (!r.ok) throw new Error(j.erreur || `erreur ${r.status}`);
  return j;
}
const nomOutil = o => APPS[o] ? `${appMark(o, 16)} ${APPS[o].nom}` : esc(o || '—');
const champsFiltre = (prefixe, champs) => champs.map(([k, ph, type, largeur]) => `<input class="input" id="${prefixe}-${k}" placeholder="${esc(ph)}" ${type ? `type="${type}"` : ''} style="width:${largeur || 160}px">`).join('');

RENDER.correspondances = () => {
  const root = $('s-correspondances');

  const STA = { propose: 'Proposée', valide: 'Validée', a_creer: 'À créer', abandonne: 'Abandonnée', rejete: 'Rejetée', retire: 'Retirée' };
  const DEC = { propose: ['valide', 'rejete', 'a_creer', 'abandonne'], a_creer: ['valide', 'abandonne'], valide: ['retire'] };
  const BTN = { valide: 'Valider', rejete: 'Rejeter', a_creer: 'À créer', abandonne: 'Abandonner', retire: 'Retirer' };
  const st = { objet: '', statut: 'propose', lignes: [], compte: [], erreur: null };
  const charger = async () => {
    try { const j = await lireApi('/api/correspondances', { objet: st.objet, statut: st.statut }); Object.assign(st, { lignes: j.lignes, compte: j.compte, erreur: null }); }
    catch (e) { st.erreur = e.message; }
    draw();
  };
  const nb = (objet, statut) => st.compte.filter(c => (!objet || c.objet === objet) && (!statut || c.statut === statut)).reduce((n, c) => n + c.n, 0);
  const decider = async (id, statut) => {
    const c = st.lignes.find(x => String(x.id) === id); let pivot, note;
    if (statut === 'valide') { pivot = prompt(`Clé commune pour ${c.outil} · ${c.table_locale} · ${c.id_local}`, c.pivot || ''); if (pivot == null) return; }
    if (['rejete', 'retire', 'abandonne'].includes(statut)) { note = prompt(`Motif (${BTN[statut].toLowerCase()})`); if (!note) return; }
    try { await poster('/api/correspondances', { id: c.id, statut, pivot, note }); toast(`Correspondance ${STA[statut].toLowerCase()}`); charger(); }
    catch (e) { toast(e.message); }
  };
  const draw = () => {
    root.innerHTML = `<div class="wrap">
      <p class="text-muted prose" style="margin-bottom:12px">Pendant la transition, chaque identifiant local d’un outil (uuid Keystone, slug Codex ou Vigie, entier Cursus…) est relié à la clé commune : matricule, code projet, code de site, d’unité ou de pays. Matrix propose ; les RH valident les personnes, l’informatique le reste. Chaque outil lit les lignes décidées dans <span class="mono">matrix.pub_correspondances</span> et pose lui-même sa clé locale.</p>

        ${seg('cobjet', [['', 'Tous', nb('', st.statut)], ...Object.entries(OBJ).map(([k, l]) => [k, l, nb(k, st.statut)])], st.objet)}
        ${seg('cstatut', [...Object.entries(STA).map(([k, l]) => [k, l, nb(st.objet, k)]), ['', 'Tous', nb(st.objet, '')]], st.statut)}</div>
      ${st.erreur ? `<p class="form-error">${esc(st.erreur)}</p>` : st.lignes.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Objet</th><th>Outil</th><th>Identifiant local</th><th>Libellé</th><th>Clé commune</th><th>Méthode</th><th>Statut</th><th>Décision</th><th></th></tr></thead><tbody>
        ${st.lignes.map(c => `<tr><td>${esc(c.objet)}</td><td class="nowrap">${nomOutil(c.outil)}</td>
          <td class="mono sub">${esc(c.table_locale)} · ${esc(c.id_local)}${c.cle_naturelle ? `<div class="text-muted">${esc(c.cle_naturelle)}</div>` : ''}</td>
          <td>${esc(c.libelle_local || '')}</td><td class="mono">${esc(c.pivot || '—')}${c.pivot_provisoire ? ' <span class="tag tag-outline">provisoire</span>' : ''}</td>
          <td class="sub">${esc(c.methode)}</td><td><span class="tag ${c.statut === 'valide' ? 'tag-neutral' : c.statut === 'propose' ? 'tag-accent' : 'tag-outline'}">${STA[c.statut] || esc(c.statut)}</span></td>
          <td class="sub text-muted">${c.decide_par ? `${esc(c.decide_par)} · ${quand(c.decide_le)}` : `proposée par ${esc(c.propose_par)} · ${quand(c.propose_le)}`}${c.note ? `<div>${esc(c.note)}</div>` : ''}</td>
          <td class="nowrap">${(DEC[c.statut] || []).map((d, i) => `<button class="btn ${i ? 'btn-ghost' : 'btn-secondary'} btn-sm" data-cdecide="${d}" data-id="${c.id}">${BTN[d]}</button>`).join(' ')}</td></tr>`).join('')}</tbody></table></div>
        <p class="sub text-muted" style="margin-top:8px">${st.lignes.length} correspondance(s) · les 1 000 premières au plus.</p>` : '<p class="text-muted">Aucune correspondance pour ces filtres.</p>'}</div>`;
  };
  root.addEventListener('click', e => { const b = e.target.closest('[data-cdecide]'); if (b) decider(b.dataset.id, b.dataset.cdecide); });
  onSeg(root, 'cobjet', v => { st.objet = v; charger(); });
  onSeg(root, 'cstatut', v => { st.statut = v; charger(); });
  charger();
};

  const root = $('s-administration'); let tab = 'connexions';
  const ROLES = ['Administrateur des données', 'Responsable de domaine', 'Lecteur'];
  const PERMS = [['Consulter le catalogue et le graphe', [1, 1, 1]], ['Voir un extrait des données', [1, 1, 0]], ['Voir les données sensibles', [1, 0, 0]], ['Documenter une table ou une colonne', [1, 1, 0]], ['Lancer une collecte', [1, 0, 0]], ['Exécuter une requête de modification', [1, 0, 0]], ['Gérer les connexions et les droits', [1, 0, 0]]];
  const JOURNAL = (EDITION.journal || []).slice().reverse();
  const draw = () => {
    let body = '';
    if (tab === 'connexions') body = `<div class="table-wrap"><table class="table"><thead><tr><th>Base</th><th>Aujourd’hui</th><th>Cible validée le 15/10/2026</th><th>Rôle de l’outil</th><th>Accès de Matrix</th></tr></thead><tbody>
      ${APP_IDS.map(a => `<tr><td class="nowrap">${appMark(a)} ${APPS[a].nom}</td><td>${esc(APPS[a].moteur)}<div class="sub text-muted mono">${esc(APPS[a].donnees)}</div></td><td>Schéma <span class="mono">${a}</span> de la base <span class="mono">epc2i</span>${a === 'cursus' ? '<div class="sub text-muted">migration depuis SQLite, 37 clés étrangères à déclarer</div>' : ''}</td><td class="mono">${a}_app</td><td><span class="mono">matrix_lecture</span><div class="sub text-muted">lecture seule${a === 'cursus' || a === 'vigie' ? ', colonnes sensibles exclues' : ''}</div></td></tr>`).join('')}
      <tr><td class="nowrap">${icon('matrix', 16)} Matrix</td><td class="text-muted">—</td><td>Schéma <span class="mono">matrix</span></td><td class="mono">matrix_app</td><td class="text-muted">catalogue, correspondances, historique</td></tr></tbody></table></div>
      <p class="note" style="margin-top:14px">Serveur PostgreSQL commun avec un schéma par outil : validé le 15 octobre 2026. Chaque outil reste seul propriétaire de son schéma et ne voit pas ceux des autres. Matrix lit tout en lecture seule, sans les colonnes sensibles. En développement et dans l’application Mac, chaque outil garde sa base embarquée.</p>`;
    else if (tab === 'collecte') {
      const TYPES = TYPES_HIST;
      body = `<div class="table-wrap"><table class="table"><thead><tr><th>Base</th><th>Source du schéma</th><th class="num">Tables</th><th class="num">À documenter</th></tr></thead><tbody>
        ${CAT.apps.map(a => `<tr><td class="nowrap">${appMark(a.id)} ${APPS[a.id].nom}</td><td>${esc(a.source.replace(/\d{4}-\d{2}-\d{2}T[\d:.]+Z/, d => new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })))}</td><td class="num">${a.tables.length}</td><td class="num">${a.tables.filter(t => t.nouvelle).length}</td></tr>${(a.avertissements || []).length ? `<tr><td></td><td colspan="3" class="sub text-muted">${a.avertissements.length} instruction(s) de migration non reconnue(s) : ${esc(a.avertissements.slice(0, 3).join(' · '))}${a.avertissements.length > 3 ? '…' : ''}</td></tr>` : ''}`).join('')}</tbody></table></div>
        <div class="block-title" style="margin-top:22px">Déclaration des nouvelles tables</div>
        <ol class="prose" style="margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
          <li>Matrix lit lui-même le serveur PostgreSQL commun (sonde, rôle <span class="mono">matrix_app</span>, variable <span class="mono">MATRIX_DATABASE_URL</span>) : tables, colonnes, clés, liens, commentaires, vues <span class="mono">pub_</span> et droits de chaque outil, au démarrage puis toutes les heures, ou à la demande (écran « Santé des données »). Un outil peut aussi envoyer son schéma (<span class="mono">POST /api/declarations</span>, jeton partagé). Ordre de priorité : serveur commun, puis déclaration de l’outil, puis migrations des dépôts (lues sans rien exécuter), puis catalogue embarqué.</li>
          <li>Matrix compare la déclaration à la collecte précédente. Une table inconnue est ajoutée à la bibliothèque, marquée « à documenter ».</li>
          <li>La nouvelle table est comparée à celles des autres outils. Si elle ressemble à une table existante, elle est signalée comme doublon possible.</li>
          <li>Pour un outil absent du serveur commun, Matrix lit son schéma dans le code source (migrations).</li>
        </ol>
        <div class="block-title" style="margin-top:22px">Déclarations reçues <span>${(DATA.declarations || []).length}</span></div>
        ${(DATA.declarations || []).length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Outil</th><th>Origine</th><th>Reçue le</th><th>Version</th><th class="num">Tables</th></tr></thead><tbody>${DATA.declarations.map(d => `<tr><td class="nowrap">${appMark(d.app)} ${APPS[d.app].nom}</td><td>${d.origine === 'serveur' ? 'Serveur commun (fait foi)' : 'Déclaration de l’outil'}</td><td class="tabnum">${new Date(d.declareLe).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })}</td><td class="mono text-muted">${esc(d.version || '—')}</td><td class="num">${d.tables}</td></tr>`).join('')}</tbody></table></div>`
          : `<p class="text-muted">Aucun outil n’a encore déclaré son schéma. Les déclarations arrivent quand le module de déclaration est installé dans l’outil et que MATRIX_URL et MATRIX_TOKEN y sont définis.</p>`}
        <div class="block-title" style="margin-top:22px">Historique des schémas <span>${HIST.length}</span></div>
        ${HIST.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Quand</th><th>Base</th><th>Changement</th><th>Objet</th><th>Détail</th></tr></thead><tbody>${HIST.slice().reverse().slice(0, 1000).map(e => `<tr><td class="tabnum text-muted nowrap">${new Date(e.date).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })}</td><td>${APPS[e.app].nom}</td><td>${TYPES[e.type] || esc(e.type)}${e.doublonsPossibles ? ` <span class="tag tag-outline">doublon possible : ${esc(e.doublonsPossibles.join(', '))}</span>` : ''}</td><td class="mono">${esc(e.table || '—')}${e.colonne ? '.' + esc(e.colonne) : ''}</td><td class="sub">${detailHist(e)}</td></tr>`).join('')}</tbody></table></div>`
          : `<p class="text-muted">Aucun changement depuis la première collecte du ${new Date(CAT.generatedAt).toLocaleDateString('fr-FR')}.</p>`}
        <div class="block-title" style="margin-top:22px">Commandes</div><div class="code">npm start                                # serveur Matrix (page + réception des déclarations)
node outils/collecteur.mjs ..            # relire les schémas dans les dépôts et comparer
node outils/construire-maquette.mjs      # reconstruire la maquette publiée</div>`;
    }
    else if (tab === 'droits') body = `<div class="table-wrap"><table class="table"><thead><tr><th>Droit</th>${ROLES.map(r => `<th style="text-align:center">${r}</th>`).join('')}</tr></thead><tbody>${PERMS.map(([p, g]) => `<tr><td>${p}</td>${g.map(v => `<td style="text-align:center"><span class="perm ${v ? 'on' : 'off'}">${icon(v ? 'tick' : 'dash', 15, 1.8)}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="sub text-muted" style="margin-top:10px">Matrice proposée, à valider. En attendant l’authentification commune aux outils (question O-02 de Codex), Matrix est protégé par un mot de passe (variable MATRIX_MOT_DE_PASSE) : toute personne qui le connaît a les droits d’administrateur, et ses modifications sont tracées sous l’identifiant saisi.</p>`;
    else body = JOURNAL.length ? `<p class="sub text-muted" style="margin-bottom:8px">Modifications faites dans Matrix : documentation, décisions, référentiels. ${JOURNAL.length} dernières.</p><div class="table-wrap"><table class="table"><thead><tr><th>Quand</th><th>Qui</th><th>Action</th><th>Objet</th><th>Détail</th></tr></thead><tbody>${JOURNAL.map(r => `<tr><td class="tabnum text-muted nowrap">${new Date(r.quand).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })}</td><td>${esc(r.qui)}</td><td>${esc(r.action)}</td><td class="mono">${esc(r.objet)}</td><td class="text-muted">${esc(r.detail)}</td></tr>`).join('')}</tbody></table></div>`
      : `<p class="text-muted">${SERVEUR ? 'Aucune modification pour l’instant. Chaque documentation de table, décision ou changement de référentiel fait dans Matrix apparaîtra ici, avec son auteur.' : 'Le journal est tenu par le serveur Matrix.'}</p>`;
    root.querySelector('#ad-body').innerHTML = body;
  };
  root.innerHTML = `<div class="wrap"><div style="margin-bottom:16px">${seg('ad', [['connexions', 'Connexions'], ['collecte', 'Collecte'], ['droits', 'Rôles & droits'], ['journal', 'Journal']], tab)}</div><div id="ad-body"></div></div>`;
  onSeg(root, 'ad', v => { tab = v; draw(); });
  draw();
};

show(location.hash.slice(1) || 'accueil');
})();
</script>
