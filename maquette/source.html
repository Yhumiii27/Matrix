<title>Matrix</title>
<!-- Favicon : logo de Matrix de Norma 2.3 (norma/charte/logos/matrix.svg), posé par outils/page.mjs. -->
<!--FAVICON-->
<meta name="description" content="Matrix : bibliothèque et graphe des bases de données de Keystone, Codex, Cursus, Vigie, Arche, Crucible, Clavis, Modulus et Vector">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<!-- Charte de Norma 2.3 (copie norma/charte, servie par Matrix : /charte/…) : jetons et thèmes sombre / clair, cibles
     tactiles, coque commune (COQUE.md). La maquette publiée comme artefact les recopie dans la page (outils/page.mjs). -->
<link rel="stylesheet" href="/charte/nocturne.css">
<link rel="stylesheet" href="/charte/touch.css">
<link rel="stylesheet" href="/charte/coque.css">
<style>
/* Coque commune de Norma 2.0 (norma/charte/COQUE.md, classes .coque-… de coque.css) : barre latérale 232 px avec la
   recherche de pages ⌘K, un en-tête .coque-header par écran (fil, titre 26 px, recherche du catalogue, date de collecte,
   puis la paire langue / affichage empilée), barre supérieure et tiroir ≤ 1024 px, panneau latéral 640 px. Couleurs,
   tailles de texte et mesures : jetons de nocturne.css ; ce bloc n'ajoute que ce qui est propre à Matrix. */
:root {
  /* Couleurs des applications (propres à Matrix) : peu saturées, pour le graphe et les pastilles. */
  --app-keystone: #7fa6d6; --app-codex: #a99de6; --app-cursus: #d6a77f; --app-vigie: #79c2a2; --app-arche: #d68fa8; --app-crucible: #c4b46e; --app-clavis: #8fb8c9; --app-matrix: #b3a1d9; --app-modulus: #a9c47a; --app-vector: #e0906e; --app-externe: #75798c;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --muted: color-mix(in srgb, var(--color-text) 55%, transparent);
  --rule: color-mix(in srgb, var(--color-text) 8%, transparent);
}
:root[data-theme="light"] {
  /* Couleurs des applications, assombries pour rester lisibles sur fond blanc (contraste ≥ 4,5:1). */
  --app-keystone: #3f6fa8; --app-codex: #6a5bc4; --app-cursus: #9a5f2a; --app-vigie: #287a57; --app-arche: #b04a70; --app-crucible: #7d6c1f; --app-clavis: #2f6f87; --app-matrix: #5f51b8; --app-modulus: #4f6b1f; --app-vector: #a8472a; --app-externe: #6a6e80;
  /* Textes secondaires à 68 % du texte en clair (Norma 1.0.2 : 55 % ne donnait que 3,7:1 sur blanc). */
  --muted: color-mix(in srgb, var(--color-text) 68%, transparent);
  --rule: color-mix(in srgb, var(--color-text) 12%, transparent);
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: var(--text-ui); line-height: 1.45; overflow: hidden; }
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, h4, h5, h6 { font-weight: 500; line-height: 1.12; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
h6 { font-size: var(--text-ui); letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0; }
a { color: var(--color-accent); text-underline-offset: 3px; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--color-neutral-800); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }
.text-muted { color: var(--muted); }
.tabnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 0.94em; letter-spacing: -0.01em; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font-size: 11px; }
.nowrap { white-space: nowrap; }

/* Boutons, champs, segments, étiquettes (Nocturne) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-decoration: none; font: inherit; font-weight: 500; font-size: var(--text-ui); line-height: 1.2; color: var(--color-text); background: transparent; border: 1px solid transparent; padding: 6px 10px; border-radius: var(--radius-md); white-space: nowrap; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }
.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: 4px; }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-icon { width: 32px; height: 32px; padding: 0; }
.btn-sm { font-size: var(--text-control); padding: 4px 8px; }
.input { width: 100%; min-height: 34px; padding: 6px 10px; font: inherit; font-size: var(--text-ui); color: var(--color-text); caret-color: var(--color-accent); background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: var(--radius-md); }
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
select.input { appearance: none; width: auto; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
select.input option { background: var(--color-surface); color: var(--color-text); }
.search { position: relative; }
.menu-export { position: relative; } .menu-export > summary { list-style: none; cursor: pointer; } .menu-export > summary::-webkit-details-marker { display: none; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: .6; pointer-events: none; }
.search .input { padding-left: 32px; }
.seg { display: inline-flex; overflow-x: auto; scrollbar-width: none; border: 1px solid var(--color-divider); border-radius: var(--radius-md); flex: none; max-width: 100%; }
.list-head > div, .toolbar > div { min-width: 0; max-width: 100%; }
.seg button { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; font: inherit; font-size: var(--text-small); color: inherit; background: transparent; border: 0; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--color-divider); }
.seg button[aria-pressed="true"] { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }
.seg button:not([aria-pressed="true"]):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg button:focus-visible { outline-offset: -2px; }
.seg .n { color: var(--muted); font-size: 11px; }
.seg-icons button { padding: 5px 8px; min-height: 28px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; letter-spacing: .02em; padding: 2px 8px; border-radius: 6px; white-space: nowrap; line-height: 1.5; }
.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }
.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }
.tag-outline { box-shadow: inset 0 0 0 1px var(--color-accent); color: var(--color-accent-300); }
.tag-ghost { box-shadow: inset 0 0 0 1px var(--color-divider); color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.card { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--color-surface); }
.card-kicker { font-size: var(--text-micro); letter-spacing: .1em; text-transform: uppercase; color: var(--color-accent); }
.card-meta { font-size: 11px; color: var(--muted); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.sec-title { opacity: .7; }
.sec-link { font-size: var(--text-small); text-decoration: none; white-space: nowrap; background: none; border: 0; color: var(--color-accent); cursor: pointer; font: inherit; font-size: var(--text-small); padding: 0; }
.hairline { border-bottom: 1px solid var(--rule); }

/* Tableaux : filets qui s'estompent aux deux bouts */
.table { width: 100%; border-collapse: collapse; font-size: var(--text-ui); }
.table th { text-align: left; font-size: var(--text-eyebrow); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 60%, transparent); padding: 6px 8px; white-space: nowrap; }
.table td { padding: 7px 8px; vertical-align: top; }
.table thead tr { background: linear-gradient(to right, transparent, var(--color-divider) 48px, var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px; }
.table tbody tr { background: linear-gradient(to right, transparent, var(--rule) 48px, var(--rule) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px; }
.table tbody tr.click { cursor: pointer; }
.table tbody tr.click:hover { background: linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent), color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%, linear-gradient(to right, transparent, var(--rule) 48px, var(--rule) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px; }
.table tbody tr[aria-selected="true"] { box-shadow: inset 2px 0 0 var(--color-accent); }
.table tbody tr[aria-selected="true"] .t-name { color: var(--color-accent-300); }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; min-width: 0; }

/* Coque (Norma 2.0, COQUE.md) : grille .coque, barre latérale .coque-side, colonne .coque-main. Sur grand écran la page
   tient dans la fenêtre : l'en-tête de l'écran reste en place et l'écran défile seul (volets du catalogue, graphe). */
.coque { height: 100vh; }
.coque-main { height: 100vh; min-height: 0; overflow: hidden; }
.coque-entry .coque-badge[hidden] { display: none; }
.entete-outils { display: none; }
.coque-side-foot .overline { font-size: var(--text-eyebrow); text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--color-neutral-500); padding: 0 8px; }
.linked { display: flex; align-items: center; gap: 8px; font-size: var(--text-ui); padding: 3px 8px; color: var(--color-neutral-300); }
.mark { width: 18px; height: 18px; flex: none; border-radius: var(--radius-sm); border: 1px solid currentColor; display: inline-grid; vertical-align: middle; place-items: center; font-size: 9px; font-weight: var(--weight-strong); }
.coque-user.is-static { cursor: default; }
.coque-user.is-static:hover { background: var(--color-surface); }
.coque-status-date .tag { font-size: 11px; }
/* Rôle Lecture (E-02) : boutons de saisie masqués ; le serveur refuse de toute façon les modifications (403). */
.lecture-seule #g-nouveau, .lecture-seule [data-g-modifier], .lecture-seule #qr-nouvelle, .lecture-seule [data-qr], .lecture-seule #pub-nouvelle { display: none !important; }
.app-main { flex: 1; min-height: 0; position: relative; }
.vue { position: absolute; inset: 0; display: flex; flex-direction: column; gap: var(--shell-gap); min-height: 0; }
.screen { position: relative; flex: 1; min-height: 0; overflow: auto; }
/* Écrans en volets (bibliothèque, graphe, flux, doublons) : un cadre sous l'en-tête. */
.screen:not(.pad) { border: 1px solid var(--color-divider); border-radius: var(--radius-md); }
.pad { padding: 0 0 8px; }
.wrap { max-width: 1180px; }

/* Accueil */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 26px; }
.kpi { text-align: left; border: 0; cursor: pointer; color: inherit; font: inherit; gap: 2px; }
.kpi:hover { box-shadow: var(--shadow-sm); }
.kpi-value { font-size: var(--text-kpi-lg); line-height: 1.1; font-weight: 500; margin: 4px 0; font-variant-numeric: tabular-nums; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.col { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.app-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; cursor: pointer; }
.app-row:hover .app-name { color: var(--color-accent-300); }
.app-badge { width: 34px; height: 34px; border-radius: var(--radius-md); display: grid; place-items: center; font-weight: 600; font-size: var(--text-small); border: 1px solid currentColor; }
.app-stats { display: flex; gap: 16px; font-variant-numeric: tabular-nums; text-align: right; }
.app-stats b { display: block; font-weight: 500; font-size: var(--text-dialog); }
.alert-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; }
.bar { height: 6px; border-radius: 3px; background: var(--color-neutral-800); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }

/* Volets */
.panes { position: absolute; inset: 0; display: flex; min-height: 0; }
.tree { width: 244px; flex: none; border-right: 1px solid var(--color-divider); display: flex; flex-direction: column; min-height: 0; }
.tree-head { padding: 14px 16px 8px; }
.tree-body { flex: 1; overflow: auto; padding: 0 8px 14px; display: flex; flex-direction: column; gap: 1px; }
.node { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: 0; font: inherit; font-size: var(--text-ui); padding: 6px 8px 6px 8px; border-radius: var(--radius-md); cursor: pointer; background: transparent; color: inherit; }
.node:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); }
.node[aria-current="true"] { background: color-mix(in srgb, var(--color-accent) 10%, transparent); color: var(--color-accent); }
.node .count { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.node.child { font-size: var(--text-small); padding: 5px 8px 5px 30px; }
.node .chev { width: 12px; flex: none; opacity: .7; }
.list { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.list-head { display: flex; align-items: center; gap: 10px; padding: 12px 20px 8px; flex-wrap: wrap; }
.crumb { margin-right: auto; min-width: 0; }
.crumb .sub { color: var(--muted); }
.crumb-title { font-size: 16px; font-weight: 500; }
.list-body { flex: 1; overflow: auto; padding: 0 12px 12px; }
.list-foot { padding: 8px 20px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--color-divider); }
.quick { width: clamp(300px, 28vw, 380px); flex: none; border-left: 1px solid var(--color-divider); overflow: auto; padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 14px; background: var(--color-bg); }
.quick-head { display: flex; align-items: flex-start; gap: 10px; }
.quick-title { font-size: 16px; font-weight: 500; word-break: break-word; flex: 1; min-width: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: var(--text-small); margin: 0; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.mini-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mini-kpis div { padding: 8px 10px; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
.mini-kpis b { display: block; font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.mini-kpis span { font-size: 11px; color: var(--muted); }
.cols-list { display: flex; flex-direction: column; }
.col-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: var(--text-small); }
.col-row .mono { overflow-wrap: anywhere; }
.col-type { color: var(--muted); font-size: 11px; text-align: right; }
.col-flags { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.col-flags .tag { font-size: var(--text-micro); padding: 0 6px; }
.link-row { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; font-size: var(--text-small); border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.link-btn { background: none; border: 0; padding: 0; font: inherit; color: var(--color-accent-300); cursor: pointer; text-align: left; }
.link-btn:hover { text-decoration: underline; }
.block-title { font-size: var(--text-eyebrow); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
.empty { color: var(--muted); padding: 16px 8px; }
.empty-pane { margin: auto 0; text-align: center; color: var(--muted); padding: 30px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.map-table td { font-size: var(--text-small); overflow-wrap: anywhere; }
.map-table { table-layout: fixed; }
.map-table td.arrow { width: 22px; }
.map-table th:nth-child(2) { width: 22px; }
.arrow { color: var(--muted); padding-inline: 2px; }

/* Graphe */
.graph-area { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--color-divider); }
.toolbar .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; font: inherit; font-size: var(--text-small); color: inherit; background: transparent; border: 1px solid var(--color-divider); cursor: pointer; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.canvas-wrap { flex: 1; position: relative; min-height: 0; background: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--color-surface) 70%, transparent), var(--color-bg) 70%); }
#cy { position: absolute; inset: 0; }
/* Écran Publications : la fiche s'ouvre au-dessus de la liste, sans que le navigateur garde la ligne cliquée à l'écran. */
#s-publications { overflow-anchor: none; }
.legend { position: absolute; left: 14px; bottom: 12px; padding: 6px 10px; border-radius: var(--radius-md); background: color-mix(in srgb, var(--color-bg) 85%, transparent); box-shadow: var(--shadow-sm); font-size: 11px; }
.legend summary { cursor: pointer; color: var(--color-neutral-500); list-style: none; user-select: none; }
.legend summary::before { content: '▸ '; } .legend[open] summary::before { content: '▾ '; }
.legend[open] summary { margin-bottom: 4px; }
#g-legend { display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 2px solid; }
.graph-hint { position: absolute; right: 14px; bottom: 12px; font-size: 11px; color: var(--muted); }
.graph-loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }

/* Référentiels, flux */
.matrix-grid { display: grid; grid-template-columns: 90px repeat(var(--n-apps, 6), minmax(0, 1fr)); gap: 4px; font-size: var(--text-small); margin: 4px 0 16px; max-width: 560px; }
.matrix-grid div { padding: 6px 8px; border-radius: 6px; }
.matrix-grid .h { color: var(--muted); font-size: 11px; }
.matrix-grid .c { background: var(--color-surface); text-align: center; font-variant-numeric: tabular-nums; }
.matrix-grid .c.z { background: transparent; box-shadow: inset 0 0 0 1px var(--rule); color: var(--muted); }
.matrix-grid .c.x { background: transparent; color: var(--color-neutral-700); }
.note { font-size: var(--text-small); padding: 10px 12px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--color-divider); }
.prose { font-size: var(--text-ui); max-width: 64ch; }
.perm { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; }
.perm.on { color: var(--color-accent); }
.perm.off { color: var(--color-neutral-700); }
.option { display: flex; flex-direction: column; gap: 4px; text-align: left; font: inherit; color: inherit; background: transparent; border: 1px solid var(--color-divider); border-radius: var(--radius-md); padding: 9px 11px; cursor: pointer; }
.option:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.option[aria-pressed="true"] { border-color: var(--color-accent); box-shadow: 0 0 12px color-mix(in srgb, var(--color-accent) 25%, transparent); }
.option-head { display: flex; align-items: center; gap: 8px; font-size: var(--text-control); }
.option-id { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 1.5px solid var(--color-neutral-600); display: grid; place-items: center; font-size: var(--text-eyebrow); font-weight: 600; }
.option[aria-pressed="true"] .option-id { border-color: var(--color-accent); background: var(--color-accent); color: var(--color-bg); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: var(--text-small); color: color-mix(in srgb, var(--color-text) 70%, transparent); }
textarea.input { resize: vertical; min-height: 70px; font-family: inherit; }
.form-error { color: var(--color-accent-300); font-size: var(--text-small); margin: 0; }
.table td .input { min-height: 30px; padding: 4px 8px; font-size: var(--text-control); min-width: 90px; }
.table td select.input { width: 100%; }
.code { font-family: var(--font-mono); font-size: var(--text-small); padding: 10px 12px; border-radius: var(--radius-md); background: var(--color-surface); overflow-x: auto; white-space: pre; }
/* Panneau latéral des formulaires (Norma § 7, COQUE.md § 7 : .coque-panel 640 px, 680 px en large) : un bouton l'ouvre,
   il se ferme au succès, Échap ou « Annuler ». */
.drawer-head { display: flex; align-items: center; gap: 10px; }

/* Un seul point de rupture (COQUE.md § 1) : ≤ 1024 px, barre supérieure et tiroir (coque.css), page qui défile. */

<script id="matrix-i18n" type="application/json">/*I18N*/</script>
<script>
(() => {
'use strict';
const DATA = JSON.parse(document.getElementById('matrix-data').textContent);
// ── Langue (outils/i18n.mjs) : chaînes sources anglaises, français par défaut (cookie matrix-lang). Le texte saisi et
// les données (noms de tables, libellés, notes) ne passent jamais par tr(). ──
const FR = JSON.parse(document.getElementById('matrix-i18n').textContent);
const LANG = /(?:^|;\s*)matrix-lang=en(?:;|$)/.test(document.cookie) ? 'en' : 'fr';
const LOCALE = LANG === 'en' ? 'en-GB' : 'fr-FR';
document.documentElement.lang = LANG;
// Une source peut porter un contexte en fin (« Applied#publication ») quand le français diffère selon l’objet : il est
// retiré de l’anglais affiché.
const sansContexte = source => source.replace(/#[a-z-]+$/, '');
const tr = (source, vars) => { const s = LANG === 'fr' ? (FR[source] ?? sansContexte(source)) : sansContexte(source); return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m)) : s; };
// Coque statique : texte des éléments [data-i18n], attributs nommés par data-i18n-attrs, titres d'écran (data-title).
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.textContent.trim()); });
document.querySelectorAll('[data-i18n-attrs]').forEach(el => el.dataset.i18nAttrs.split(' ').forEach(a => { if (el.hasAttribute(a)) el.setAttribute(a, tr(el.getAttribute(a))); }));
document.querySelectorAll('section.screen[data-title]').forEach(el => { el.dataset.title = tr(el.dataset.title); });
const CAT = DATA.catalogue, FLUX = DATA.flux, USAGES = DATA.usages, DOUBLONS = DATA.doublons.groupes, HIST = DATA.historique.evenements;
// SERVEUR : page servie par Matrix (modifications enregistrées sur le serveur) ; sinon maquette en lecture seule.
const SERVEUR = !!DATA.serveur;
const SERVEUR_COMMUN = !!DATA.serveurCommun;
const EDITION = DATA.edition || { documentation: {}, decisions: {}, referentiels: { sites: [], organigramme: [], pays: [], zones: [], filiales: [] }, journal: [] };
async function envoyer(chemin, corps) {
  const r = await fetch(chemin, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(corps) });
  const j = await r.json().catch(() => ({ erreur: tr('unreadable reply from the server') }));
  if (!r.ok) throw new Error(j.erreur || tr('error {status}', { status: r.status }));
  Object.assign(EDITION, j.edition);
  return j.resultat;
}

// ── Icônes Phosphor (outils/icones.mjs : tracés tirés de @phosphor-icons/web, aucun CDN) ──
const ICONS = JSON.parse(document.getElementById('matrix-icones').textContent);
const icon = (name, size = 16) => { const g = ICONS[name]; return g ? `<svg width="${size}" height="${size}" viewBox="0 0 ${g.largeur} 1024" fill="currentColor" aria-hidden="true" focusable="false"><path d="${g.d}"/></svg>` : ''; };
const hydrateIcons = root => root.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon, +(el.dataset.size || 16)); el.removeAttribute('data-icon'); });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => n.toLocaleString(LOCALE);
const $ = id => document.getElementById(id);

// ── Applications ────────────────────────────────────────────────────────
const APPS = {
  keystone: { nom: 'Keystone', role: tr('Project and portfolio management'), moteur: tr('Embedded PostgreSQL (PGlite)'), orm: 'Drizzle', port: 3000, init: 'K', donnees: 'KEYSTONE_DATA_DIR/pg' },
  codex: { nom: 'Codex', role: tr('Group document management'), moteur: tr('Embedded PostgreSQL (PGlite)'), orm: 'Drizzle', port: 3100, init: 'C', donnees: 'CODEX_DATA_DIR/pglite' },
  cursus: { nom: 'Cursus', role: tr('HR: training, time, travel'), moteur: 'SQLite (node:sqlite)', orm: tr('none'), port: 3210, init: 'Cu', donnees: 'CURSUS_DB (data/cursus.db)' },
  vigie: { nom: 'Vigie', role: tr('QHSE: events, risks, prevention'), moteur: tr('Embedded PostgreSQL (PGlite)'), orm: 'Drizzle', port: 3200, init: 'V', donnees: 'VIGIE_DATA_DIR' },
  arche: { nom: 'Arche', role: tr('Subsidiaries’ CAPEX (DIG-PRODI method) — being framed, tables planned'), moteur: tr('PostgreSQL (planned; PGlite in development)'), orm: tr('Drizzle (planned)'), port: 3400, init: 'A', donnees: tr('schema {schema} (planned)', { schema: 'arche' }) },
  crucible: { nom: 'Crucible', role: tr('Shared R&D test resources: bookings and arbitration'), moteur: tr('PostgreSQL (EPC2I shared server)'), orm: 'Drizzle', port: 3500, init: 'Cr', donnees: tr('schema {schema}', { schema: 'crucible' }) },
  // Outils du registre de Norma (norma/registre/outils.json) arrivés après les six premiers.
  clavis: { nom: 'Clavis', role: tr('Directory, access, central sign-in'), moteur: tr('PostgreSQL (EPC2I shared server)'), orm: 'Drizzle', port: 3600, init: 'Cl', donnees: tr('schema {schema}', { schema: 'clavis' }) },
  matrix: { nom: 'Matrix', role: tr('Shared PostgreSQL server, publications, links between tools'), moteur: tr('PostgreSQL (EPC2I shared server)'), orm: tr('none (versioned SQL)'), port: 3700, init: 'M', donnees: tr('schema {schema}', { schema: 'matrix' }) },
  modulus: { nom: 'Modulus', role: tr('Sales and estimating: machine catalogue, standard BOM, prices, deals, know-how — being framed'), moteur: tr('PostgreSQL (EPC2I shared server, planned)'), orm: tr('Drizzle (planned)'), port: 3800, init: 'Mo', donnees: tr('schema {schema} (planned)', { schema: 'modulus' }) },
  vector: { nom: 'Vector', role: tr('Domestic and international shipments: requests, packing, transport, customs, documents, tracking, costs — being built'), moteur: tr('PostgreSQL (EPC2I shared server, planned)'), orm: tr('Drizzle (planned)'), port: 3900, init: 'Ve', donnees: tr('schema {schema} (planned)', { schema: 'vector' }) },
};
const APP_IDS = Object.keys(APPS);
const css = getComputedStyle(document.documentElement);
const cssv = v => css.getPropertyValue(v).trim();
// Couleur d'une application : la variable CSS dans le HTML (elle suit le thème sombre / clair), la valeur calculée pour
// le graphe (cytoscape ne lit pas les variables), relue à chaque dessin.
APP_IDS.forEach(a => APPS[a].couleur = `var(--app-${a})`);
const appCouleur = a => cssv('--app-' + a);
const appMark = (a, size = 18) => `<span class="mark" style="color:${APPS[a].couleur};width:${size}px;height:${size}px">${APPS[a].init}</span>`;
const appTag = a => `<span class="tag tag-ghost"><span class="dot" style="background:${APPS[a].couleur}"></span>${APPS[a].nom}</span>`;

const STATUT = {
  reel: [tr('Real'), 'tag-accent', tr('Built on both sides')],
  partiel: [tr('Partial'), 'tag-outline', tr('Only one side is built')],
  simule: [tr('Simulated'), 'tag-neutral', tr('Replaced by a local write')],
  copie: [tr('Demo copy'), 'tag-neutral', tr('Data copied, not synchronised')],
  propose: [tr('Proposed'), 'tag-neutral', tr('Contract written, nothing built')],
  prevu: [tr('Planned'), 'tag-neutral', tr('Announced in the interface')],
};
const GRAV = { critique: [tr('Critical'), 'tag-accent'], majeur: [tr('Major'), 'tag-outline'], mineur: [tr('Minor'), 'tag-neutral'] };
const statutTag = s => `<span class="tag ${STATUT[s][1]}" title="${esc(STATUT[s][2])}">${STATUT[s][0]}</span>`;
const gravTag = g => `<span class="tag ${GRAV[g][1]}">${GRAV[g][0]}</span>`;

// ── Index du catalogue ──────────────────────────────────────────────────
const T = new Map();               // "app.table" → fiche
const key = (a, t) => a + '.' + t;
for (const app of CAT.apps) for (const t of app.tables) {
  T.set(key(app.id, t.name), { ...t, app: app.id, key: key(app.id, t.name), in: [], lit: [], ecrit: [], flux: [], refs: [] });
}
for (const t of T.values()) for (const fk of t.fks) {
  const target = T.get(key(t.app, fk.table));
  if (target) target.in.push({ from: t.key, columns: fk.columns, refColumns: fk.refColumns, declared: fk.declared });
}
for (const a of APP_IDS) for (const s of USAGES[a] || []) {
  s.lit.forEach(n => T.get(key(a, n))?.lit.push(s.ecran));
  s.ecrit.forEach(n => T.get(key(a, n))?.ecrit.push(s.ecran));
}
for (const f of FLUX.flux) {
  f.source.forEach(n => T.get(key(f.de, n))?.flux.push({ f, sens: 'source' }));
  f.cible.forEach(n => T.get(key(f.vers, n))?.flux.push({ f, sens: 'cible' }));
}
for (const g of DOUBLONS) for (const o of g.tables) T.get(key(o.app, o.table))?.refs.push(g);
// Documentation saisie dans Matrix : elle complète ou remplace ce que dit le schéma.
function appliquerDoc(t, d) {
  t.origine ??= { description: t.description, domain: t.domain };
  t.description = d?.description ?? t.origine.description;
  t.domain = d?.domaine ?? t.origine.domain;
  t.responsable = d?.responsable ?? null;
  t.note = d?.note ?? null;
  t.doc = d ?? null;
}
for (const [k, d] of Object.entries(EDITION.documentation)) { const t = T.get(k); if (t) appliquerDoc(t, d); }

// ── Recherche plein texte et popularité (E-13) ──────────────────────────
/*RECHERCHE*/
// Lectures de chaque table depuis le dernier redémarrage du serveur commun (seq_scan + idx_scan, lus par la sonde).
for (const s of (DATA.sante?.tables || [])) { const t = T.get(key(s.app, s.table)); if (t) t.lectures = (s.stats?.lecturesSequentielles || 0) + (s.stats?.lecturesIndex || 0); }
const AVEC_LECTURES = (DATA.sante?.tables || []).length > 0;
const ficheRecherche = t => ({ cle: t.key, nom: t.name, domaine: t.domain, description: t.description, documentation: t.doc,
  colonnes: t.columns.map(c => ({ nom: c.name, description: c.description })), flux: t.flux.map(x => `${x.f.id} ${x.f.nom}`), lectures: t.lectures || 0 });
const fmtLectures = n => n == null ? '—' : n >= 1e6 ? (n / 1e6).toLocaleString(LOCALE, { maximumFractionDigits: 1 }) + ' M' : n >= 1e4 ? Math.round(n / 1e3) + ' k' : String(n);
const FUSION = new Set(['doublon', 'miroir', 'chevauchement']);
const NATURE = { doublon: [tr('Duplicate'), 'tag-accent'], miroir: [tr('Mirror'), 'tag-outline'], chevauchement: [tr('Overlap'), 'tag-outline'], homonyme: [tr('Homonym'), 'tag-neutral'], technique: [tr('Technical'), 'tag-neutral'] };
const natureTag = n => `<span class="tag ${NATURE[n][1]}">${NATURE[n][0]}</span>`;

// Décisions sur les doublons : enregistrées sur le serveur Matrix ; dans la maquette publiée, propres au navigateur.
const Decisions = (() => {
  let d = {};
  if (SERVEUR) d = Object.fromEntries(Object.entries(EDITION.decisions).map(([k, v]) => [k, v.option]));
  else { try { d = JSON.parse(localStorage.getItem('matrix.decisions') || '{}') || {}; } catch { d = {}; } }
  const officielle = id => DOUBLONS.find(g => g.id === id)?.decision || null;
  return {
    get: id => d[id] || officielle(id)?.option || null,
    officielle,
    async set(id, v) {
      if (SERVEUR) { await envoyer('/api/decisions', { id, option: v, avant: d[id] ?? null }); if (v) d[id] = v; else delete d[id]; }
      else {
        if (v && v !== officielle(id)?.option) d[id] = v; else delete d[id];
        try { localStorage.setItem('matrix.decisions', JSON.stringify(d)); } catch { /* stockage indisponible */ }
      }
      navBadge();
    },
    count: () => DOUBLONS.filter(g => d[g.id] || g.decision).length,
  };
})();
const tablesOf = a => [...T.values()].filter(t => t.app === a);
const linkCount = t => t.fks.length + t.in.length;

const STATS = (() => {
  const all = [...T.values()];
  const fks = all.reduce((n, t) => n + t.fks.length, 0);
  const logical = all.reduce((n, t) => n + t.fks.filter(f => !f.declared).length, 0);
  const cols = all.reduce((n, t) => n + t.columns.length, 0);
  return { tables: all.length, fks, logical, cols, flux: FLUX.flux.length, reels: FLUX.flux.filter(f => f.statut === 'reel').length };
})();

// ── Navigation ──────────────────────────────────────────────────────────
const NAV = [
  ['accueil', tr('Home'), 'home'],
  ['bibliotheque', tr('Library'), 'db'],
  ['glossaire', tr('Business glossary'), 'list'],
  ['donnees', tr('Data viewer'), 'table'],
  ['graphe', tr('Link graph'), 'graph'],
  ['flux', tr('Flows between applications'), 'flux'],
  ['doublons', tr('Duplicates'), 'ref'],
  ['referentiels', tr('Reference data'), 'list'],
  ['qualite', tr('Schema quality'), 'pulse'],
  ['sante', tr('Data health'), 'pulse'],
  ['liens', tr('Links between tools'), 'ref'],
  ['publications', tr('Publications'), 'table'],
  ['journal', tr('Unified log'), 'list'],
  ['rex', tr('Lessons learned'), 'eye'],
  ['correspondances', tr('Mappings'), 'key'],
  ['administration', tr('Administration'), 'shield'],
];
let current = null;
// Fil d'Ariane de chaque écran (COQUE.md § 3 : section › page ; le nom de l'outil est dans la marque, pas dans le fil).
const GROUPE = { accueil: tr('Home'), bibliotheque: tr('Catalogue'), glossaire: tr('Catalogue'), donnees: tr('Catalogue'), graphe: tr('Catalogue'),
  flux: tr('Exchanges'), doublons: tr('Exchanges'), referentiels: tr('Exchanges'), liens: tr('Exchanges'), publications: tr('Exchanges'), correspondances: tr('Exchanges'),
  qualite: tr('Monitoring'), sante: tr('Monitoring'), journal: tr('Monitoring'), rex: tr('Monitoring'), administration: tr('Administration') };
// Un en-tête .coque-header par écran : chaque <section class="screen"> est placée dans une vue (.vue) qui porte son en-tête
// (fil, titre h1 26 px) ; les outils communs (recherche, date, langue / affichage) y sont placés à l'affichage (show).
document.querySelectorAll('.app-main > section.screen').forEach(s => {
  const id = s.id.slice(2);
  const vue = document.createElement('div');
  vue.className = 'vue'; vue.id = 'v-' + id; vue.hidden = s.hidden; s.hidden = false;
  vue.innerHTML = `<header class="coque-header"><div class="coque-header-left"><div class="coque-crumb"><span>${esc(GROUPE[id] || '')}</span></div><div class="coque-title-row"><h1 class="coque-title">${esc(s.dataset.title)}</h1></div></div></header>`;
  s.before(vue); vue.append(s);
});
const OUTILS_ENTETE = [...$('entete-outils').children];
document.querySelector('.vue:not([hidden]) .coque-header').append(...OUTILS_ENTETE);
$('entete-outils').remove();
// Menu : entrées .coque-entry ; pendant la saisie dans « Aller à une page… » (⌘K), les pages trouvées remplacent le menu.
const entreeNav = ([id, label, ic]) => `<a class="coque-entry" href="#${id}" data-screen="${id}"><span class="coque-entry-icon">${icon(ic)}</span><span class="coque-entry-label">${label}</span>${id === 'doublons' ? '<span class="coque-badge" id="nav-doublons"></span>' : id === 'liens' ? '<span class="coque-badge" id="nav-liens" hidden></span>' : ''}</a>`;
const dessinerNav = () => { $('nav').innerHTML = NAV.map(entreeNav).join(''); marquerNav(); navBadge(); if (typeof navLiens === 'function' && SANTE_PRETE) navLiens(); };
let SANTE_PRETE = false;
const marquerNav = () => document.querySelectorAll('#nav .coque-entry').forEach(a => a.dataset.screen === current ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
function navBadge() { const el = $('nav-doublons'); if (el) { const n = DOUBLONS.length - Decisions.count(); el.textContent = n; el.hidden = !n; el.title = tr('{n} group(s) to decide', { n }); } }
dessinerNav();
$('linked').innerHTML = APP_IDS.map(a => `<div class="linked">${appMark(a)}<span>${APPS[a].nom}</span><span class="sub text-muted" style="margin-left:auto">:${APPS[a].port}</span></div>`).join('');
$('collect-tag').innerHTML = icon('calendar', 14) + esc(tr('Schemas read on {date}', { date: new Date(CAT.generatedAt).toLocaleDateString(LOCALE, { day: 'numeric', month: 'long', year: 'numeric' }) }));
hydrateIcons(document);

// ── Langue FR / EN (cookie matrix-lang, un an ; la page est rechargée dans la langue choisie) ──
// Deux copies de la paire langue / affichage (COQUE.md § 4) : en-tête de l'écran (> 1024 px) et barre supérieure.
document.querySelectorAll('[data-langue-choix]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.langueChoix === LANG)));
document.addEventListener('click', e => {
  const b = e.target.closest('[data-langue-choix]'); if (!b || b.dataset.langueChoix === LANG) return;
  document.cookie = `matrix-lang=${b.dataset.langueChoix === 'en' ? 'en' : 'fr'}; path=/; max-age=31536000; samesite=lax`;
  location.reload();
});

// ── Barre latérale en tiroir (≤ 1024 px, COQUE.md § 8) et recherche de pages ⌘K (§ 2) ──
const Menu = (() => {
  const side = $('coque-side'), voile = $('menu-voile'), bouton = $('menu-ouvrir'), contenu = $('contenu');
  const etroit = matchMedia('(max-width: 1024px)');
  const ouvert = () => side.classList.contains('is-open');
  const ouvrir = (focus = $('menu-fermer')) => {
    side.classList.add('is-open'); voile.classList.add('is-on'); bouton.setAttribute('aria-expanded', 'true'); contenu.inert = true;
    setTimeout(() => focus.focus(), 0);
  };
  const fermer = (rendre = true) => {
    if (!ouvert()) return;
    side.classList.remove('is-open'); voile.classList.remove('is-on'); bouton.setAttribute('aria-expanded', 'false'); contenu.inert = false;
    if (rendre) bouton.focus();
  };
  bouton.addEventListener('click', () => ouvrir());
  $('menu-fermer').addEventListener('click', () => fermer());
  voile.addEventListener('click', () => fermer());
  side.addEventListener('click', e => { if (e.target.closest('a[href^="#"]')) fermer(false); });
  etroit.addEventListener('change', () => { if (!etroit.matches) fermer(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ouvert() && !document.querySelector('.drawer')) fermer(); });
  return { ouvrir, fermer, etroit };
})();
(() => {
  const q = $('page-q');
  const plier = v => String(v).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const trouvees = () => {
    const m = plier(q.value.trim());
    return NAV.filter(([id, label]) => [label, $('s-' + id).dataset.title, GROUPE[id]].some(x => plier(x).includes(m)));
  };
  const dessiner = () => {
    if (!q.value.trim()) return dessinerNav();
    const hits = trouvees();
    $('nav').innerHTML = hits.length ? hits.map(([id, label, ic]) => `<a class="coque-entry" href="#${id}" data-screen="${id}"><span class="coque-entry-icon">${icon(ic)}</span><span class="coque-entry-hit"><span class="coque-entry-label">${label}</span><span class="coque-entry-section">${esc(GROUPE[id])}</span></span></a>`).join('')
      : `<div class="coque-nav-empty">${esc(tr('No page matches'))}</div>`;
    marquerNav();
  };
  const vider = () => { if (q.value) { q.value = ''; dessiner(); } };
  q.addEventListener('input', dessiner);
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); const h = q.value.trim() && trouvees()[0]; if (h) { vider(); Menu.fermer(false); go(h[0]); } }
    else if (e.key === 'Escape') { e.stopPropagation(); vider(); }
  });
  $('nav').addEventListener('click', e => { if (e.target.closest('a[data-screen]')) setTimeout(vider, 0); });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && !e.altKey && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (Menu.etroit.matches) Menu.ouvrir(q); else { q.focus(); q.select(); }
    }
  });
})();

// ── Panneau latéral des formulaires (Norma § 7) ──
// panneau(titre, corps) rend le panneau d'un formulaire : l'écran le dessine tant que son état d'édition est ouvert, et le
// retire au succès ou à « Annuler ». La croix, le fond et Échap déclenchent le bouton « Annuler » du panneau ([data-annuler]).
const panneau = (titre, corps, { large = false } = {}) => `<div class="drawer-backdrop coque-panel-scrim" data-panneau-fermer></div>
  <aside class="drawer coque-panel${large ? ' is-wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="drawer-titre"><div class="drawer-head"><h2 class="drawer-title coque-panel-title" id="drawer-titre">${titre}</h2>
  <button type="button" class="btn btn-ghost btn-icon" data-panneau-fermer aria-label="${esc(tr('Close'))}" title="${esc(tr('Close'))}">${icon('close', 14)}</button></div>
  <div class="drawer-body">${corps}</div></aside>`;
const fermerPanneau = () => { const a = document.querySelector('.drawer [data-annuler]'); if (a) a.click(); };
document.addEventListener('click', e => { if (e.target.closest('[data-panneau-fermer]')) { e.preventDefault(); fermerPanneau(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.drawer')) fermerPanneau(); });
// Focus dans le panneau à son ouverture (et après un nouveau dessin) : premier champ, sinon le panneau.
new MutationObserver(() => {
  const d = document.querySelector('.drawer');
  if (d && !d.contains(document.activeElement)) (d.querySelector('.drawer-body input:not([disabled]):not([type=checkbox]), .drawer-body textarea, .drawer-body select') || d.querySelector('button'))?.focus();
}).observe(document.body, { childList: true, subtree: true });

// ── Affichage sombre / clair (Norma : cookie epc2i-theme, attribut data-theme de <html>, posé par le serveur) ──
(() => {
  const marquer = t => document.querySelectorAll('[data-theme-choix]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeChoix === t)));
  marquer(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-theme-choix]'); if (!b) return;
    const t = b.dataset.themeChoix === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    document.cookie = `epc2i-theme=${t}; path=/; max-age=31536000; samesite=lax`;
    marquer(t);
    document.dispatchEvent(new Event('epc2i-theme'));
  });
})();

const rendered = {};
function show(screen) {
  if (!NAV.some(n => n[0] === screen)) screen = 'accueil';
  current = screen;
  document.querySelectorAll('.vue').forEach(v => v.hidden = v.id !== 'v-' + screen);
  marquerNav();
  // Outils communs dans l'en-tête de l'écran affiché, ordre fixe ; la paire langue / affichage en dernier, à droite.
  $('v-' + screen).querySelector('.coque-header').append(...OUTILS_ENTETE);
  document.title = `${$('s-' + screen).dataset.title} · Matrix`;
  if (!rendered[screen]) { rendered[screen] = true; RENDER[screen](); }
  if (screen === 'graphe') Graph.ensure();
}
function go(screen) { if (location.hash !== '#' + screen) location.hash = screen; else show(screen); }
window.addEventListener('hashchange', () => show(location.hash.slice(1)));

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  $('toasts').appendChild(el); setTimeout(() => el.remove(), 3200);
}
function copy(text) {
  try { navigator.clipboard.writeText(text).then(() => toast(tr('Copied: {text}', { text })), () => toast(text)); } catch { toast(text); }
}
const seg = (name, options, value) => `<div class="seg" role="group" data-seg="${name}">${options.map(([v, l, n]) => `<button type="button" data-v="${esc(v)}" aria-pressed="${v === value}">${l}${n != null ? ` <span class="n">${n}</span>` : ''}</button>`).join('')}</div>`;

// ── Historique des schémas : libellés et détail avant / après (E-06) ────
const TYPES_HIST = { table_ajoutee: tr('Table added'), table_supprimee: tr('Table removed'), colonne_ajoutee: tr('Column added'), colonne_supprimee: tr('Column removed'),
  colonne_modifiee: tr('Column changed'), cle_modifiee: tr('Primary key changed'), unicite_ajoutee: tr('Uniqueness added'), unicite_retiree: tr('Uniqueness removed'),
  lien_ajoute: tr('Foreign key added'), lien_retire: tr('Foreign key removed'), source_changee: tr('Source changed'),
  migrations_appliquees: tr('Migrations applied'), hors_migration: tr('Change outside a migration') };
const etatCol = e => e ? `${e.type ?? '?'}${e.nullable === false ? ' · ' + tr('required') : e.nullable ? ' · ' + tr('optional') : ''}${e.default != null ? ' · ' + tr('default {value}', { value: e.default }) : ''}` : '';
function detailHist(e) {
  const av = (a, b) => `<span class="text-muted">${esc(a)}</span> → <b>${esc(b)}</b>`;
  if (e.type === 'colonne_modifiee') return (e.champs || ['type', 'nullable', 'default']).map(k => k === 'type' ? `${tr('type:')} ${av(e.avant.type ?? '—', e.apres.type ?? '—')}` : k === 'nullable' ? av(e.avant.nullable ? tr('optional') : tr('required'), e.apres.nullable ? tr('optional') : tr('required')) : `${tr('default:')} ${av(e.avant.default ?? tr('none'), e.apres.default ?? tr('none'))}`).join(' · ');
  if (e.type === 'colonne_ajoutee' && e.apres) return esc(etatCol(e.apres));
  if (e.type === 'colonne_supprimee' && e.avant) return `<span class="text-muted">${esc(etatCol(e.avant))}</span>`;
  if (e.type === 'cle_modifiee') return av((e.avant || []).join(', ') || tr('none'), (e.apres || []).join(', ') || tr('none'));
  if (e.type === 'unicite_ajoutee' || e.type === 'unicite_retiree') return `<span class="mono">${esc((e.colonnes || []).join(' + '))}</span>`;
  if (e.type === 'lien_ajoute' || e.type === 'lien_retire') return `<span class="mono">${esc(e.lien)}</span>`;
  if (e.type === 'source_changee') return `${av(e.avant || '—', e.apres || '—')} <span class="text-muted">${tr('(columns not compared)')}</span>`;
  if (e.type === 'migrations_appliquees') return `${e.avant} → <b>${e.apres}</b> ${tr('migration(s)')}${e.derniere ? ' · ' + tr('last on {date}', { date: quand(e.derniere) }) : ''}`;
  if (e.type === 'hors_migration') return tr('structure changed, still {n} migration(s) applied', { n: e.migrations });
  return '';
}

// ── Fiche d'une table (bibliothèque et graphe) ──────────────────────────
function tableSheet(t, tab = 'colonnes', opts = {}) {
  const sens = new Set(t.sensitive || []);
  const fkByCol = {}; t.fks.forEach(f => f.columns.forEach(c => fkByCol[c] = f));
  const screens = new Set([...t.lit, ...t.ecrit]);
  let body = '';
  if (tab === 'colonnes') {
    body = `<div class="cols-list">${t.columns.map(c => {
      const fk = fkByCol[c.name]; const flags = [];
      if (c.pk || t.pk.includes(c.name)) flags.push(`<span class="tag tag-accent">${tr('primary key')}</span>`);
      if (fk) flags.push(`<span class="tag ${fk.declared ? 'tag-outline' : 'tag-ghost'}">→ ${esc(fk.table)}.${esc(fk.refColumns.join(', '))}${fk.declared ? '' : ' · ' + tr('logical')}</span>`);
      if (!c.nullable && !c.pk) flags.push(`<span class="tag tag-ghost">${tr('required')}</span>`);
      if (sens.has(c.name)) flags.push('<span class="tag tag-outline">' + icon('lock', 10) + ' ' + tr('sensitive') + '</span>');
      for (const g of termesDe(t.app, t.name, c.name)) flags.push(`<a class="tag tag-ghost" href="#glossaire" title="${esc(g.definition)}">${icon('list', 10)} ${esc(g.terme)}</a>`);
      return `<div class="col-row"><span class="mono">${esc(c.name)}</span><span class="col-type mono">${esc(c.type)}</span>${flags.length ? `<div class="col-flags">${flags.join('')}</div>` : ''}</div>`;
    }).join('')}</div>`;
  } else if (tab === 'liens') {
    const out = t.fks.map(f => `<div class="link-row"><span class="mono">${esc(f.columns.join(', '))}</span><span class="arrow">→</span><button class="link-btn mono" data-open="${esc(key(t.app, f.table))}">${esc(f.table)}</button><span class="text-muted mono">.${esc(f.refColumns.join(', '))}</span>${f.declared ? '' : `<span class="tag tag-ghost">${tr('logical')}</span>`}</div>`).join('');
    const inn = t.in.map(i => { const s = T.get(i.from); return `<div class="link-row"><button class="link-btn mono" data-open="${esc(i.from)}">${esc(s.name)}</button><span class="text-muted mono">.${esc(i.columns.join(', '))}</span>${i.declared ? '' : `<span class="tag tag-ghost">${tr('logical')}</span>`}</div>`; }).join('');
    const refs = t.refs.map(g => `<div class="link-row"><button class="link-btn" data-doublon="${g.id}">${esc(g.id)} · ${esc(g.objet)}</button>${natureTag(g.nature)}<span class="text-muted">· ${g.tables.filter(o => o.table !== '—' && key(o.app, o.table) !== t.key).map(o => APPS[o.app].nom + '.' + o.table).join(', ')}</span></div>`).join('');
    const sim = (t.doublonsPossibles || []).map(d => `<div class="link-row"><button class="link-btn mono" data-open="${esc(key(d.app, d.table))}">${APPS[d.app].nom}.${esc(d.table)}</button><span class="text-muted">· ${tr('{pct} % of columns in common', { pct: Math.round(d.score * 100) })}${d.memeNom ? ' · ' + tr('same name') : ''}</span></div>`).join('');
    const pubs = vuesDeTable(t.app, t.name).map(v => `<div class="link-row" style="flex-wrap:wrap"><span class="mono">${esc(v.vue)}</span><span class="text-muted sub">· ${tr('read by {tools}', { tools: [...new Set(v.lecteurs.filter(l => /_app$/.test(l)).map(l => APPS[l.replace(/_app$/, '')]?.nom || 'Matrix'))].join(', ') || tr('no tool') })}</span>
      ${v.colonnes.length ? `<div class="sub" style="width:100%">${v.colonnes.map(c => `<span class="mono">${esc(c.sources.filter(s => s.table === t.app + '.' + t.name).map(s => s.colonne).join(' + '))}</span> → <span class="mono">${esc(c.colonne)}</span> <span class="text-muted">(${GENRE_LIGNAGE[c.genre]})</span>`).join(' · ')}</div>` : ''}</div>`).join('');
    body = `<div><div class="block-title">${tr('Points to')} <span>${t.fks.length}</span></div>${out || `<p class="text-muted sub">${tr('No outgoing link.')}</p>`}</div>
      ${pubs ? `<div><div class="block-title">${tr('Published by pub_ views (lineage read on the server)')}</div>${pubs}</div>` : ''}
      <div><div class="block-title">${tr('Referenced by')} <span>${t.in.length}</span></div>${inn || `<p class="text-muted sub">${tr('No table points to this one.')}</p>`}</div>
      ${refs ? `<div><div class="block-title">${tr('Duplicates found')}</div>${refs}</div>` : ''}
      ${sim ? `<div><div class="block-title">${tr('Possible duplicates (automatic detection)')}</div>${sim}</div>` : ''}`;
  } else if (tab === 'historique') {
    const ev = HIST.filter(e => e.app === t.app && e.table === t.name).slice().reverse();
    body = ev.length ? `<div class="cols-list">${ev.map(e => `<div class="col-row" style="flex-wrap:wrap"><span class="tabnum text-muted sub">${new Date(e.date).toLocaleDateString(LOCALE)}</span><span>${TYPES_HIST[e.type] || esc(e.type)}${e.colonne ? ` <span class="mono">${esc(e.colonne)}</span>` : ''}</span><div class="sub" style="width:100%">${detailHist(e)}</div></div>`).join('')}</div>`
      : `<p class="text-muted sub">${tr('No change recorded since Matrix has been following this table')}${t.vueLe ? ` (${new Date(t.vueLe).toLocaleDateString(LOCALE)})` : ''}.</p>`;
  } else {
    const fx = t.flux.map(({ f, sens }) => {
      const other = sens === 'source' ? f.vers : f.de;
      return `<div class="link-row"><button class="link-btn" data-flux="${f.id}">${esc(f.id)} · ${esc(f.nom)}</button><span class="text-muted">${sens === 'source' ? tr('read by {tools}', { tools: APPS[other].nom }) : tr('fed by {tool}', { tool: APPS[other].nom })}</span>${statutTag(f.statut)}</div>`;
    }).join('');
    const ext = FLUX.externes.filter(e => e.app === t.app && e.tables.includes(t.name)).map(e => `<div class="link-row"><span>${esc(e.nom)}</span><span class="text-muted">· ${esc(e.sens)}</span>${statutTag(e.statut)}</div>`).join('');
    body = `<div><div class="block-title">${tr('Screens of {app}', { app: APPS[t.app].nom })} <span>${screens.size}</span></div>
      ${[...screens].map(s => `<div class="link-row"><span>${esc(s)}</span><span class="text-muted" style="margin-left:auto">${t.lit.includes(s) ? tr('reads') : ''}${t.lit.includes(s) && t.ecrit.includes(s) ? ' · ' : ''}${t.ecrit.includes(s) ? tr('writes') : ''}</span></div>`).join('') || `<p class="text-muted sub">${tr('No screen found. The table may be read by a calculation or a background task.')}</p>`}</div>
      <div><div class="block-title">${tr('Other applications')} <span>${t.flux.length + (ext ? 1 : 0)}</span></div>${fx + ext || `<p class="text-muted sub">${tr('No other application reads or feeds this table.')}</p>`}</div>`;
  }
  return `
    <div class="quick-head">
      <div class="quick-title mono">${esc(t.name)}</div>
      ${opts.close ? `<button class="btn btn-ghost btn-icon" data-close aria-label="${esc(tr('Close the preview'))}">${icon('close', 14)}</button>` : ''}
    </div>
    <div class="tags">${appTag(t.app)}<span class="tag tag-neutral">${esc(t.domain)}</span>${t.sensitive ? `<span class="tag tag-outline">${icon('lock', 10)} ${tr('Sensitive data')}</span>` : ''}${t.flux.length ? `<span class="tag tag-accent">${tr('Exchanged')}</span>` : ''}${t.nouvelle ? `<span class="tag tag-outline">${tr('New · to document')}</span>` : ''}</div>
    ${t.description ? `<p class="text-muted" style="font-size:12.5px">${esc(t.description)}</p>` : `<p class="text-muted sub">${tr('No description yet.')}</p>`}
    ${t.responsable || t.note ? `<dl class="dl">${t.responsable ? `<dt>${tr('Owner')}</dt><dd>${esc(t.responsable)}</dd>` : ''}${t.note ? `<dt>${tr('Note')}</dt><dd style="white-space:pre-wrap">${esc(t.note)}</dd>` : ''}</dl>` : ''}
    ${t.doc ? `<p class="sub text-muted">${tr('Documented by {who} on {date}', { who: esc(t.doc.majPar || '—'), date: new Date(t.doc.majLe).toLocaleDateString(LOCALE) })}</p>` : ''}
    ${SERVEUR ? `<div style="display:flex;gap:8px"><button class="btn btn-secondary btn-sm" data-documenter="${esc(t.key)}">${icon('pen', 13)} ${tr('Document')}</button>${SERVEUR_COMMUN ? `<button class="btn btn-secondary btn-sm donnees-btn" data-donnees="${esc(t.key)}">${icon('table', 13)} ${tr('View the data')}</button>` : ''}</div>` : ''}
    <div class="mini-kpis"><div><b>${t.columns.length}</b><span>${tr('columns')}</span></div><div><b>${linkCount(t)}</b><span>${tr('links')}</span></div><div><b>${screens.size + t.flux.length}</b><span>${tr('uses')}</span></div></div>
    <dl class="dl"><dt>${tr('Key')}</dt><dd class="mono">${esc(t.pk.join(', ') || '—')}</dd>${t.uniques.length ? `<dt>${tr('Uniqueness')}</dt><dd class="mono">${t.uniques.map(u => esc(u.join(' + '))).join(' · ')}</dd>` : ''}<dt>${tr('Database')}</dt><dd>${esc(APPS[t.app].moteur)}</dd></dl>
    ${seg('tab', [['colonnes', tr('Columns'), t.columns.length], ['liens', tr('Links'), linkCount(t)], ['usages', tr('Uses'), screens.size + t.flux.length], ['historique', tr('History'), HIST.filter(e => e.app === t.app && e.table === t.name).length]], tab)}
    <div style="display:flex;flex-direction:column;gap:14px">${body}</div>
    ${opts.actions !== false ? `<div class="actions"><button class="btn btn-primary" data-graph="${esc(t.key)}">${icon('graph', 14)} ${tr('View in the graph')}</button><button class="btn btn-secondary" data-copy="${esc(t.name)}">${icon('copy', 14)} ${tr('Copy the name')}</button></div>` : ''}`;
}

// ── Lignage et flux observés sur le serveur commun (E-07) ───────────────
const LIGNAGE = DATA.lignage || null;
const OBS = Object.fromEntries((LIGNAGE?.saisis || []).map(x => [x.id, x]));
const obsTag = id => !LIGNAGE ? '' : OBS[id]?.etat === 'confirme'
  ? `<span class="tag tag-accent" title="${esc(tr('Link applied on the shared server: {views}', { views: (OBS[id].vues || []).join(', ') }))}">${tr('observed')}</span>`

// Vues pub_ qui publient des colonnes d'une table, avec leur correspondance colonne publiée ← colonne source.
function vuesDeTable(app, table) {
  const cle = `${app}.${table}`;
  return ((DATA.sante || {}).vues || []).filter(v => (v.sources || []).some(s => s.startsWith(cle + '.')))
    .map(v => ({ vue: v.vue, lecteurs: v.lecteurs || [], colonnes: (v.lignage || []).filter(c => c.sources.some(s => s.table === cle)) }));
}

    ${OBS[f.id]?.etat === 'confirme' ? `<p class="sub text-muted">${tr('Observed on the shared server:')} ${OBS[f.id].vues.map(v => `<span class="mono">${esc(v)}</span>`).join(', ')}${OBS[f.id].tablesCommunes.length ? ` (${tr('tables {tables}', { tables: OBS[f.id].tablesCommunes.map(esc).join(', ') })})` : ''}.</p>` : ''}

}

// Formulaire de documentation d'une table (page servie par Matrix uniquement), dans le panneau latéral.
const Documentation = {
  ouvrir(k, fiche) {
    const t = T.get(k), hote = $('panneau-hote'); if (!t) return;
    const domaines = [...new Set(tablesOf(t.app).map(x => x.domain))].sort((a, b) => a.localeCompare(b, LOCALE));
    hote.innerHTML = panneau(`${esc(tr('Document the table'))} <span class="mono">${esc(t.name)}</span>`, `
      <div class="tags">${appTag(t.app)}</div>
      <form id="doc-form" style="display:flex;flex-direction:column;gap:12px">
        <div class="field"><label class="field-label" for="doc-description">${tr('Description')}</label><textarea class="input" id="doc-description" rows="4" maxlength="2000">${esc(t.description || '')}</textarea></div>
        <div class="field"><label class="field-label" for="doc-domaine">${tr('Domain')}</label><input class="input" id="doc-domaine" list="doc-domaines" maxlength="80" value="${esc(t.domain || '')}"><datalist id="doc-domaines">${domaines.map(d => `<option value="${esc(d)}">`).join('')}</datalist></div>
        <div class="field"><label class="field-label" for="doc-responsable">${tr('Data owner')}</label><input class="input" id="doc-responsable" maxlength="120" placeholder="${esc(tr('Name or function'))}" value="${esc(t.responsable || '')}"></div>
        <div class="field"><label class="field-label" for="doc-note">${tr('Note')}</label><textarea class="input" id="doc-note" rows="4" maxlength="4000" placeholder="${esc(tr('Business rules, precautions, useful links…'))}">${esc(t.note || '')}</textarea></div>
        <p class="form-error" id="doc-erreur" role="alert" hidden></p>
        <div class="actions"><button class="btn btn-primary" type="submit">${tr('Save')}</button><button class="btn btn-secondary" type="button" id="doc-annuler" data-annuler>${tr('Cancel')}</button></div>
      </form>`);
    const fermer = () => { hote.innerHTML = ''; };
    hote.querySelector('#doc-annuler').addEventListener('click', fermer);
    hote.querySelector('#doc-form').addEventListener('submit', async ev => {
      ev.preventDefault();
      const v = id => hote.querySelector(id).value;
      try {
        // E-04 : version affichée (majLe de la fiche) ; refusée si quelqu'un a documenté la table entre-temps.
        const d = await envoyer('/api/documentation', { app: t.app, table: t.name, description: v('#doc-description'), domaine: v('#doc-domaine'), responsable: v('#doc-responsable'), note: v('#doc-note'), version: t.doc?.majLe ?? null });
        appliquerDoc(t, d); fermer();
        if (fiche) fiche.innerHTML = tableSheet(t, 'colonnes', { close: true });
        Library.refresh(); toast(tr('{table}: documentation saved', { table: t.name }));
      } catch (err) { const p = hote.querySelector('#doc-erreur'); p.textContent = err.message; p.hidden = false; }
    });
  },
};

// Délégation des clics communs aux fiches
document.addEventListener('click', e => {
  const doc = e.target.closest('[data-documenter]');
  if (doc) { Documentation.ouvrir(doc.dataset.documenter, doc.closest('.quick')); return; }
  const vd = e.target.closest('[data-donnees]');
  if (vd) { Visionneuse.ouvrir(vd.dataset.donnees); return; }
  const el = e.target.closest('[data-open],[data-flux],[data-graph],[data-graph-flux],[data-copy],[data-go],[data-doublon]');
  if (!el) return;
  if (el.dataset.open) Library.open(el.dataset.open);
  else if (el.dataset.flux) Flows.open(el.dataset.flux);
  else if (el.dataset.graph) Graph.focusTable(el.dataset.graph);
  else if (el.dataset.graphFlux) Graph.focusFlux(el.dataset.graphFlux);
  else if (el.dataset.copy) copy(el.dataset.copy);
  else if (el.dataset.go) go(el.dataset.go);
  else if (el.dataset.doublon) Dups.open(el.dataset.doublon);
});
function onSeg(root, name, fn) {
  root.addEventListener('click', e => {
    const b = e.target.closest(`[data-seg="${name}"] button`); if (!b) return;
    b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    fn(b.dataset.v);
  });
}

// ── Bibliothèque ────────────────────────────────────────────────────────
const Library = (() => {
  const st = { app: null, domain: null, filtre: 'toutes', q: '', sel: null, tab: 'colonnes', open: new Set(), tri: 'catalogue' };
  let root, trouves = null;
  const FILTRES = {
    toutes: [tr('All'), () => true],
    echangees: [tr('Exchanged#filter'), t => t.flux.length > 0],
    partagees: [tr('Duplicated'), t => t.refs.some(g => FUSION.has(g.nature))],
    nouvelles: [tr('To document'), t => !!t.nouvelle],
    sensibles: [tr('Sensitive'), t => !!t.sensitive],
    isolees: [tr('Isolated'), t => linkCount(t) === 0],
  };
  function matches(t) {
    if (st.app && t.app !== st.app) return false;
    if (st.domain && t.domain !== st.domain) return false;
    if (!FILTRES[st.filtre][1](t)) return false;
    if (st.q) return trouves.has(t.key);
    return true;
  }
  function render() {
    root = $('s-bibliotheque');
    root.innerHTML = `<div class="panes">
      <aside class="tree"><div class="tree-head"><h6 class="sec-title">${tr('Databases and domains')}</h6></div><div class="tree-body" id="lib-tree"></div></aside>
      <div class="list">
        <div class="list-head">
          <div class="crumb" id="lib-crumb"></div>
          <div class="search" style="width:220px"><span>${icon('search', 14)}</span><input class="input" id="lib-q" type="search" placeholder="${esc(tr('Search: table, column, description…'))}" aria-label="${esc(tr('Search the tables'))}"></div>
          <div id="lib-filtres"></div>
          ${AVEC_LECTURES ? `<div id="lib-tri"></div>` : ''}
          ${SERVEUR ? `<details class="menu-export" id="lib-export"></details>` : ''}
        </div>
        <div id="lib-aussi"></div>
        <div class="list-body table-wrap"><table class="table"><thead><tr><th>${tr('Table')}</th><th>${tr('Domain')}</th><th class="num">${tr('Columns')}</th><th class="num">${tr('Links')}</th><th class="num">${tr('Screens')}</th>${AVEC_LECTURES ? `<th class="num" title="${esc(tr('Reads of the table on the shared server since its last restart (sequential and index scans)'))}">${tr('Reads')}</th>` : ''}<th></th></tr></thead><tbody id="lib-rows"></tbody></table></div>
        <div class="list-foot" id="lib-foot"></div>
      </div>
      <aside class="quick" id="lib-quick"></aside>
    </div>`;
    $('lib-q').addEventListener('input', e => { st.q = e.target.value.trim(); update(); });
    root.addEventListener('click', e => {
      const n = e.target.closest('[data-node]');
      if (n) {
        const [a, d] = n.dataset.node.split('|');
        if (a && !d && st.app === a && !st.domain) { st.open.has(a) ? st.open.delete(a) : st.open.add(a); }
        else if (a) st.open.add(a);
        st.app = a || null; st.domain = d || null; update(); return;
      }
      const row = e.target.closest('tr[data-sel]');
      if (row && !e.target.closest('button')) { st.sel = row.dataset.sel; st.tab = 'colonnes'; update(); }
      if (e.target.closest('[data-close]')) { st.sel = null; update(); }
    });
    root.addEventListener('dblclick', e => { const row = e.target.closest('tr[data-sel]'); if (row) Graph.focusTable(row.dataset.sel); });
    root.addEventListener('keydown', e => { const row = e.target.closest('tr[data-sel]'); if (row && e.key === 'Enter') { st.sel = row.dataset.sel; update(); } });
    onSeg(root, 'filtre', v => { st.filtre = v; update(); });
    onSeg(root, 'tri', v => { st.tri = v; update(); });
    onSeg(root, 'tab', v => { st.tab = v; renderQuick(); });
    update();
  }
  function update() {
    if (!root) return;
    // Arbre
    const domains = a => [...new Set(tablesOf(a).map(t => t.domain))].sort((x, y) => x.localeCompare(y, LOCALE));
    $('lib-tree').innerHTML = `<button class="node" data-node="" aria-current="${!st.app}">${icon('db', 14)}<span>${tr('All databases')}</span><span class="count">${STATS.tables}</span></button>` +
      APP_IDS.map(a => {
        const open = st.open.has(a);
        return `<button class="node" data-node="${a}" aria-current="${st.app === a && !st.domain}" aria-expanded="${open}"><span class="chev">${icon(open ? 'chevronDown' : 'chevronRight', 12, 1.8)}</span><span class="dot" style="background:${APPS[a].couleur}"></span><span>${APPS[a].nom}</span><span class="count">${tablesOf(a).length}</span></button>` +
          (open ? domains(a).map(d => `<button class="node child" data-node="${a}|${esc(d)}" aria-current="${st.app === a && st.domain === d}"><span class="ellipsis">${esc(d)}</span><span class="count">${tablesOf(a).filter(t => t.domain === d).length}</span></button>`).join('') : '');
      }).join('');
    // En-tête
    const base = [...T.values()].filter(t => (!st.app || t.app === st.app) && (!st.domain || t.domain === st.domain));
    trouves = st.q ? new Map(chercher([...T.values()].map(ficheRecherche), st.q).map(r => [r.cle, r])) : null;
    $('lib-crumb').innerHTML = `<div class="sub">${tr('All databases')}${st.app ? ' › ' + APPS[st.app].nom : ''}${st.domain ? ' › ' + esc(st.domain) : ''}</div><div class="crumb-title">${st.domain ? esc(st.domain) : st.app ? APPS[st.app].nom + ' <span class="text-muted sub">· ' + esc(APPS[st.app].role) + '</span>' : tr('All databases')}</div>`;
    $('lib-filtres').innerHTML = seg('filtre', Object.entries(FILTRES).map(([k, [l, fn]]) => [k, l, base.filter(fn).length]), st.filtre);
    // Exports (E-12) de la sélection en cours : outil, domaine, recherche.
    if ($('lib-export')) {
      const p = new URLSearchParams(Object.entries({ outil: st.app, domaine: st.domain, q: st.q }).filter(([, v]) => v)).toString();
      const lien = (chemin, libelle, aide, nouvelOnglet) => `<a class="link-btn" href="/api/export/${chemin}${p ? '?' + p : ''}" ${nouvelOnglet ? 'target="_blank" rel="noopener"' : 'download'} title="${esc(aide)}">${libelle}</a>`;
      $('lib-export').innerHTML = `<summary class="btn btn-secondary btn-sm">${icon('copy', 13)} ${tr('Export')}</summary><div class="card" style="position:absolute;right:0;z-index:20;display:flex;flex-direction:column;gap:6px;min-width:260px;padding:10px">
        <div class="sub text-muted">${tr('{scope}: {n} table(s)', { scope: st.app || st.domain || st.q ? tr('Current selection') : tr('Whole catalogue'), n: base.filter(matches).length })}</div>
        ${lien('tables.csv', tr('Tables (CSV)'), tr('One row per table, for Excel'))}
        ${lien('colonnes.csv', tr('Columns (CSV)'), tr('One row per column, for Excel'))}
        ${lien('dictionnaire.html', tr('Data dictionary'), tr('Printable page (File › Print › PDF)'), true)}
        ${lien('schema.mmd', tr('Table diagram (Mermaid)'), tr('Entity-relationship diagram, to paste into GitHub or mermaid.live'))}
        <div class="sub text-muted">${tr('API:')} <span class="mono">GET /api/catalogue/tables${p ? '?' + esc(p) : ''}</span></div></div>`;
    }

    if (st.refs) for (const g of DOUBLONS.filter(g => FUSION.has(g.nature))) {

      for (let i = 1; i < occ.length; i++) if (T.get(occ[i]).app !== T.get(occ[0]).app) edges.push({ s: occ[0], t: occ[i], kind: 'ref', label: g.id });

  function elementsReseau() {

  function radial() {

    const anneaux = [];

    if (st.vue === 'ecrans') {

      q.querySelector('[data-app-lib]').addEventListener('click', () => Library.select({ app: a }));
    }
  }
  function refresh() { st.redraw = true; if (current === 'graphe') Graph.ensure(); else go('graphe'); }
  return {
    render,
    ensure() {
      if (!window.cytoscape) { $('g-loading').hidden = false; $('g-loading').textContent = tr('The graph library could not be loaded. Check access to cdn.jsdelivr.net.'); return; }
      root.querySelectorAll('[data-seg="vue"] button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === st.vue));

    focusFlux(id) {

    root = $('s-doublons');

      if (opt) {
        const v = opt.dataset.choix, id = st.sel, nv = Decisions.get(id) === v ? null : v;
        Decisions.set(id, nv).then(() => { update(); toast(nv ? tr('{id}: option {option} chosen', { id, option: v }) : tr('{id}: decision withdrawn', { id })); }, err => toast(tr('{id} not saved: {error}', { id, error: err.message })));

      <td class="num">${g.tables.filter(o => o.table !== '—').length}</td>
      <td>${natureTag(g.nature)}</td><td>${gravTag(g.gravite)}</td>
      <td class="nowrap"><span class="tag tag-ghost">${g.recommandation}</span></td>
      <td class="nowrap">${d ? `<span class="tag tag-accent" title="${esc(g.decision && g.decision.option === d ? tr('{status} decision of {date}', { status: g.decision.statut, date: new Date(g.decision.le).toLocaleDateString(LOCALE) }) : tr('Choice saved in this browser'))}">${icon('tick', 10, 2)} ${d}${g.decision && g.decision.option === d && g.decision.statut === 'provisoire' ? ' · ' + tr('provisional') : ''}</span>` : `<span class="text-muted sub">${tr('to decide')}</span>`}</td></tr>`; }).join('') || `<tr><td colspan="7" class="empty">${tr('No group in this filter.')}</td></tr>`;
    $('db-foot').textContent = SERVEUR ? tr('{n} decision(s) out of {total} · saved on the Matrix server and traced in the log', { n: Decisions.count(), total: DOUBLONS.length }) : tr('{n} decision(s) out of {total} · {saved} saved in Matrix, the other choices stay in this browser', { n: Decisions.count(), total: DOUBLONS.length, saved: DOUBLONS.filter(g => g.decision).length });
    const g = DOUBLONS.find(x => x.id === st.sel); const d = Decisions.get(g.id);
    $('db-quick').innerHTML = `<div class="quick-head"><div class="quick-title">${esc(g.objet)}</div></div>
      <div class="tags"><span class="tag tag-ghost">${g.id}</span>${natureTag(g.nature)}${gravTag(g.gravite)}</div>
      <div><div class="block-title">${tr('What the tables contain')}</div><p>${esc(g.contenu)}</p></div>
      <div><div class="block-title">${tr('Tables concerned')} <span>${g.tables.length}</span></div>
        ${g.tables.map(o => `<div class="link-row" style="flex-direction:column;align-items:flex-start;gap:2px"><div style="display:flex;gap:8px;align-items:center">${appMark(o.app)}${o.table === '—' ? `<span class="text-muted">${tr('no table')}</span>` : `<button class="link-btn mono" data-open="${esc(key(o.app, o.table))}">${esc(o.table)}</button>`}</div><div>${esc(o.role)}</div>${o.contenu ? `<div class="sub text-muted">${esc(o.contenu)}</div>` : ''}</div>`).join('')}</div>
      ${g.champs.length ? `<div><div class="block-title">${tr('Matching columns')}</div>${g.champs.map(c => `<div class="link-row mono" style="font-size:11.5px">${esc(c)}</div>`).join('')}</div>` : ''}
      <div><div class="block-title">${tr('Options')} <span>${tr('proposed: {option}', { option: g.recommandation })}</span></div>
        <div style="display:flex;flex-direction:column;gap:8px">${g.options.map(o => `<button type="button" class="option" data-choix="${o.id}" aria-pressed="${d === o.id}">
          <span class="option-head"><span class="option-id">${o.id}</span><span>${esc(o.libelle)}</span>${o.id === g.recommandation ? `<span class="tag tag-ghost" style="margin-left:auto">${tr('proposed')}</span>` : ''}</span>
          <span class="sub text-muted">${esc(o.effet)}</span></button>`).join('')}</div></div>
      <p class="note"><b style="font-weight:500">${tr('Why {option}:', { option: g.recommandation })}</b> ${esc(g.raison)}</p>
      ${g.decision ? `<div><div class="block-title">${tr('{status} decision of {date}', { status: esc(g.decision.statut), date: new Date(g.decision.le).toLocaleDateString(LOCALE) })}</div><p class="note">« ${esc(g.decision.citation)} »<br><span class="text-muted">${esc(g.decision.effet)}</span></p></div>` : ''}
      <div class="actions"><button class="btn btn-primary" id="db-graph">${icon('graph', 14)} ${tr('View in the graph')}</button></div>`;
    $('db-graph').addEventListener('click', () => { const f = g.tables.find(o => o.table !== '—'); Graph.focusTable(key(f.app, f.table), { doublons: true }); });
  }
  return { render, open(id) { st.sel = id; st.filtre = 'tous'; go('doublons'); if (rendered.doublons) update(); } };
})();

      cols: [['code', tr('Code'), 'texte', 'lyon'], ['libelle', tr('Label'), 'texte'], ['ville', tr('City'), 'texte'], ['pays_iso2', tr('Country'), 'pays'], ['filiale_code', tr('Subsidiary'), 'filiale'], ['latitude', tr('Latitude'), 'degres', '45.764'], ['longitude', tr('Longitude'), 'degres', '4.836'], ['ordre', tr('Order'), 'nombre'], ['actif', tr('Active'), 'case']] },

    zones: { titre: tr('Zones'), decision: 'D21', cle: 'code', vue: 'matrix.pub_zones', nouveau: () => ({ code: '', libelle: '', responsable: '', ordre: 0, actif: true, ouest: '', nord: '', est: '', sud: '' }),
      cols: [['code', tr('Code'), 'texte', 'AFN'], ['libelle', tr('Label'), 'texte', tr('North Africa')], ['responsable', tr('Zone director'), 'texte'], ['ouest', tr('West'), 'degres', '-18'], ['nord', tr('North'), 'degres', '38'], ['est', tr('East'), 'degres', '12'], ['sud', tr('South'), 'degres', '18'], ['ordre', tr('Order'), 'nombre'], ['actif', tr('Active'), 'case']] },
    filiales: { titre: tr('Subsidiaries'), decision: 'D21', cle: 'code', vue: 'matrix.pub_filiales', nouveau: () => ({ code: '', nom: '', pays_iso2: 'FR', zone_code: '', devise: 'EUR', ordre: 0, actif: true }),
      cols: [['code', tr('Code'), 'texte', 'APM'], ['nom', tr('Name'), 'texte'], ['pays_iso2', tr('Country'), 'pays'], ['zone_code', tr('Zone'), 'zone'], ['devise', tr('Currency'), 'texte', 'EUR'], ['ordre', tr('Order'), 'nombre'], ['actif', tr('Active'), 'case']] },
    pays: { titre: tr('Countries'), decision: 'D17', cle: 'iso2', vue: 'matrix.pub_pays', nouveau: () => ({ iso2: '', iso3: '', nom_fr: '', nom_en: '', actif: true }),
      cols: [['iso2', 'ISO 2', 'texte', 'FR'], ['iso3', 'ISO 3', 'texte', 'FRA'], ['nom_fr', tr('Name'), 'texte'], ['nom_en', tr('English name'), 'texte'], ['actif', tr('Active'), 'case']] },
  };
  // Liste en lecture ; « Ajouter une ligne » et « Modifier » ouvrent le panneau d'une ligne, enregistrée aussitôt (la liste
  // entière est envoyée, comme avant) ; le panneau se ferme au succès.
  let liste = 'sites', edition = null;   // edition : { i (rang, -1 pour une ligne nouvelle), ligne }

  };

    return `<div class="field"><label class="field-label" for="${id}">${esc(libelle)}</label>${html}</div>`;
  };
  const formulaire = d => panneau(edition.i < 0 ? tr('{list}: new row', { list: esc(d.titre) }) : `${esc(d.titre)}${tr(': ')}<span class="mono">${esc(edition.ligne[d.cle] || '')}</span>`, `
      ${d.cols.map(c => champ(edition.ligne, c)).join('')}
