      <div class="actions"><button class="btn btn-primary btn-sm" id="ref-enregistrer">${tr('Save')}</button>${edition.i >= 0 ? `<button class="btn btn-ghost btn-sm" id="ref-retirer">${tr('Remove the row')}</button>` : ''}<button class="btn btn-ghost btn-sm" id="ref-annuler" data-annuler>${tr('Cancel')}</button></div>`);
  const draw = () => {
    const d = DEF[liste], lignes = EDITION.referentiels[liste];
    root.innerHTML = `<div class="wrap">
      <div class="top" style="margin-bottom:14px"><div>${seg('ref', Object.entries(DEF).map(([k, x]) => [k, x.titre, EDITION.referentiels[k].length]), liste)}</div>
        ${SERVEUR ? `<div class="actions"><button class="btn btn-primary btn-sm" id="ref-ajouter">${icon('plus', 13)} ${tr('Add a row')}</button></div>` : ''}</div>
      <p class="text-muted prose" style="margin-bottom:12px">${tr('Single list decided in {decision}, published to the tools by the view {view} and by {api}.', { decision: d.decision, view: `<span class="mono">${d.vue}</span>`, api: `<span class="mono">GET /api/referentiels/${liste}</span>` })}${!SERVEUR ? ' ' + tr('Changes are made on the Matrix server.') : SERVEUR_COMMUN ? ' ' + tr('Each record is written to the table {table} of the shared server, checked by its constraints and traced in the log; a removed row is deactivated there, never deleted, because the tools keep its code.', { table: `<span class="mono">${d.vue.replace('pub_', '')}</span>` }) : ' ' + tr('Each record is checked with the same rules as the database and traced in the log. Shared server not connected (MATRIX_DATABASE_URL): the list stays in Matrix and does not reach the tools yet.')}</p>
      <div class="table-wrap"><table class="table"><thead><tr>${d.cols.map(c => `<th>${c[1]}</th>`).join('')}${SERVEUR ? '<th></th>' : ''}</tr></thead>
      <tbody>${lignes.map((row, i) => `<tr>${d.cols.map(c => `<td>${lecture(row, c)}</td>`).join('')}${SERVEUR ? `<td><button class="link-btn" data-modifier="${i}">${tr('Edit')}</button></td>` : ''}</tr>`).join('') || `<tr><td colspan="${d.cols.length + 1}" class="empty">${tr('Empty list.')}</td></tr>`}</tbody></table></div>
      ${SERVEUR && edition ? formulaire(d) : ''}</div>`;
  };
  // Valeurs du panneau vers la ligne en cours (avant un nouveau dessin ou l'enregistrement).
  const lire = () => root.querySelectorAll('.drawer [data-k]').forEach(f => { edition.ligne[f.dataset.k] = f.type === 'checkbox' ? f.checked : f.type === 'number' ? (f.value === '' ? '' : Number(f.value)) : f.value; });
  const enregistrer = async lignes => {
    try {
      await envoyer(`/api/referentiels/${liste}`, lignes.map(x => Object.fromEntries(Object.entries(x).map(([k, v]) => [k, v === '' ? null : v]))));
      edition = null; draw(); toast(SERVEUR_COMMUN ? tr('{list}: saved on the shared server', { list: DEF[liste].titre }) : tr('{list}: saved', { list: DEF[liste].titre }));
    } catch (err) { const p = $('ref-erreur'); if (p) { p.textContent = err.message; p.hidden = false; } else toast(err.message); }
  };
  root.addEventListener('change', e => { if (edition && e.target.closest('.drawer select[data-k]')) { lire(); draw(); } });
  root.addEventListener('click', async e => {
    if (e.target.closest('#ref-ajouter')) { edition = { i: -1, ligne: DEF[liste].nouveau() }; draw(); return; }
    const m = e.target.closest('[data-modifier]'); if (m) { edition = { i: +m.dataset.modifier, ligne: copie()[+m.dataset.modifier] }; draw(); return; }
    if (e.target.closest('#ref-annuler')) { edition = null; draw(); return; }
    if (e.target.closest('#ref-retirer')) {
      if (!confirm(tr('Remove this row from the list?'))) return;
      const lignes = copie(); lignes.splice(edition.i, 1); await enregistrer(lignes); return;
    }
    if (e.target.closest('#ref-enregistrer')) {
      lire();
      const lignes = copie(); if (edition.i < 0) lignes.push(edition.ligne); else lignes[edition.i] = edition.ligne;
      await enregistrer(lignes);
    }
  });
  onSeg(root, 'ref', v => { liste = v; edition = null; draw(); });
  draw();
};

// ── Visionneuse des données : contenu d'une table du serveur commun, page par page (rôles Administrateur et Lecture) ──
const Visionneuse = (() => {
  const st = { outil: '', table: '', page: 1, par: 50, tri: '', sens: 'asc', colonne: '', contient: '', resultat: null, erreur: null, charge: false, q: '', edition: null };
  let root = null;
  const tablesDe = outil => [...T.values()].filter(t => t.app === outil).map(t => t.name).sort();
  async function charger() {
    if (!st.outil || !st.table) { st.resultat = null; draw(); return; }
    st.charge = true; st.erreur = null; st.edition = null; draw();
    try { st.resultat = await lireApi('/api/donnees', { outil: st.outil, table: st.table, page: st.page, par: st.par, tri: st.tri, sens: st.sens, colonne: st.colonne, contient: st.contient }); }
    catch (e) { st.erreur = e.message; st.resultat = null; }

  }
  // Édition par la fonction pub_editer_<table> de l'outil (M-18 : Matrix n'écrit jamais lui-même dans les outils).
  const cleDe = (r, ligne) => {
    if (!r.cle?.length) return null;
    const o = {};
    for (const k of r.cle) { const i = r.colonnes.findIndex(c => c.nom === k); if (i < 0 || !r.colonnes[i].lisible) return null; o[k] = ligne[i]; }
    return o;
  };
  function formulaire(r) {
    const e = st.edition, lisibles = r.colonnes.map((c, i) => ({ ...c, i })).filter(c => c.lisible);
    const ligne = e.ligne ?? [];
    const titre = { ajouter: tr('Add a row'), corriger: tr('Correct the row'), retirer: tr('Remove the row') }[e.action];
    return panneau(`${titre} — ${tr('through {fn}', { fn: `<span class="mono">${esc(r.edition.fonction)}</span>` })}`, `
      ${e.action === 'retirer' ? `<p class="sub">${tr('Row {key}. The tool applies its rules: a removal may be an archiving.', { key: esc(JSON.stringify(e.cle)) })}</p>`
        : `<div style="display:flex;gap:10px;flex-wrap:wrap">${lisibles.map(c => `<div class="field" style="width:220px"><label class="field-label mono" for="ve-${esc(c.nom)}">${esc(c.nom)} <span class="text-muted">${esc(c.type)}</span></label>
          <input class="input mono" id="ve-${esc(c.nom)}" data-ve="${esc(c.nom)}" value="${esc(ligne[c.i] ?? '')}" ${e.action === 'corriger' && r.cle.includes(c.nom) ? 'disabled' : ''}></div>`).join('')}</div>
          <p class="sub text-muted">${e.action === 'corriger' ? tr('Only the changed values are sent.') : tr('Empty fields are not sent.')} ${tr('Columns closed to Matrix are neither read nor editable here.')}</p>`}
      <div class="field"><label class="field-label" for="ve-motif">${tr('Reason (goes into the tool’s log)')}</label><input class="input" id="ve-motif" maxlength="500"></div>
      <div class="actions"><button class="btn btn-primary btn-sm" id="ve-envoyer">${e.action === 'retirer' ? tr('Remove') : tr('Save')}</button><button class="btn btn-ghost btn-sm" id="ve-annuler" data-annuler>${tr('Cancel')}</button></div>`);
  }
  async function envoyerEdition() {
    const r = st.resultat, e = st.edition, ligne = e.ligne ?? [];
    const valeurs = {};
    if (e.action !== 'retirer') root.querySelectorAll('[data-ve]').forEach(inp => {
      if (inp.disabled) return;
      const i = r.colonnes.findIndex(c => c.nom === inp.dataset.ve), avant = ligne[i] ?? '';
      if (e.action === 'ajouter' ? inp.value !== '' : inp.value !== String(avant)) valeurs[inp.dataset.ve] = inp.value === '' ? null : inp.value;
    });
    if (e.action !== 'retirer' && !Object.keys(valeurs).length) { toast(tr('No value changed')); return; }
    try {
      await poster('/api/donnees/editer', { outil: r.outil, table: r.table, action: e.action, cle: e.cle, valeurs: e.action === 'retirer' ? null : valeurs, motif: $('ve-motif').value });
      toast({ ajouter: tr('Row added by the tool'), corriger: tr('Row corrected by the tool'), retirer: tr('Row removed by the tool') }[e.action]);
      st.edition = null; charger();
    } catch (err) { toast(err.message); }
  }
  function grille(r) {
    const lisibles = r.colonnes.filter(c => c.lisible);
    const modifiable = r.edition?.executable;
    const totalTxt = r.total != null ? tr('{n} row(s)', { n: fmt(r.total) }) : r.totalEstime != null ? tr('about {n} row(s)', { n: fmt(r.totalEstime) }) : tr('number of rows unknown');
    const debut = (r.page - 1) * r.par + 1, fin = (r.page - 1) * r.par + r.lignes.length;
    return `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0">
        <span class="tag tag-ghost">${esc(r.genre)}</span><span class="sub text-muted">${totalTxt}${r.contient ? ' · ' + tr('filter: {column} contains “{text}”', { column: esc(r.colonne), text: esc(r.contient) }) : ''}</span>
        <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
          <select class="input" id="v-colonne" style="width:180px">${lisibles.map(c => `<option ${c.nom === (st.colonne || lisibles[0]?.nom) ? 'selected' : ''}>${esc(c.nom)}</option>`).join('')}</select>
          <input class="input" id="v-contient" placeholder="${esc(tr('contains…'))}" value="${esc(st.contient)}" style="width:180px">
          <button class="btn btn-secondary btn-sm" id="v-filtrer">${tr('Filter')}</button>${st.contient ? `<button class="btn btn-ghost btn-sm" id="v-effacer">${tr('Clear')}</button>` : ''}</span></div>
      <div class="sub text-muted" style="margin-bottom:6px">${modifiable ? `${tr('Editable by the tool ({fn}):', { fn: esc(r.edition.fonction) })} <button class="btn btn-secondary btn-sm" data-ve-action="ajouter">${tr('Add a row')}</button>` : `${tr('Read only')}${r.edition?.raison ? `${tr(': ')}${esc(r.edition.raison)}` : ''}.`}</div>
      ${st.edition ? formulaire(r) : ''}
      ${r.fermee ? `<p class="note">${tr('Every column of this table is closed to Matrix (sensitive data): nothing is read.')}</p>` : r.lignes.length ? `<div class="table-wrap" style="overflow:auto;max-height:65vh"><table class="table" style="font-size:12px"><thead><tr>${r.colonnes.map(c => c.lisible
        ? `<th class="nowrap"><button class="link-btn mono" data-v-tri="${esc(c.nom)}" title="${esc(c.type)} — ${esc(tr('sort'))}">${esc(c.nom)}${st.tri === c.nom ? (st.sens === 'asc' ? ' ▲' : ' ▼') : ''}</button></th>`
        : `<th class="nowrap mono text-muted" title="${esc(tr('Sensitive column or closed to Matrix: never read'))}">${icon('lock', 10)} ${esc(c.nom)}</th>`).join('')}${modifiable ? '<th></th>' : ''}</tr></thead><tbody>
        ${r.lignes.map((l, n) => `<tr>${l.map(v => v && v.ferme ? '<td class="text-muted">—</td>' : v == null ? '<td class="text-muted sub">null</td>' : `<td class="mono" style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(v)}">${esc(v)}</td>`).join('')}${modifiable && cleDe(r, l) ? `<td class="nowrap"><button class="link-btn" data-ve-action="corriger" data-ve-ligne="${n}">${tr('Correct')}</button> · <button class="link-btn" data-ve-action="retirer" data-ve-ligne="${n}">${tr('Remove')}</button></td>` : ''}</tr>`).join('')}</tbody></table></div>`
        : `<p class="text-muted">${tr('No row.')}</p>`}
      <div style="display:flex;gap:10px;align-items:center;margin-top:10px">
        <button class="btn btn-secondary btn-sm" id="v-prec" ${r.page > 1 ? '' : 'disabled'}>← ${tr('Previous')}</button>
        <span class="sub">${tr('Page {n}', { n: r.page })}${r.lignes.length ? ' · ' + tr('rows {from} to {to}', { from: fmt(debut), to: fmt(fin) }) : ''}</span>
        <button class="btn btn-secondary btn-sm" id="v-suiv" ${r.suivante ? '' : 'disabled'}>${tr('Next')} →</button>
        <select class="input" id="v-par" style="width:110px;margin-left:auto">${[25, 50, 100, 200].map(n => `<option value="${n}" ${n === r.par ? 'selected' : ''}>${tr('{n} per page', { n })}</option>`).join('')}</select></div>`;
  }
  function draw() {
    if (!root) return;
    if (!SERVEUR_COMMUN) { root.innerHTML = `<div class="wrap"><p class="note">${tr('The viewer reads the data on the shared server: Matrix is not connected to it (MATRIX_DATABASE_URL).')}</p></div>`; return; }
    const tables = st.outil ? tablesDe(st.outil).filter(n => !st.q || n.includes(st.q.toLowerCase())) : [];
    root.innerHTML = `<div class="wrap">
      <p class="text-muted prose">${tr('What a table or a view of a tool contains, read on the shared server. Sensitive columns (droits.colonnes_sensibles) are never read: they appear with a padlock. A table is edited here only when its tool provides the function pub_editer_&lt;table&gt; and the Matrix write link is allowed: the tool writes, with its rules and its log. Viewing open to the Administrator and Read roles; changes reserved to the Administrator role. Every viewing and every change is logged.')}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0">
        ${seg('voutil', APP_IDS.map(a => [a, APPS[a].nom]), st.outil)}
        ${st.outil ? `<input class="input" id="v-q" type="search" placeholder="${esc(tr('Filter the tables…'))}" value="${esc(st.q)}" style="width:200px">
        <select class="input mono" id="v-table" style="width:280px"><option value="">— ${tr('choose a table ({n})', { n: tables.length })} —</option>${tables.map(n => `<option ${n === st.table ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>` : `<span class="sub text-muted">${tr('Choose a tool.')}</span>`}
        ${st.table ? `<button class="btn btn-ghost btn-sm" data-open="${esc(key(st.outil, st.table))}">${tr('Table sheet')}</button>` : ''}</div>
      ${st.charge ? `<p class="text-muted">${tr('Reading…')}</p>` : st.erreur ? `<p class="note">${esc(st.erreur)}</p>` : st.resultat ? grille(st.resultat) : ''}</div>`;
    hydrateIcons(root);
  }
  function brancher() {
    root.addEventListener('click', e => {
      const t = e.target.closest('[data-v-tri]');
      if (t) { st.sens = st.tri === t.dataset.vTri && st.sens === 'asc' ? 'desc' : 'asc'; st.tri = t.dataset.vTri; st.page = 1; charger(); return; }
      if (e.target.closest('#v-prec')) { st.page--; charger(); return; }
      if (e.target.closest('#v-suiv')) { st.page++; charger(); return; }
      if (e.target.closest('#v-filtrer')) { st.colonne = $('v-colonne').value; st.contient = $('v-contient').value.trim(); st.page = 1; charger(); return; }
      if (e.target.closest('#v-effacer')) { st.contient = ''; st.colonne = ''; st.page = 1; charger(); return; }
      const va = e.target.closest('[data-ve-action]');
      if (va) { const r = st.resultat, ligne = va.dataset.veLigne != null ? r.lignes[+va.dataset.veLigne] : null; st.edition = { action: va.dataset.veAction, ligne, cle: ligne ? cleDe(r, ligne) : null }; draw(); return; }
      if (e.target.closest('#ve-annuler')) { st.edition = null; draw(); return; }
      if (e.target.closest('#ve-envoyer')) envoyerEdition();
    });
    root.addEventListener('change', e => {
      if (e.target.id === 'v-table') { Object.assign(st, { table: e.target.value, page: 1, tri: '', colonne: '', contient: '' }); charger(); }
      if (e.target.id === 'v-par') { st.par = Number(e.target.value); st.page = 1; charger(); }
    });
    root.addEventListener('keydown', e => { if (e.target.id === 'v-contient' && e.key === 'Enter') $('v-filtrer').click(); });
    root.addEventListener('input', e => { if (e.target.id === 'v-q') { st.q = e.target.value; const p = e.target.selectionStart; draw(); const i = $('v-q'); i.focus(); i.setSelectionRange(p, p); } });
    onSeg(root, 'voutil', v => { Object.assign(st, { outil: v, table: '', q: '', resultat: null, erreur: null }); draw(); });
  }
  return {
    render() { root = $('s-donnees'); brancher(); draw(); },
    ouvrir(cle) { const [a, t] = cle.split('.'); Object.assign(st, { outil: a, table: t, page: 1, tri: '', colonne: '', contient: '', q: '' }); go('donnees'); if (root) charger(); else setTimeout(charger); },
  };
})();

async function mettre(chemin, corps) {
  const r = await fetch(chemin, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(corps) });
  const j = await r.json().catch(() => ({ erreur: tr('unreadable reply from the server') }));
  if (!r.ok) { const e = new Error(j.erreur || tr('error {status}', { status: r.status })); e.conflit = r.status === 409 && 'actuel' in j; throw e; }
  return j;
}

        <span class="sub text-muted">${tr('{n} term(s)', { n: L.length })}</span></div>
      ${L.length ? L.map(t => `<div class="card" style="margin-bottom:10px;padding:14px 16px${t.actif ? '' : ';opacity:.6'}">
        <div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><b>${esc(t.terme)}</b>${t.domaine ? ` <span class="tag tag-ghost">${esc(t.domaine)}</span>` : ''}${t.actif ? '' : ` <span class="tag tag-outline">${tr('removed')}</span>`}
          <span class="sub text-muted" style="margin-left:auto">${t.proprietaire ? esc(t.proprietaire) + ' · ' : ''}${esc(t.majPar || '')} · ${quand(t.majLe)}</span>
          <button class="link-btn" data-g-modifier="${esc(t.id)}">${tr('Edit')}</button></div>
        <p style="margin:6px 0">${esc(t.definition)}</p>

        ${(t.colonnes || []).length ? `<div class="tags" style="margin-top:6px">${t.colonnes.map(c => { const [a, tb, col] = c.split('.'); return `<button class="tag tag-ghost mono" data-open="${esc(key(a, tb))}" title="${esc(tr('Open the table'))}">${appMark(a, 12)} ${esc(tb)}.${esc(col)}</button>`; }).join('')}</div>` : ''}
      </div>`).join('') : `<p class="text-muted">${GLOSSAIRE.termes.length ? tr('No term matches.') : tr('Empty glossary: add the first term.')}</p>`}</div>`;

  root.addEventListener('change', e => { if (e.target.id === 'g-retires') { st.retires = e.target.checked; draw(); } });

    if (e.target.closest('#g-nouveau')) { st.edition = {}; draw(); $('g-terme').focus(); return; }
    const m = e.target.closest('[data-g-modifier]');

      const j = await mettre('/api/glossaire', corps);

  });
  chargerGlossaire().then(draw); draw();
};

// Règles de qualité : liste et saisie (Santé › Qualité des données), sur le serveur commun quand il est relié.
const TYPES_QUALITE = { fraicheur: tr('Freshness'), non_nul: tr('Empty values'), unicite: tr('Uniqueness'), plage: tr('Range'), valeurs: tr('Allowed values') };
const GRAVITE_REGLE = { info: tr('Info'), attention: tr('Warning'), erreur: tr('Error') };
function parametresRegle(r) {
  if (r.type === 'fraicheur') return tr('at most {n} day(s)', { n: r.maxJours });
  if (r.type === 'non_nul') return tr('at most {pct} % empty', { pct: Math.round((r.seuil || 0) * 1000) / 10 });
  if (r.type === 'plage') return [r.min != null ? `≥ ${r.min}` : '', r.max != null ? `≤ ${r.max}` : ''].filter(Boolean).join(' ' + tr('and') + ' ');
  if (r.type === 'valeurs') return (r.liste || []).join(', ');
  return '';
}
function gererRegles(el, apresEnregistrement) {
  const st = { regles: null, source: '', modifiable: false, erreur: null, edition: null };
  const nombre = v => v === '' || v == null ? undefined : isNaN(Number(v)) ? v : Number(v);
  const champ = (id, label, html, largeur = 180) => `<div class="field" style="width:${largeur}px"><label class="field-label" for="${id}">${label}</label>${html}</div>`;
  const formulaire = r => {
    const suivant = 'Q' + String(Math.max(0, ...st.regles.map(x => Number(x.id.slice(1)))) + 1).padStart(2, '0');
    return panneau(r.id ? tr('Edit rule {id}', { id: esc(r.id) }) : tr('New rule'), `
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        ${champ('qr-id', tr('No.'), `<input class="input mono" id="qr-id" value="${esc(r.id || suivant)}" ${r.id ? 'disabled' : ''}>`, 90)}
        ${champ('qr-table', tr('Table (tool.table)'), `<input class="input mono" id="qr-table" value="${esc(r.table || '')}" placeholder="keystone.projects">`, 220)}
        ${champ('qr-type', tr('Type'), `<select class="input" id="qr-type">${Object.entries(TYPES_QUALITE).map(([k, l]) => `<option value="${k}" ${r.type === k ? 'selected' : ''}>${l}</option>`).join('')}</select>`, 160)}
        ${champ('qr-colonnes', tr('Column(s), separated by commas'), `<input class="input mono" id="qr-colonnes" value="${esc((r.colonnes || (r.colonne ? [r.colonne] : [])).join(', '))}">`, 240)}
        ${champ('qr-gravite', tr('Severity if not met'), `<select class="input" id="qr-gravite">${['info', 'attention', 'erreur'].map(g => `<option value="${g}" ${(r.gravite || 'attention') === g ? 'selected' : ''}>${esc(GRAVITE_REGLE[g])}</option>`).join('')}</select>`, 150)}</div>
      ${champ('qr-libelle', tr('Label'), `<input class="input" id="qr-libelle" maxlength="200" value="${esc(r.libelle || '')}">`, 640)}
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        ${champ('qr-maxJours', tr('Freshness: days at most'), `<input class="input" id="qr-maxJours" type="number" min="1" value="${esc(r.maxJours ?? '')}">`, 150)}
        ${champ('qr-seuil', tr('Empty: share tolerated (%)'), `<input class="input" id="qr-seuil" type="number" min="0" max="99.9" step="0.1" value="${r.seuil != null ? Math.round(r.seuil * 1000) / 10 : ''}">`, 150)}
        ${champ('qr-min', tr('Range: minimum'), `<input class="input" id="qr-min" value="${esc(r.min ?? '')}" placeholder="0, 2020-01-01">`, 150)}
        ${champ('qr-max', tr('Range: maximum'), `<input class="input" id="qr-max" value="${esc(r.max ?? '')}" placeholder="aujourd'hui">`, 150)}
        ${champ('qr-liste', tr('Allowed values (commas)'), `<input class="input" id="qr-liste" value="${esc((r.liste || []).join(', '))}">`, 240)}</div>
      ${r.id ? `<label class="sub" style="display:flex;gap:6px;align-items:center;margin:6px 0"><input type="checkbox" id="qr-actif" ${r.actif !== false ? 'checked' : ''}> ${tr('Rule checked (untick to remove it)')}</label>` : ''}
      <p class="sub text-muted">${tr('Only the settings of the chosen type count. The rule is checked at the next reading of the shared server, started at once.')}</p>
      <div class="actions"><button class="btn btn-primary btn-sm" id="qr-enregistrer">${tr('Save')}</button><button class="btn btn-ghost btn-sm" id="qr-annuler" data-annuler>${tr('Cancel')}</button></div>`, { large: true });
  };
  const draw = () => {
    if (st.erreur) { el.innerHTML = `<p class="note">${esc(st.erreur)}</p>`; return; }
    if (!st.regles) { el.innerHTML = `<p class="text-muted sub">${tr('Reading the rules…')}</p>`; return; }
    el.innerHTML = `<div class="block-title" style="margin-top:22px">${tr('Rules')} <span>${st.regles.filter(r => r.actif !== false).length}</span>
        ${st.modifiable ? `<button class="btn btn-secondary btn-sm" id="qr-nouvelle" style="margin-left:10px">${tr('New rule')}</button>` : ''}</div>
      <p class="sub text-muted">${st.modifiable ? tr('Rules kept by the IT department on the shared server (matrix.regles_qualite, decision M-04); every change is logged.') : `${tr('Rules read in data/regles-qualite.json')}${st.erreurSource ? ` (${esc(st.erreurSource)})` : ''}${tr(': they are edited in Matrix once partage/17 has been run on the shared server.')}`}</p>
      ${st.edition ? formulaire(st.edition) : ''}
      <div class="table-wrap"><table class="table"><thead><tr><th>${tr('Rule')}</th><th>${tr('Table')}</th><th>${tr('Type')}</th><th>${tr('Settings')}</th><th>${tr('Severity')}</th>${st.modifiable ? `<th>${tr('Changed')}</th><th></th>` : ''}</tr></thead><tbody>
      ${st.regles.map(r => `<tr${r.actif === false ? ' style="opacity:.55"' : ''}><td><span class="mono">${esc(r.id)}</span> ${esc(r.libelle)}${r.actif === false ? ` <span class="tag tag-outline">${tr('withdrawn')}</span>` : ''}</td>
        <td class="mono sub">${esc(r.table)}.${esc((r.colonnes || [r.colonne]).join(', '))}</td><td class="sub">${esc(TYPES_QUALITE[r.type] || r.type)}</td><td class="sub">${esc(parametresRegle(r))}</td><td>${etatTag(r.gravite || 'attention')}</td>
        ${st.modifiable ? `<td class="sub text-muted nowrap">${esc(r.majPar || '')} · ${quand(r.majLe)}</td><td><button class="link-btn" data-qr="${esc(r.id)}">${tr('Edit')}</button></td>` : ''}</tr>`).join('')}</tbody></table></div>`;
  };
  const charger = async () => {
    try { const j = await lireApi('/api/qualite'); Object.assign(st, { regles: j.regles, source: j.source, modifiable: !!j.modifiable && SERVEUR, erreurSource: j.erreur, erreur: null }); }
    catch (e) { st.erreur = e.message; }
    draw();
  };
  el.addEventListener('click', async e => {
    if (e.target.closest('#qr-nouvelle')) { st.edition = {}; draw(); return; }
    const m = e.target.closest('[data-qr]'); if (m) { st.edition = { ...st.regles.find(r => r.id === m.dataset.qr) }; draw(); return; }
    if (e.target.closest('#qr-annuler')) { st.edition = null; draw(); return; }
    const b = e.target.closest('#qr-enregistrer'); if (!b) return;
    const v = id => $(id).value.trim(), type = v('qr-type'), cols = v('qr-colonnes').split(',').map(s => s.trim()).filter(Boolean);
    const corps = { id: v('qr-id'), table: v('qr-table'), type, libelle: v('qr-libelle'), gravite: v('qr-gravite'), actif: $('qr-actif') ? $('qr-actif').checked : true,
      version: st.edition.id ? st.edition.majLe : null, ...(type === 'unicite' ? { colonnes: cols } : { colonne: cols[0] }) };
    if (type === 'fraicheur') corps.maxJours = nombre(v('qr-maxJours'));
    if (type === 'non_nul') corps.seuil = v('qr-seuil') === '' ? 0 : Number(v('qr-seuil')) / 100;
    if (type === 'plage') { const mn = nombre(v('qr-min')), mx = nombre(v('qr-max')); if (mn !== undefined) corps.min = mn; if (mx !== undefined) corps.max = mx; }
    if (type === 'valeurs') corps.liste = v('qr-liste').split(',').map(s => s.trim()).filter(Boolean);
    b.disabled = true;
    try { const j = await mettre('/api/qualite/regles', corps); toast(tr('Rule {id} saved', { id: j.regle.id })); st.edition = null; await charger(); apresEnregistrement?.(); }
    catch (err) { toast(err.message); b.disabled = false; if (err.conflit) await charger(); }
  });
  charger();
}

// ── Santé des tables et des liens (sonde du serveur commun) ─────────────
let SANTE = DATA.sante || null;
async function poster(chemin, corps) {
  const r = await fetch(chemin, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(corps ?? {}) });
  const j = await r.json().catch(() => ({ erreur: tr('unreadable reply from the server') }));
  if (!r.ok) throw new Error(j.erreur || tr('error {status}', { status: r.status }));
  return j;
}
const ETAT = { erreur: [tr('Error'), 'tag-accent'], attention: [tr('Warning'), 'tag-outline'], ok: ['OK', 'tag-neutral'], info: [tr('Info'), 'tag-neutral'] };
const etatTag = g => `<span class="tag ${(ETAT[g] || ETAT.info)[1]}">${(ETAT[g] || ETAT.info)[0]}</span>`;
const octets = n => n == null ? '—' : n < 1024 * 1024 ? tr('{n} KB', { n: Math.round(n / 1024) }) : n < 1024 ** 3 ? tr('{n} MB', { n: (n / 1024 / 1024).toFixed(1) }) : tr('{n} GB', { n: (n / 1024 ** 3).toFixed(2) });
const quand = d => d ? new Date(d).toLocaleString(LOCALE, { dateStyle: 'short', timeStyle: 'short' }) : '—';
const LIENS_A_TRAITER = ['a_retirer', 'hors_registre', 'a_appliquer', 'vue_absente', 'en_attente'];
const SANS_SONDE = `<div class="card" style="max-width:720px"><div class="card-kicker">${tr('Shared server probe')}</div>
  <p class="prose">${tr('Matrix has not read the shared PostgreSQL server yet. Set {url} on the Matrix server (role {role}): Matrix will itself read the tables, the links, the {pub} views and the rights of each tool, carry them into the library and the graphs, and calculate this health state at each reading (every hour by default, {minutes}).', { url: '<span class="mono">MATRIX_DATABASE_URL</span>', role: '<span class="mono">matrix_app</span>', pub: '<span class="mono">pub_</span>', minutes: '<span class="mono">MATRIX_SYNCHRO_MINUTES</span>' })}</p></div>`;
function navLiens() { const el = $('nav-liens'); if (!el) return; const n = (SANTE?.liens || []).filter(l => LIENS_A_TRAITER.includes(l.etat)).length; el.textContent = n; el.hidden = !n; el.title = tr('{n} link(s) to handle', { n }); }
async function relire(bouton) {
  bouton.disabled = true; bouton.textContent = tr('Reading the server…');
  try { const j = await poster('/api/synchro'); SANTE = j.sante; toast(tr('Shared server reread')); rendered.sante = rendered.liens = false; show(current); navLiens(); }
  catch (e) { toast(e.message); bouton.disabled = false; bouton.textContent = tr('Reread the server'); }
}

const ETATS_PUB = { appliquee: [tr('Applied#publication'), 'tag-neutral'], brouillon: [tr('Draft'), 'tag-outline'], erreur: [tr('Error'), 'tag-accent'], retiree: [tr('Withdrawn#publication'), 'tag-ghost'] };

RENDER.publications = () => {
  const root = $('s-publications');
  if (!SERVEUR || !SERVEUR_COMMUN) { root.innerHTML = `<div class="wrap">${SANS_SERVEUR_COMMUN(tr('The publication registry (pub_ views of the tools, decision M-18)'))}</div>`; return; }
  const st = { outil: '', etat: 'toutes', liste: null, nonReprises: [], gestion: false, erreur: null, sel: null, fiche: null, brouillon: null, depot: null };
  const enHaut = () => { root.scrollIntoView({ block: 'start' }); root.scrollTo?.(0, 0); };
  const charger = async () => {
    try { const j = await lireApi('/api/publications'); Object.assign(st, { liste: j.publications, nonReprises: j.nonReprises, gestion: j.gestion, erreur: null }); }
    catch (e) { st.erreur = e.message; }
    try { st.depot = await lireApi('/api/publications/depot'); } catch { st.depot = null; }
    draw();
  };
  const ouvrir = async vue => {
    st.sel = vue; st.fiche = null; st.brouillon = null; draw();
    try {
      const { publication: p } = await lireApi(`/api/publications/${encodeURIComponent(vue)}`);
      st.fiche = p;
      st.brouillon = { mode: p.mode, source: p.source || '', colonnes: p.colonnes || [], filtre: p.filtre || '', definition: p.definition || '', description: p.description || '' };
    } catch (e) { toast(e.message); st.sel = null; }
    draw();
  };
  const nouvelle = () => {
    const outil = prompt(tr('Publishing tool ({tools}):', { tools: APP_IDS.join(', ') }), st.outil || 'keystone'); if (!outil) return;
    if (!APP_IDS.includes(outil.trim())) return toast(tr('Unknown tool'));
    const nom = prompt(tr('Name of the view (after “pub_”, lower case, digits and _):')); if (!nom) return;
    const vue = `${outil.trim()}.pub_${nom.trim().replace(/^pub_/, '')}`;
    if (!/^[a-z]+\.pub_[a-z0-9_]+$/.test(vue)) return toast(tr('Invalid name: lower case, digits and _ only'));
    if ((st.liste || []).some(p => p.vue === vue)) return ouvrir(vue);
    st.sel = vue; st.fiche = { vue, outil: outil.trim(), etat: 'nouvelle', nouvelle: true, contrat: null, liens: [], journal: [] };
    st.brouillon = { mode: 'colonnes', source: '', colonnes: [], filtre: '', definition: '', description: '' };
    draw();
  };
  // Lecture des champs de la fiche vers le brouillon (avant un enregistrement ou un changement de mode).
  const lireFiche = () => {
    const b = st.brouillon; if (!b) return;
    b.description = $('pub-description')?.value ?? b.description;
    if (b.mode === 'sql') { b.definition = $('pub-definition')?.value ?? b.definition; return; }
    b.source = $('pub-source')?.value ?? b.source;
    b.filtre = $('pub-filtre')?.value ?? b.filtre;
    const coches = [...root.querySelectorAll('[data-pub-col]')].filter(c => c.checked).map(c => c.dataset.pubCol);
    const ordre = [...root.querySelectorAll('[data-pub-col]')].map(c => c.dataset.pubCol);
    b.colonnes = ordre.filter(c => coches.includes(c)).map(c => ({ colonne: c, nom: (root.querySelector(`[data-pub-nom="${c}"]`)?.value || c).trim() }));
  };
  const enregistrer = async () => {
    lireFiche();
    const b = st.brouillon;
    const corps = b.mode === 'sql' ? { mode: 'sql', definition: b.definition, description: b.description } : { mode: 'colonnes', source: b.source, colonnes: b.colonnes, filtre: b.filtre, description: b.description };
    const r = await fetch(`/api/publications/${encodeURIComponent(st.sel)}`, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(corps) });
    const j = await r.json().catch(() => ({ erreur: tr('unreadable reply from the server') }));
    if (!r.ok) throw new Error(j.erreur || tr('error {status}', { status: r.status }));
    return j.publication;
  };
  const action = async (quoi, bouton) => {
    if (bouton) bouton.disabled = true;
    try {
      if (quoi === 'enregistrer') { await enregistrer(); toast(tr('Draft saved: nothing changed on the server')); }
      else if (quoi === 'appliquer') {
        if (!confirm(tr('Apply {view} on the shared server? The tools that read it will see the new definition at once.', { view: st.sel }))) return;
        await enregistrer();
        const j = await poster(`/api/publications/${encodeURIComponent(st.sel)}/appliquer`);
        toast(tr('Publication applied: {cols} column(s), {readers} reader(s)', { cols: j.resultat.contrat.length, readers: j.resultat.lecteurs.length }));

        await poster(`/api/publications/${encodeURIComponent(st.sel)}/retirer`, { motif });
        toast(tr('Publication withdrawn')); rendered.liens = rendered.sante = false; st.sel = null; st.fiche = null;
      }
    } catch (e) { toast(e.message); }
    finally { if (bouton) bouton.disabled = false; }
    await charger(); if (st.sel) await ouvrir(st.sel);
  };

  const fiche = () => {
    const p = st.fiche, b = st.brouillon, outil = st.sel.split('.')[0];
    if (!p || !b) return `<div class="card"><p class="text-muted">${tr('Loading {view}…', { view: esc(st.sel) })}</p></div>`;
    const tables = tablesOf(outil).slice().sort((x, y) => x.name.localeCompare(y.name));
    const t = T.get(b.source);
    const sensibles = new Set(t?.sensitive || []);
    const choisies = new Map((b.colonnes || []).map(c => [c.colonne, c.nom]));

      <div class="field"><label class="field-label" for="pub-description">${tr('Description (comment of the view, read by the tools)')}</label><input class="input" id="pub-description" maxlength="2000" value="${esc(b.description || '')}"></div>

        <div class="tags">${p.contrat.map(c => `<span class="tag tag-ghost mono" title="${esc(c.type)}">${esc(c.nom)}</span>`).join('')}</div>` : `<p class="text-muted sub">${tr('Not applied yet.')}</p>`}
      <div class="block-title" style="margin-top:20px">${tr('Readers')} <span>${lecteurs.length}</span></div>
      <p class="sub">${lecteurs.length ? lecteurs.map(nomLecteur).join(', ') : `<span class="text-muted">${tr('No tool allowed.')}</span>`} <button class="link-btn" data-go="liens">${tr('Manage the links')}</button></p>
      ${p.definition && b.mode === 'colonnes' ? `<details style="margin-top:14px"><summary class="sub text-muted">${tr('Saved query')}</summary><pre class="mono sub" style="white-space:pre-wrap;margin-top:6px">${esc(p.definition)}</pre></details>` : ''}
      <div class="block-title" style="margin-top:20px">${tr('Log')} <span>${(p.journal || []).length}</span></div>
      ${(p.journal || []).length ? `<div class="table-wrap"><table class="table"><tbody>${p.journal.map(j => `<tr><td class="tabnum text-muted nowrap">${quand(j.le)}</td><td>${esc(j.par || '')}</td><td>${esc({ reprise: tr('Takeover'), creation: tr('Creation'), modification: tr('Change#log'), application: tr('Application'), erreur: tr('Error'), retrait: tr('Withdrawal') }[j.action] || j.action)}</td><td class="sub text-muted">${esc(j.detail || '')}</td></tr>`).join('')}</tbody></table></div>` : `<p class="text-muted sub">${tr('No entry.')}</p>`}
    </div>`;
  };

  // Demandes préparées dans data/publications-depot.json (M-18) : état face au registre et action proposée.
  const ETATS_DEPOT = { a_enregistrer: [tr('To save'), 'tag-outline'], a_mettre_a_jour: [tr('Different from the registry'), 'tag-outline'], enregistree: [tr('Draft saved'), 'tag-neutral'],
    appliquee: [tr('Applied#publication'), 'tag-neutral'], attendue: [tr('Expected'), 'tag-ghost'], a_autoriser: [tr('To allow'), 'tag-outline'], a_demander: [tr('View absent: request to enter'), 'tag-outline'],

  const blocDepot = () => {
    const d = st.depot; if (!d?.publications) return '';
    const aFaire = [...d.publications.filter(p => !['appliquee'].includes(p.etat)), ...d.liens.filter(l => l.etat !== 'autorise')].length;
    const pubs = d.publications.map(p => `<tr><td class="nowrap">${appMark(p.vue.split('.')[0], 16)} <span class="mono">${esc(p.vue)}</span><div class="sub text-muted">${esc(p.demande)}</div></td>

          ${p.etat !== 'attendue' && p.etat !== 'a_enregistrer' ? ` <button class="link-btn" data-pub="${esc(p.vue)}">${tr('Open')}</button>` : ''}</td></tr>`).join('');

    return `<details class="card" style="margin-bottom:16px" ${aFaire ? 'open' : ''}><summary style="cursor:pointer"><span class="block-title" style="display:inline">${tr('Requests to handle')}</span> <span class="tag ${aFaire ? 'tag-accent' : 'tag-neutral'}">${aFaire || tr('none#fem')}</span></summary>
      <p class="sub text-muted" style="margin:8px 0">${tr('Publications and links prepared in Matrix for the requests of the tools ({file}), against the registry of the shared server. Nothing is applied without your action.', { file: '<span class="mono">data/publications-depot.json</span>' })}</p>
      <div class="table-wrap"><table class="table"><thead><tr><th>${tr('Publication')}</th><th>${tr('State')}</th><th>${tr('Note')}</th><th></th></tr></thead><tbody>${pubs}</tbody></table></div>
      <div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>${tr('Link')}</th><th>${tr('State')}</th><th>${tr('Reason')}</th><th></th></tr></thead><tbody>${liens}</tbody></table></div></details>`;
  };
  const traiterDepot = async (b) => {
    b.disabled = true;
    try {
      if (b.dataset.depotPub) {
        const p = st.depot.publications.find(x => x.vue === b.dataset.depotPub);
        const r = await fetch(`/api/publications/${encodeURIComponent(p.vue)}`, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ mode: p.mode, definition: p.definition, description: p.description }) });
        const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.erreur || tr('error {status}', { status: r.status }));
        if (b.dataset.faire === 'appliquer') {
          if (!confirm(tr('Apply {view} on the shared server?', { view: p.vue }))) return;
          const a = await poster(`/api/publications/${encodeURIComponent(p.vue)}/appliquer`);
          toast(tr('{view} applied: {n} column(s)', { view: p.vue, n: a.resultat.contrat.length }));
        } else toast(tr('{view}: draft saved', { view: p.vue }));
      } else {
        const l = st.depot.liens[+b.dataset.depotLien];
        const j = await poster('/api/liens', { vue: l.vue, lecteur: l.lecteur, statut: b.dataset.faire, motif: `${l.demande} : ${l.motif}`, nature: l.nature });
        if (SANTE) SANTE.liens = j.liens; rendered.liens = false;
        toast(b.dataset.faire === 'demande' ? tr('Request entered in the registry') : j.lien?.application?.applique ? tr('Link allowed: right granted at once') : tr('Link allowed: right granted at the next run of 90-droits.sql'));
      }
    } catch (e) { toast(e.message); }
    finally { b.disabled = false; }
    await charger();
  };
  const draw = () => {
    if (st.erreur) { root.innerHTML = `<div class="wrap"><p class="note">${esc(st.erreur)}</p></div>`; return; }
    if (!st.liste) { root.innerHTML = `<div class="wrap"><p class="text-muted">${tr('Reading the publication registry…')}</p></div>`; return; }
    const L = st.liste.filter(p => (!st.outil || p.outil === st.outil) && (st.etat === 'toutes' || p.etat === st.etat));
    const nb = e => st.liste.filter(p => (!st.outil || p.outil === st.outil) && p.etat === e).length;
    root.innerHTML = `<div class="wrap">
      <div class="top"><div><p class="text-muted prose">${tr('What each tool gives the others to read: its {pub} views. Since decision M-18, Matrix defines and applies them itself (role {role}); the tools no longer write them in their migrations. A draft changes nothing on the server; applying is checked (column contract, sensitive columns, tables of the tool only) and grants the rights of the readers allowed in “Links between tools”.', { pub: '<span class="mono">pub_</span>', role: '<span class="mono">matrix_gestion</span>' })}</p></div>
        <div class="actions"><button class="btn btn-primary" id="pub-nouvelle">${icon('plus', 14)} ${tr('New publication')}</button></div></div>
      ${st.gestion ? '' : `<p class="note" style="margin-bottom:12px">${tr('Matrix is not connected as administrator ({url}, role {role}): publications are saved as drafts, without being applied.', { url: '<span class="mono">MATRIX_GESTION_DATABASE_URL</span>', role: '<span class="mono">matrix_gestion</span>' })}</p>`}
      ${st.sel ? panneau(`<span class="mono">${esc(st.sel)}</span>`, fiche(), { large: true }) : ''}
      ${st.sel ? '' : blocDepot()}
      ${st.sel ? '' : `<div style="display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px">
        ${seg('poutil', [['', tr('All tools')], ...APP_IDS.map(a => [a, APPS[a].nom])], st.outil)}
        ${seg('petat', [['toutes', tr('All'), st.liste.filter(p => !st.outil || p.outil === st.outil).length], ['appliquee', tr('Applied#publications'), nb('appliquee')], ['brouillon', tr('Drafts'), nb('brouillon')], ['erreur', tr('Errors'), nb('erreur')], ['retiree', tr('Withdrawn#publications'), nb('retiree')]], st.etat)}</div>
      ${L.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>${tr('Published view')}</th><th>${tr('State')}</th><th class="num">${tr('Columns')}</th><th>${tr('Readers')}</th><th>${tr('Changed')}</th></tr></thead><tbody>
        ${L.map(p => `<tr class="click" data-pub="${esc(p.vue)}" ${p.vue === st.sel ? 'aria-current="true"' : ''}><td class="nowrap">${appMark(p.outil, 16)} <span class="mono">${esc(p.vue)}</span>${p.description ? `<div class="sub text-muted">${esc(p.description).slice(0, 120)}</div>` : ''}</td>
          <td>${etatPub(p.etat)}${p.erreur && p.etat === 'erreur' ? `<div class="sub text-muted" title="${esc(p.erreur)}">${esc(p.erreur).slice(0, 80)}…</div>` : ''}</td>
          <td class="num tabnum">${p.colonnes || '—'}</td>
          <td class="sub">${(p.lecteurs || []).map(nomLecteur).join(', ') || '<span class="text-muted">—</span>'}</td>
          <td class="sub text-muted nowrap">${esc(p.modifie_par || '')} · ${quand(p.modifie_le)}</td></tr>`).join('')}</tbody></table></div>`
        : `<p class="text-muted">${st.liste.length ? tr('No publication in this selection.') : tr('Empty registry: the existing views enter it through their takeover (partage/14-reprise-publications.sql), new ones through “New publication”.')}</p>`}
      ${st.nonReprises.length ? `<div class="block-title" style="margin-top:22px">${tr('Views not yet taken over by Matrix')} <span>${st.nonReprises.length}</span></div>
        <p class="sub text-muted">${tr('Created by a migration of the tool, they still belong to it: Matrix takes them over through {script}, once the tool no longer creates a {pub} view in its migrations.', { script: '<span class="mono">partage/14-reprise-publications.sql</span>', pub: '<span class="mono">pub_</span>' })}</p>
        <div class="tags">${st.nonReprises.filter(v => !st.outil || v.outil === st.outil).map(v => `<span class="tag tag-ghost mono">${esc(v.vue)}</span>`).join('')}</div>` : ''}
    </div>`}`;
  };

  root.addEventListener('click', e => {
    const dep = e.target.closest('[data-depot-pub], [data-depot-lien]'); if (dep) return traiterDepot(dep);
    const ligne = e.target.closest('[data-pub]'); if (ligne) return ouvrir(ligne.dataset.pub);
    const a = e.target.closest('[data-pub-action]'); if (a) return action(a.dataset.pubAction, a);
    if (e.target.closest('#pub-nouvelle')) return nouvelle();
    if (e.target.closest('#pub-fermer')) { st.sel = null; st.fiche = null; draw(); return; }

  root.addEventListener('change', e => {
    if (e.target.id === 'pub-source') { lireFiche(); st.brouillon.source = e.target.value; st.brouillon.colonnes = []; draw(); }
  });
  onSeg(root, 'poutil', v => { st.outil = v; draw(); });
  onSeg(root, 'petat', v => { st.etat = v; draw(); });
  onSeg(root, 'pmode', v => { lireFiche(); st.brouillon.mode = v; draw(); });
  draw(); charger();

// ── Journal unifié, REX, correspondances (serveur commun, écart E-11) ───
const SANS_SERVEUR_COMMUN = quoi => `<div class="card" style="max-width:720px"><div class="card-kicker">${tr('Shared server')}</div>
  <p class="prose">${tr('{what} is read on the shared PostgreSQL server. It shows here when Matrix is connected to it ({url}, role {role}).', { what: quoi, url: '<span class="mono">MATRIX_DATABASE_URL</span>', role: '<span class="mono">matrix_app</span>' })}</p></div>`;
async function lireApi(chemin, params = {}) {
  const q = new URLSearchParams(Object.entries(params).filter(([, v]) => v != null && v !== ''));
  const r = await fetch(`${chemin}${q.size ? '?' + q : ''}`);
  const j = await r.json().catch(() => ({ erreur: tr('unreadable reply from the server') }));
  if (!r.ok) throw new Error(j.erreur || tr('error {status}', { status: r.status }));
  return j;
}
const nomOutil = o => APPS[o] ? `${appMark(o, 16)} ${APPS[o].nom}` : esc(o || '—');
const champsFiltre = (prefixe, champs) => champs.map(([k, ph, type, largeur]) => `<input class="input" id="${prefixe}-${k}" placeholder="${esc(ph)}" ${type ? `type="${type}"` : ''} style="width:${largeur || 160}px">`).join('');

  const charger = async (suite = false) => {

      const j = await lireApi('/api/journal', { ...filtres(), ...(suite && st.suite ? { apres_quand: st.suite.quand, apres_ref: st.suite.ref_source } : {}) });
      st.lignes = suite ? st.lignes.concat(j.lignes) : j.lignes; st.suite = j.suite; st.absente = !!j.absente; st.erreur = null;
    } catch (e) { st.erreur = e.message; }
    drawTable();
  };

    <p class="text-muted prose" style="margin-bottom:12px">${tr('The audit logs of the tools, brought together by {view} (D18) in common columns. {action} does not mean the same everywhere: a verb in Codex and Cursus, a domain in Keystone, entity.action in Vigie. Health data are never published.', { view: '<span class="mono">matrix.journal_unifie</span>', action: '<span class="mono">action</span>' })}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">

      <button class="btn btn-secondary btn-sm" id="jr-chercher">${icon('search', 13)} ${tr('Search')}</button></div>
    <div id="jr-table"></div></div>`;

    el.innerHTML = st.lignes.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>${tr('When')}</th><th>${tr('Tool')}</th><th>${tr('Who')}</th><th>${tr('Action')}</th><th>${tr('Object')}</th><th>${tr('Project')}</th><th>${tr('Detail')}</th></tr></thead><tbody>
      ${st.lignes.map(l => `<tr><td class="tabnum text-muted nowrap">${quand(l.quand)}</td><td class="nowrap">${nomOutil(l.outil)}</td>
        <td>${esc(l.qui || '—')}${l.qui_role ? `<div class="sub text-muted">${esc(l.qui_role)}${l.qui_matricule ? ' · ' + esc(l.qui_matricule) : ''}</div>` : ''}</td>
        <td class="mono sub">${esc(l.action || '')}</td><td class="mono sub">${esc(l.objet || '')}</td><td class="mono sub">${esc(l.projet || '')}</td>
        <td class="sub">${esc(String(l.detail ?? '').slice(0, 300))}</td></tr>`).join('')}</tbody></table></div>
      <p class="sub text-muted" style="margin-top:8px">${tr('{n} entry(ies) shown, from the most recent to the oldest.', { n: st.lignes.length })}</p>

    if (e.target.closest('#jr-suite')) charger(true);
  });
  root.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('input')) charger(); });
  onSeg(root, 'joutil', v => { st.outil = v; charger(); });
  charger();
};

RENDER.rex = () => {
  const root = $('s-rex');
  if (!SERVEUR || !SERVEUR_COMMUN) { root.innerHTML = `<div class="wrap">${SANS_SERVEUR_COMMUN(tr('The unified lessons learned (D22)'))}</div>`; return; }
  const st = { outil: '', categorie: '', lignes: [], categories: [], absente: false, erreur: null };
  const charger = async () => {
    try {
      const j = await lireApi('/api/rex', { outil: st.outil, categorie: st.categorie, code: $('rx-code')?.value, recherche: $('rx-recherche')?.value });
      Object.assign(st, { lignes: j.lignes, categories: j.categories || st.categories, absente: !!j.absente, erreur: null });
    } catch (e) { st.erreur = e.message; }
    draw();
  };
  root.innerHTML = `<div class="wrap">
    <p class="text-muted prose" style="margin-bottom:12px">${tr('Lessons learned from the projects (Keystone) and the CAPEX (Arche), brought together in the common lessons-learned contract by {view} (D22). Each tool keeps its registry: a lesson is corrected in the tool that holds it.', { view: '<span class="mono">matrix.rex_unifie</span>' })}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
      ${seg('routil', [['', tr('All tools')], ['keystone', tr('Keystone · projects')], ['arche', 'Arche · CAPEX']], '')}
      <select class="input" id="rx-categorie" style="width:180px"><option value="">${tr('All categories')}</option></select>
      ${champsFiltre('rx', [['recherche', tr('Title, finding, recommendation'), '', 240], ['code', tr('Project or CAPEX'), '', 150]])}
      <button class="btn btn-secondary btn-sm" id="rx-chercher">${icon('search', 13)} ${tr('Search')}</button></div>
    <div id="rx-liste"></div></div>`;
  const draw = () => {
    const sel = $('rx-categorie');
    sel.innerHTML = `<option value="">${tr('All categories')}</option>${st.categories.map(c => `<option ${c === st.categorie ? 'selected' : ''}>${esc(c)}</option>`).join('')}`;
    const el = $('rx-liste');
    if (st.erreur) { el.innerHTML = `<p class="form-error">${esc(st.erreur)}</p>`; return; }
    if (st.absente) { el.innerHTML = `<p class="text-muted">${tr('The view {view} does not exist yet: run {script} after the publication of {a} or {b} and {rights}.', { view: '<span class="mono">matrix.rex_unifie</span>', script: '<span class="mono">partage/96-matrix-rex-unifie.sql</span>', a: '<span class="mono">keystone.pub_rex</span>', b: '<span class="mono">arche.pub_rex_v2</span>', rights: '<span class="mono">90-droits.sql</span>' })}</p>`; return; }
    el.innerHTML = st.lignes.length ? `<p class="sub text-muted" style="margin-bottom:8px">${tr('{n} lesson(s)', { n: st.lignes.length })}</p>` + st.lignes.map(r => `<details class="card" style="margin-bottom:8px">
      <summary style="cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${nomOutil(r.outil)} <span class="mono sub">${esc(r.numero || '')}</span> <strong>${esc(r.titre || '')}</strong>
        <span class="tag tag-neutral">${esc(r.categorie || '—')}</span><span class="sub text-muted" style="margin-left:auto">${esc([r.projet_code, r.capex_code].filter(Boolean).join(' · '))} · ${esc(r.auteur || '—')} · ${quand(r.cree_le)}</span></summary>
      <div class="prose" style="margin-top:10px">${[[tr('Finding'), r.constat], [tr('Impact'), r.impact], [tr('Recommendation'), r.recommandation], [tr('Scope'), r.portee]].filter(([, v]) => v).map(([k, v]) => `<p><span class="card-kicker">${k}</span><br>${esc(v)}</p>`).join('')}
        <p class="sub text-muted">${tr('Status {status} · updated {date}', { status: esc(r.statut || '—'), date: quand(r.maj_le) })} · <span class="mono">${esc(r.ref_source)}</span></p></div></details>`).join('')
      : `<p class="text-muted">${tr('No lesson for these filters.')}</p>`;
  };
  root.addEventListener('click', e => { if (e.target.closest('#rx-chercher')) charger(); });
  root.addEventListener('change', e => { if (e.target.id === 'rx-categorie') { st.categorie = e.target.value; charger(); } });
  root.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('input')) charger(); });
  onSeg(root, 'routil', v => { st.outil = v; charger(); });
  charger();
};

RENDER.correspondances = () => {
  const root = $('s-correspondances');
  if (!SERVEUR || !SERVEUR_COMMUN) { root.innerHTML = `<div class="wrap">${SANS_SERVEUR_COMMUN(tr('The mapping table'))}</div>`; return; }
  const OBJ = { personne: tr('People (D01)'), projet: tr('Projects (D02)'), site: tr('Sites (D14)'), unite: tr('Units (D15)'), pays: tr('Countries (D17)'), titre: tr('Qualifications (D08)'), document: tr('Documents (D10)') };
  const STA = { propose: tr('Proposed#mapping'), valide: tr('Validated'), a_creer: tr('To create'), abandonne: tr('Abandoned'), rejete: tr('Rejected'), retire: tr('Withdrawn#mapping') };
  const DEC = { propose: ['valide', 'rejete', 'a_creer', 'abandonne'], a_creer: ['valide', 'abandonne'], valide: ['retire'] };
  const BTN = { valide: tr('Validate'), rejete: tr('Reject'), a_creer: tr('To create'), abandonne: tr('Abandon'), retire: tr('Withdraw') };
  const FAIT = { valide: tr('Mapping validated'), rejete: tr('Mapping rejected'), a_creer: tr('Mapping to create'), abandonne: tr('Mapping abandoned'), retire: tr('Mapping withdrawn') };
  const st = { objet: '', statut: 'propose', lignes: [], compte: [], erreur: null };
  const charger = async () => {
    try { const j = await lireApi('/api/correspondances', { objet: st.objet, statut: st.statut }); Object.assign(st, { lignes: j.lignes, compte: j.compte, erreur: null }); }
    catch (e) { st.erreur = e.message; }
    draw();
  };
  const nb = (objet, statut) => st.compte.filter(c => (!objet || c.objet === objet) && (!statut || c.statut === statut)).reduce((n, c) => n + c.n, 0);
  const decider = async (id, statut) => {
    const c = st.lignes.find(x => String(x.id) === id); let pivot, note;
    if (statut === 'valide') { pivot = prompt(tr('Common key for {tool} · {table} · {id}', { tool: c.outil, table: c.table_locale, id: c.id_local }), c.pivot || ''); if (pivot == null) return; }
    if (['rejete', 'retire', 'abandonne'].includes(statut)) { note = prompt(tr('Reason ({action})', { action: BTN[statut].toLowerCase() })); if (!note) return; }
    try { await poster('/api/correspondances', { id: c.id, statut, pivot, note }); toast(FAIT[statut]); charger(); }
    catch (e) { toast(e.message); }
  };
  const draw = () => {
    root.innerHTML = `<div class="wrap">
      <p class="text-muted prose" style="margin-bottom:12px">${tr('During the transition, each local identifier of a tool (Keystone uuid, Codex or Vigie slug, Cursus integer…) is linked to the common key: employee number, project code, site, unit or country code. Matrix proposes; HR validate the people, IT the rest. Each tool reads the decided rows in {view} and sets its local key itself.', { view: '<span class="mono">matrix.pub_correspondances</span>' })}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
        ${seg('cobjet', [['', tr('All objects'), nb('', st.statut)], ...Object.entries(OBJ).map(([k, l]) => [k, l, nb(k, st.statut)])], st.objet)}
        ${seg('cstatut', [...Object.entries(STA).map(([k, l]) => [k, l, nb(st.objet, k)]), ['', tr('All statuses'), nb(st.objet, '')]], st.statut)}</div>
      ${st.erreur ? `<p class="form-error">${esc(st.erreur)}</p>` : st.lignes.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>${tr('Object')}</th><th>${tr('Tool')}</th><th>${tr('Local identifier')}</th><th>${tr('Label')}</th><th>${tr('Common key')}</th><th>${tr('Method')}</th><th>${tr('Status')}</th><th>${tr('Decision')}</th><th></th></tr></thead><tbody>
        ${st.lignes.map(c => `<tr><td>${esc(c.objet)}</td><td class="nowrap">${nomOutil(c.outil)}</td>
          <td class="mono sub">${esc(c.table_locale)} · ${esc(c.id_local)}${c.cle_naturelle ? `<div class="text-muted">${esc(c.cle_naturelle)}</div>` : ''}</td>
          <td>${esc(c.libelle_local || '')}</td><td class="mono">${esc(c.pivot || '—')}${c.pivot_provisoire ? ` <span class="tag tag-outline">${tr('provisional')}</span>` : ''}</td>
          <td class="sub">${esc(c.methode)}</td><td><span class="tag ${c.statut === 'valide' ? 'tag-neutral' : c.statut === 'propose' ? 'tag-accent' : 'tag-outline'}">${STA[c.statut] || esc(c.statut)}</span></td>
          <td class="sub text-muted">${c.decide_par ? `${esc(c.decide_par)} · ${quand(c.decide_le)}` : `${tr('proposed by {who}', { who: esc(c.propose_par) })} · ${quand(c.propose_le)}`}${c.note ? `<div>${esc(c.note)}</div>` : ''}</td>
          <td class="nowrap">${(DEC[c.statut] || []).map((d, i) => `<button class="btn ${i ? 'btn-ghost' : 'btn-secondary'} btn-sm" data-cdecide="${d}" data-id="${c.id}">${BTN[d]}</button>`).join(' ')}</td></tr>`).join('')}</tbody></table></div>
        <p class="sub text-muted" style="margin-top:8px">${tr('{n} mapping(s) · the first 1,000 at most.', { n: st.lignes.length })}</p>` : `<p class="text-muted">${tr('No mapping for these filters.')}</p>`}</div>`;
  };
  root.addEventListener('click', e => { const b = e.target.closest('[data-cdecide]'); if (b) decider(b.dataset.id, b.dataset.cdecide); });
  onSeg(root, 'cobjet', v => { st.objet = v; charger(); });
  onSeg(root, 'cstatut', v => { st.statut = v; charger(); });
  charger();
};

// ── Administration ──────────────────────────────────────────────────────
RENDER.administration = () => {
  const root = $('s-administration'); let tab = 'connexions';
  const ROLES = [tr('Data administrator'), tr('Domain owner'), tr('Reader')];
  const PERMS = [[tr('View the catalogue and the graph'), [1, 1, 1]], [tr('See an extract of the data'), [1, 1, 0]], [tr('See sensitive data'), [1, 0, 0]], [tr('Document a table or a column'), [1, 1, 0]], [tr('Start a reading'), [1, 0, 0]], [tr('Run a change query'), [1, 0, 0]], [tr('Manage the connections and the rights'), [1, 0, 0]]];
  const JOURNAL = (EDITION.journal || []).slice().reverse();
  const draw = () => {
    let body = '';
    if (tab === 'connexions') body = `<div class="table-wrap"><table class="table"><thead><tr><th>${tr('Database')}</th><th>${tr('Today')}</th><th>${tr('Target validated on 15/10/2026')}</th><th>${tr('Role of the tool')}</th><th>${tr('Access of Matrix')}</th></tr></thead><tbody>
      ${APP_IDS.map(a => `<tr><td class="nowrap">${appMark(a)} ${APPS[a].nom}</td><td>${esc(APPS[a].moteur)}<div class="sub text-muted mono">${esc(APPS[a].donnees)}</div></td><td>${tr('Schema {schema} of the database {db}', { schema: `<span class="mono">${a}</span>`, db: '<span class="mono">epc2i</span>' })}${a === 'cursus' ? `<div class="sub text-muted">${tr('migration from SQLite, 37 foreign keys to declare')}</div>` : ''}</td><td class="mono">${a}_app</td><td><span class="mono">matrix_lecture</span><div class="sub text-muted">${a === 'cursus' || a === 'vigie' ? tr('read only, sensitive columns excluded') : tr('read only')}</div></td></tr>`).join('')}
      <tr><td class="nowrap">${icon('matrix', 16)} Matrix</td><td class="text-muted">—</td><td>${tr('Schema {schema}', { schema: '<span class="mono">matrix</span>' })}</td><td class="mono">matrix_app</td><td class="text-muted">${tr('catalogue, mappings, history')}</td></tr></tbody></table></div>
      <p class="note" style="margin-top:14px">${tr('Shared PostgreSQL server with one schema per tool: validated on 15 October 2026. Each tool remains the sole owner of its schema and does not see the others’. Matrix reads everything read only, without the sensitive columns. In development and in the Mac application, each tool keeps its embedded database.')}</p>`;
    else if (tab === 'collecte') {
      const TYPES = TYPES_HIST;
      body = `<div class="table-wrap"><table class="table"><thead><tr><th>${tr('Database')}</th><th>${tr('Source of the schema')}</th><th class="num">${tr('Tables')}</th><th class="num">${tr('To document')}</th></tr></thead><tbody>
        ${CAT.apps.map(a => `<tr><td class="nowrap">${appMark(a.id)} ${APPS[a.id].nom}</td><td>${esc(a.source.replace(/\d{4}-\d{2}-\d{2}T[\d:.]+Z/, d => new Date(d).toLocaleString(LOCALE, { dateStyle: 'short', timeStyle: 'short' })))}</td><td class="num">${a.tables.length}</td><td class="num">${a.tables.filter(t => t.nouvelle).length}</td></tr>${(a.avertissements || []).length ? `<tr><td></td><td colspan="3" class="sub text-muted">${tr('{n} migration statement(s) not recognised:', { n: a.avertissements.length })} ${esc(a.avertissements.slice(0, 3).join(' · '))}${a.avertissements.length > 3 ? '…' : ''}</td></tr>` : ''}`).join('')}</tbody></table></div>
        <div class="block-title" style="margin-top:22px">${tr('Declaration of new tables')}</div>
        <ol class="prose" style="margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
          <li>${tr('Matrix itself reads the shared PostgreSQL server (probe, role {role}, variable {url}): tables, columns, keys, links, comments, {pub} views and rights of each tool, at start-up then every hour, or on demand (screen “Data health”). A tool can also send its schema ({api}, shared token). Order of priority: shared server, then the tool’s declaration, then the repositories’ migrations (read without running anything), then the embedded catalogue.', { role: '<span class="mono">matrix_app</span>', url: '<span class="mono">MATRIX_DATABASE_URL</span>', pub: '<span class="mono">pub_</span>', api: '<span class="mono">POST /api/declarations</span>' })}</li>
          <li>${tr('Matrix compares the declaration with the previous reading. An unknown table is added to the library, marked “to document”.')}</li>
          <li>${tr('The new table is compared with those of the other tools. If it looks like an existing table, it is flagged as a possible duplicate.')}</li>
          <li>${tr('For a tool absent from the shared server, Matrix reads its schema in the source code (migrations).')}</li>
        </ol>
        <div class="block-title" style="margin-top:22px">${tr('Declarations received')} <span>${(DATA.declarations || []).length}</span></div>
        ${(DATA.declarations || []).length ? `<div class="table-wrap"><table class="table"><thead><tr><th>${tr('Tool')}</th><th>${tr('Origin')}</th><th>${tr('Received on')}</th><th>${tr('Version')}</th><th class="num">${tr('Tables')}</th></tr></thead><tbody>${DATA.declarations.map(d => `<tr><td class="nowrap">${appMark(d.app)} ${APPS[d.app].nom}</td><td>${d.origine === 'serveur' ? tr('Shared server (authoritative)') : tr('Declaration of the tool')}</td><td class="tabnum">${new Date(d.declareLe).toLocaleString(LOCALE, { dateStyle: 'short', timeStyle: 'short' })}</td><td class="mono text-muted">${esc(d.version || '—')}</td><td class="num">${d.tables}</td></tr>`).join('')}</tbody></table></div>`
          : `<p class="text-muted">${tr('No tool has declared its schema yet. Declarations arrive when the declaration module is installed in the tool and MATRIX_URL and MATRIX_TOKEN are set there.')}</p>`}
        <div class="block-title" style="margin-top:22px">${tr('Schema history')} <span>${HIST.length}</span></div>
        ${HIST.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>${tr('When')}</th><th>${tr('Database')}</th><th>${tr('Change')}</th><th>${tr('Object')}</th><th>${tr('Detail')}</th></tr></thead><tbody>${HIST.slice().reverse().slice(0, 1000).map(e => `<tr><td class="tabnum text-muted nowrap">${new Date(e.date).toLocaleString(LOCALE, { dateStyle: 'short', timeStyle: 'short' })}</td><td>${APPS[e.app].nom}</td><td>${TYPES[e.type] || esc(e.type)}${e.doublonsPossibles ? ` <span class="tag tag-outline">${tr('possible duplicate: {tables}', { tables: esc(e.doublonsPossibles.join(', ')) })}</span>` : ''}</td><td class="mono">${esc(e.table || '—')}${e.colonne ? '.' + esc(e.colonne) : ''}</td><td class="sub">${detailHist(e)}</td></tr>`).join('')}</tbody></table></div>`
          : `<p class="text-muted">${tr('No change since the first reading of {date}.', { date: new Date(CAT.generatedAt).toLocaleDateString(LOCALE) })}</p>`}
        <div class="block-title" style="margin-top:22px">${tr('Commands')}</div><div class="code">npm start                                # ${tr('Matrix server (page + reception of the declarations)')}
node outils/collecteur.mjs ..            # ${tr('reread the schemas in the repositories and compare')}
node outils/construire-maquette.mjs      # ${tr('rebuild the published mockup')}</div>`;
    }
    else if (tab === 'droits') body = `<div class="table-wrap"><table class="table"><thead><tr><th>${tr('Right')}</th>${ROLES.map(r => `<th style="text-align:center">${r}</th>`).join('')}</tr></thead><tbody>${PERMS.map(([p, g]) => `<tr><td>${p}</td>${g.map(v => `<td style="text-align:center"><span class="perm ${v ? 'on' : 'off'}">${icon(v ? 'tick' : 'dash', 15, 1.8)}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="sub text-muted" style="margin-top:10px">${tr('Proposed matrix, to be validated. Until the authentication shared by the tools (question O-02 of Codex), Matrix is protected by a password (variable MATRIX_MOT_DE_PASSE): anyone who knows it has administrator rights, and their changes are traced under the identifier typed.')}</p>`;
    else body = JOURNAL.length ? `<p class="sub text-muted" style="margin-bottom:8px">${tr('Changes made in Matrix: documentation, decisions, reference data. The last {n}.', { n: JOURNAL.length })}</p><div class="table-wrap"><table class="table"><thead><tr><th>${tr('When')}</th><th>${tr('Who')}</th><th>${tr('Action')}</th><th>${tr('Object')}</th><th>${tr('Detail')}</th></tr></thead><tbody>${JOURNAL.map(r => `<tr><td class="tabnum text-muted nowrap">${new Date(r.quand).toLocaleString(LOCALE, { dateStyle: 'short', timeStyle: 'short' })}</td><td>${esc(r.qui)}</td><td>${esc(r.action)}</td><td class="mono">${esc(r.objet)}</td><td class="text-muted">${esc(r.detail)}</td></tr>`).join('')}</tbody></table></div>`
      : `<p class="text-muted">${SERVEUR ? tr('No change so far. Each table documentation, decision or reference data change made in Matrix will appear here, with its author.') : tr('The log is kept by the Matrix server.')}</p>`;
    root.querySelector('#ad-body').innerHTML = body;
  };
  root.innerHTML = `<div class="wrap"><div style="margin-bottom:16px">${seg('ad', [['connexions', tr('Connections')], ['collecte', tr('Reading')], ['droits', tr('Roles & rights')], ['journal', tr('Log')]], tab)}</div><div id="ad-body"></div></div>`;
  onSeg(root, 'ad', v => { tab = v; draw(); });
  draw();
};

show(location.hash.slice(1) || 'accueil');
})();
</script>
