<title>Matrix</title>
<meta name="description" content="Matrix : bibliothèque et graphe des bases de données de Keystone, Codex, Cursus, Vigie, Arche et Crucible">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : coque Codex (barre latérale 224 px + en-tête), écrans en trois volets.
   Design system Nocturne (sombre uniquement, comme Keystone, Codex et Vigie). */
:root {
  color-scheme: dark;
  --color-bg: #161826;
  --color-surface: #232532;
  --color-text: #e9e9ed;
  --color-accent: #9184d9;
  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);
  --color-neutral-100: #f3f5fe; --color-neutral-300: #cfd3e5; --color-neutral-500: #9397ab;
  --color-neutral-600: #75798c; --color-neutral-700: #595d6c; --color-neutral-800: #3f424d; --color-neutral-900: #292b31;
  --color-accent-100: #f5f4ff; --color-accent-300: #d2cefd; --color-accent-400: #b5abfc;
  --color-accent-700: #5d5294; --color-accent-800: #423a6a; --color-accent-900: #2b2741;
  /* Couleurs des applications : peu saturées, pour le graphe et les pastilles. */
  --app-keystone: #7fa6d6; --app-codex: #a99de6; --app-cursus: #d6a77f; --app-vigie: #79c2a2; --app-arche: #d68fa8; --app-crucible: #c8bd6a; --app-externe: #75798c;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 14px;
  --shadow-sm: 0 0 0 1px #3f424d;
  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);
  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);
  --muted: color-mix(in srgb, var(--color-text) 55%, transparent);
  --rule: color-mix(in srgb, var(--color-text) 8%, transparent);
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 13px; line-height: 1.45; overflow: hidden; }
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, h4, h5, h6 { font-weight: 500; line-height: 1.12; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
h6 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0; }
a { color: var(--color-accent); text-underline-offset: 3px; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--color-neutral-800); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }
.text-muted { color: var(--muted); }
.tabnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 0.94em; letter-spacing: -0.01em; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font-size: 11px; }
.nowrap { white-space: nowrap; }

/* Boutons, champs, segments, étiquettes (Nocturne) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-decoration: none; font: inherit; font-weight: 500; font-size: 13px; line-height: 1.2; color: var(--color-text); background: transparent; border: 1px solid transparent; padding: 6px 10px; border-radius: var(--radius-md); white-space: nowrap; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }
.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: 4px; }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-icon { width: 32px; height: 32px; padding: 0; }
.btn-sm { font-size: 12px; padding: 4px 8px; }
.input { width: 100%; min-height: 34px; padding: 6px 10px; font: inherit; font-size: 13px; color: var(--color-text); caret-color: var(--color-accent); background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: var(--radius-md); }
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
select.input { appearance: none; width: auto; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
select.input option { background: var(--color-surface); color: var(--color-text); }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: .6; pointer-events: none; }
.search .input { padding-left: 32px; }
.seg { display: inline-flex; overflow-x: auto; scrollbar-width: none; border: 1px solid var(--color-divider); border-radius: var(--radius-md); flex: none; max-width: 100%; }
.list-head > div, .toolbar > div { min-width: 0; max-width: 100%; }
.seg button { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; font: inherit; font-size: 12px; color: inherit; background: transparent; border: 0; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--color-divider); }
.seg button[aria-pressed="true"] { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }
.seg button:not([aria-pressed="true"]):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg button:focus-visible { outline-offset: -2px; }
.seg .n { color: var(--muted); font-size: 11px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; letter-spacing: .02em; padding: 2px 8px; border-radius: 6px; white-space: nowrap; line-height: 1.5; }
.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }
.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }
.tag-outline { box-shadow: inset 0 0 0 1px var(--color-accent); color: var(--color-accent-300); }
.tag-ghost { box-shadow: inset 0 0 0 1px var(--color-divider); color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.card { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--color-surface); }
.card-kicker { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-accent); }
.card-meta { font-size: 11px; color: var(--muted); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.sec-title { opacity: .7; }
.sec-link { font-size: 12px; text-decoration: none; white-space: nowrap; background: none; border: 0; color: var(--color-accent); cursor: pointer; font: inherit; font-size: 12px; padding: 0; }
.hairline { border-bottom: 1px solid var(--rule); }

/* Tableaux : filets qui s'estompent aux deux bouts */
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 60%, transparent); padding: 6px 8px; white-space: nowrap; }
.table td { padding: 7px 8px; vertical-align: top; }
.table thead tr { background: linear-gradient(to right, transparent, var(--color-divider) 48px, var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px; }
.table tbody tr { background: linear-gradient(to right, transparent, var(--rule) 48px, var(--rule) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px; }
.table tbody tr.click { cursor: pointer; }
.table tbody tr.click:hover { background: linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent), color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%, linear-gradient(to right, transparent, var(--rule) 48px, var(--rule) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px; }
.table tbody tr[aria-selected="true"] { box-shadow: inset 2px 0 0 var(--color-accent); }
.table tbody tr[aria-selected="true"] .t-name { color: var(--color-accent-300); }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; min-width: 0; }

/* Coque */
.app { display: grid; grid-template-columns: 224px minmax(0, 1fr); height: 100%; }
.side { display: flex; flex-direction: column; padding: 14px 10px; border-right: 1px solid var(--color-divider); min-height: 0; overflow: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px; }
.logo { width: 28px; height: 28px; flex: none; border-radius: var(--radius-md); border: 1px solid var(--color-accent); display: grid; place-items: center; color: var(--color-accent); box-shadow: 0 0 18px color-mix(in srgb, var(--color-accent) 35%, transparent); }
.brand-name { font-size: 16px; font-weight: 500; line-height: 1.1; }
.nav-items { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius-md); font-size: 13px; color: inherit; text-decoration: none; border-left: 2px solid transparent; }
.nav-item:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); }
.nav-item[aria-current="page"] { color: var(--color-accent); border-left-color: var(--color-accent); }
.nav-item .tag { margin-left: auto; padding: 0 6px; font-size: 10px; }
.side-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding-top: 18px; }
.overline { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 0 8px 2px; }
.linked { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 8px; color: inherit; }
.mark { width: 18px; height: 18px; flex: none; border-radius: 4px; border: 1px solid currentColor; display: inline-grid; vertical-align: middle; place-items: center; font-size: 9px; font-weight: 600; }
.user { display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; border-top: 1px solid var(--color-divider); margin-top: 6px; }
.avatar { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--color-accent-800); color: var(--color-accent-100); display: grid; place-items: center; font-size: 11px; font-weight: 500; }
.app-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.header { display: flex; align-items: center; gap: 14px; padding: 9px 18px; border-bottom: 1px solid var(--color-divider); }
.header h5 { font-size: 15px; min-width: 190px; }
.header .search { flex: 1; max-width: 520px; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.app-main { flex: 1; min-height: 0; position: relative; }
.screen { position: absolute; inset: 0; overflow: auto; }
.pad { padding: 22px 24px 32px; }
.wrap { max-width: 1180px; }

/* Accueil */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.hello { font-size: 26px; margin-bottom: 4px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 26px; }
.kpi { text-align: left; border: 0; cursor: pointer; color: inherit; font: inherit; gap: 2px; }
.kpi:hover { box-shadow: var(--shadow-sm); }
.kpi-value { font-size: 30px; line-height: 1.1; font-weight: 500; margin: 4px 0; font-variant-numeric: tabular-nums; }
.cols { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 28px; }
.col { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.app-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; cursor: pointer; }
.app-row:hover .app-name { color: var(--color-accent-300); }
.app-badge { width: 34px; height: 34px; border-radius: var(--radius-md); display: grid; place-items: center; font-weight: 600; font-size: 12px; border: 1px solid currentColor; }
.app-stats { display: flex; gap: 16px; font-variant-numeric: tabular-nums; text-align: right; }
.app-stats b { display: block; font-weight: 500; font-size: 14px; }
.alert-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; }
.bar { height: 6px; border-radius: 3px; background: var(--color-neutral-800); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }

/* Volets */
.panes { position: absolute; inset: 0; display: flex; min-height: 0; }
.tree { width: 244px; flex: none; border-right: 1px solid var(--color-divider); display: flex; flex-direction: column; min-height: 0; }
.tree-head { padding: 14px 16px 8px; }
.tree-body { flex: 1; overflow: auto; padding: 0 8px 14px; display: flex; flex-direction: column; gap: 1px; }
.node { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: 0; font: inherit; font-size: 13px; padding: 6px 8px 6px 8px; border-radius: var(--radius-md); cursor: pointer; background: transparent; color: inherit; }
.node:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); }
.node[aria-current="true"] { background: color-mix(in srgb, var(--color-accent) 10%, transparent); color: var(--color-accent); }
.node .count { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.node.child { font-size: 12px; padding: 5px 8px 5px 30px; }
.node .chev { width: 12px; flex: none; opacity: .7; }
.list { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.list-head { display: flex; align-items: center; gap: 10px; padding: 12px 20px 8px; flex-wrap: wrap; }
.crumb { margin-right: auto; min-width: 0; }
.crumb .sub { color: var(--muted); }
.crumb-title { font-size: 16px; font-weight: 500; }
.list-body { flex: 1; overflow: auto; padding: 0 12px 12px; }
.list-foot { padding: 8px 20px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--color-divider); }
.quick { width: 380px; flex: none; border-left: 1px solid var(--color-divider); overflow: auto; padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 14px; background: var(--color-bg); }
.quick-head { display: flex; align-items: flex-start; gap: 10px; }
.quick-title { font-size: 16px; font-weight: 500; word-break: break-word; flex: 1; min-width: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 12px; margin: 0; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.mini-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mini-kpis div { padding: 8px 10px; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
.mini-kpis b { display: block; font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.mini-kpis span { font-size: 11px; color: var(--muted); }
.cols-list { display: flex; flex-direction: column; }
.col-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: 12px; }
.col-row .mono { overflow-wrap: anywhere; }
.col-type { color: var(--muted); font-size: 11px; text-align: right; }
.col-flags { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.col-flags .tag { font-size: 10px; padding: 0 6px; }
.link-row { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; font-size: 12px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.link-btn { background: none; border: 0; padding: 0; font: inherit; color: var(--color-accent-300); cursor: pointer; text-align: left; }
.link-btn:hover { text-decoration: underline; }
.block-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
.empty { color: var(--muted); padding: 16px 8px; }
.empty-pane { margin: auto 0; text-align: center; color: var(--muted); padding: 30px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.map-table td { font-size: 12px; overflow-wrap: anywhere; }
.map-table { table-layout: fixed; }
.map-table td.arrow { width: 22px; }
.map-table th:nth-child(2) { width: 22px; }
.arrow { color: var(--muted); padding-inline: 2px; }

/* Graphe */
.graph-area { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--color-divider); }
.toolbar .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; font: inherit; font-size: 12px; color: inherit; background: transparent; border: 1px solid var(--color-divider); cursor: pointer; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.canvas-wrap { flex: 1; position: relative; min-height: 0; background: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--color-surface) 70%, transparent), var(--color-bg) 70%); }
#cy { position: absolute; inset: 0; }
.legend { position: absolute; left: 14px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border-radius: var(--radius-md); background: color-mix(in srgb, var(--color-bg) 85%, transparent); box-shadow: var(--shadow-sm); font-size: 11px; pointer-events: none; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 2px solid; }
.graph-hint { position: absolute; right: 14px; bottom: 12px; font-size: 11px; color: var(--muted); }
.graph-loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }

/* Référentiels, flux */
.matrix-grid { display: grid; grid-template-columns: 90px repeat(4, minmax(0, 1fr)); gap: 4px; font-size: 12px; margin: 4px 0 16px; max-width: 560px; }
.matrix-grid div { padding: 6px 8px; border-radius: 6px; }
.matrix-grid .h { color: var(--muted); font-size: 11px; }
.matrix-grid .c { background: var(--color-surface); text-align: center; font-variant-numeric: tabular-nums; }
.matrix-grid .c.z { background: transparent; box-shadow: inset 0 0 0 1px var(--rule); color: var(--muted); }
.matrix-grid .c.x { background: transparent; color: var(--color-neutral-700); }
.note { font-size: 12px; padding: 10px 12px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--color-divider); }
.prose { font-size: 13px; max-width: 64ch; }
.perm { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; }
.perm.on { color: var(--color-accent); }
.perm.off { color: var(--color-neutral-700); }
.option { display: flex; flex-direction: column; gap: 4px; text-align: left; font: inherit; color: inherit; background: transparent; border: 1px solid var(--color-divider); border-radius: var(--radius-md); padding: 9px 11px; cursor: pointer; }
.option:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.option[aria-pressed="true"] { border-color: var(--color-accent); box-shadow: 0 0 12px color-mix(in srgb, var(--color-accent) 25%, transparent); }
.option-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.option-id { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 1.5px solid var(--color-neutral-600); display: grid; place-items: center; font-size: 10.5px; font-weight: 600; }
.option[aria-pressed="true"] .option-id { border-color: var(--color-accent); background: var(--color-accent); color: var(--color-bg); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: 12px; color: color-mix(in srgb, var(--color-text) 70%, transparent); }
textarea.input { resize: vertical; min-height: 70px; font-family: inherit; }
.form-error { color: var(--color-accent-300); font-size: 12px; margin: 0; }
.table td .input { min-height: 30px; padding: 4px 8px; font-size: 12.5px; min-width: 90px; }
.table td select.input { width: 100%; }
.code { font-family: var(--font-mono); font-size: 12px; padding: 10px 12px; border-radius: var(--radius-md); background: var(--color-surface); overflow-x: auto; white-space: pre; }
.toasts { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: max(20px, env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--color-surface); box-shadow: var(--shadow-md); border-radius: var(--radius-md); padding: 10px 14px; font-size: 13px; }

@media (max-width: 1180px) {
  .quick { width: 330px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  body { overflow: auto; }
  .app { display: flex; flex-direction: column; height: auto; min-height: 100%; }
  .side { flex-direction: row; align-items: center; gap: 4px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 1px solid var(--color-divider); overflow-x: auto; }
  .brand { padding: 0 10px 0 0; }
  .brand .sub { display: none; }
  .nav-items { flex-direction: row; }
  .nav-item { border-left: 0; padding: 6px 8px; }
  .nav-item span.label { white-space: nowrap; }

s","keystone_projects","sites"],"ecrit":["events","event_analyses","actions","attachments"]},{"ecran":"Signaler","route":"/signaler","lit":["events"],"ecrit":["events","attachments"]},{"ecran":"Plan d'actions","route":"/actions","lit":["actions"],"ecrit":["actions","risk_actions","requirements","audit_findings","audit_plan_items","document_versions","qualification_requirements"]},{"ecran":"Risques (DUERP)","route":"/risques","lit":["duerp_versions","work_units","risks","risk_actions","actions","sites"],"ecrit":["risks","work_units","risk_actions","duerp_versions"]},{"ecran":"Habilitations","route":"/habilitations","lit":["people","training_titles","qualification_requirements","qualifications","keystone_assignments","actions"],"ecrit":["qualifications","qualification_requirements","people","training_titles","actions"]},{"ecran":"Veille & contrôles","route":"/veille","lit":["requirements","controls","control_records","attachments","actions"],"ecrit":["requirements","controls","control_records","attachments"]},{"ecran":"Audits & revue","route":"/audits","lit":["certifications","audit_plan_items","audit_findings","review_items","requirements","actions","events"],"ecrit":["certifications","audit_plan_items","audit_findings","review_items"]},{"ecran":"Prévention","route":"/prevention","lit":["prevention_plans","permits","contractors","sites","keystone_projects"],"ecrit":["contractors","prevention_plans","permits","sites"]},{"ecran":"Import de plans","route":"/prevention/import","lit":["contractors","people","pp_import_templates"],"ecrit":["pp_import_templates","contractors","prevention_plans","attachments"]},{"ecran":"Carte du site","route":"/prevention/carte","lit":["site_maps","map_zones","map_routes","site_activities","prevention_plans","permits"],"ecrit":["site_maps","map_zones","map_routes","site_activities","attachments","prevention_plans"]},{"ecran":"Documents maîtrisés","route":"/documents","lit":["documents","document_versions","actions"],"ecrit":["documents","document_versions","attachments"]},{"ecran":"Environnement","route":"/environnement","lit":["waste_streams","waste_entries","consumptions","requirements"],"ecrit":["waste_entries","waste_streams","consumptions"]}]},"doublons":{"_lisezmoi":"Tables en doublon entre Keystone, Codex, Cursus et Vigie, relevées le 15 octobre 2026 ; Arche ajouté le 22 octobre 2026 d'après sa spécification (groupes D21, D22 et compléments de D01, D02, D14, D16 à D18, D20) ; Crucible le même jour, d'après sa livraison 1 et sa spécification (groupe D23 et compléments de D01, D02, D07 à D09, D14, D18 à D21). Méthode : comparaison automatique des noms et des colonnes de chaque paire de tables entre deux bases (outils/collecteur.mjs), puis relecture du code et des jeux de démo. nature : doublon = même objet, saisi deux fois ; miroir = copie locale d'une table d'un autre outil ; chevauchement = objets voisins qui se recouvrent en partie ; homonyme = même nom, objets différents ; technique = table d'infrastructure propre à chaque outil. Le champ decision est rempli quand l'utilisateur a tranché (statut : definitive ou provisoire, avec sa citation exacte).","groupes":[{"id":"D01","objet":"Personnes","nature":"doublon","gravite":"critique","tables":[{"app":"cursus","table":"employes","role":"Fiche salarié RH (contrat, temps de travail, visite médicale)","contenu":"24 salariés, matricule EMP-xxxx dérivé de l'id entier"},{"app":"keystone","table":"persons","role":"Personnes des projets, y compris contacts client et rôles contractuels","contenu":"id uuid, short_name unique ; mêmes noms que Codex"},{"app":"codex","table":"users","role":"Utilisateurs de la GED et comptes système","contenu":"25 personnes + comptes codex, keystone, vigie ; id texte"},{"app":"vigie","table":"people","role":"Personnel suivi dans la matrice d'habilitations","contenu":"12 personnes, noms provisoires entre crochets ([T. Nguyen])"},{"app":"arche","table":"users","role":"Comptes Arche (Entra ID), personnes du groupe et des filiales","contenu":"prévue (spécification d'Arche, livraison 0)"},{"app":"crucible","table":"users","role":"Comptes Crucible (Entra ID), EPC2i et entités partenaires (EPC France)","contenu":"réelle (migration 0000_platform de Crucible)"},{"app":"crucible","table":"people","role":"Personnes planifiables : opérateurs, techniciens, pyrotechniciens","contenu":"prévue (spécification de Crucible, docs/spec/02-objets.md)"}],"contenu":"11 des 25 personnes de Codex figurent aussi dans Keystone (Marie Lefebvre, Romain Aubert, Julien Wagner, Pauline Noguès…), sous un autre identifiant. Cursus et Vigie décrivent d'autres populations, sans aucun nom commun. Aucune table ne partage de clé avec une autre. Arche (22/10/2026, spécification) : arche.users porte les comptes Entra du groupe et des filiales ; les salariés EPC2i y sont identifiés par leur matricule Cursus (option A), les personnes des filiales, absentes de Cursus, restent des comptes Arche. Crucible (22/10/2026, livraison 1) : crucible.users porte les comptes Entra ; crucible.people (prévue) porte les opérateurs planifiables avec leur matricule Cursus. Application de l'option A : les salariés EPC2i viennent de cursus.pub_salaries (lecture accordée à crucible_app, demande CU-2 de Crucible) ; les personnes d'EPC France, absentes de Cursus, restent saisies dans Crucible.","champs":["employes.nom ↔ persons.full_name ↔ users.name ↔ people.name","employes.poste ↔ persons.job_title ↔ users.title ↔ people.job","employes.equipe ↔ persons.department_id ↔ users.department","— ↔ persons.email ↔ — ↔ —","employes.matricule ↔ people.matricule (Crucible)"],"options":[{"id":"A","libelle":"Fusionner : Cursus fait foi pour les salariés","effet":"Une seule fiche par salarié, identifiée par le matricule. Keystone, Codex et Vigie gardent une table locale réduite (matricule + données propres à l'outil). Keystone garde les personnes externes (contacts client)."},{"id":"B","libelle":"Fusionner : annuaire central dans Matrix","effet":"Matrix tient la fiche Personne (alimentée par Entra ID et Cursus) et la diffuse aux quatre outils."},{"id":"C","libelle":"Garder les quatre tables et les rapprocher","effet":"Matrix tient une table de correspondance des identifiants. Les doubles saisies continuent."}],"recommandation":"A","raison":"Cursus est le seul outil qui connaît le contrat et l'entrée ou la sortie du salarié. Les autres n'ont besoin que d'une référence.","decision":{"option":"A","statut":"definitive","le":"2026-10-15","citation":"D01 Personnes : option A (Fusionner : Cursus fait foi pour les salariés)"}},{"id":"D02","objet":"Projets","nature":"miroir","gravite":"critique","tables":[{"app":"keystone","table":"projects","role":"Projet de référence (code, client, phase, budget)","contenu":"17 projets, codes HLT-026, NDC-031… et code analytique HAV004"},{"app":"codex","table":"projects","role":"Copie locale pour rattacher les documents","contenu":"3 projets, mêmes codes que Keystone (HLT-026, NDC-031, RCF-019)"},{"app":"vigie","table":"keystone_projects","role":"Copie locale pour les listes de choix","contenu":"10 projets K-2024-097… : aucun code n'existe dans Keystone"},{"app":"cursus","table":"projets","role":"Codes à imputer sur les feuilles de temps","contenu":"14 codes : projets K-26xx et codes internes INT-PROD, INT-HSE, ECOLE…"},{"app":"arche","table":"keystone_projects","role":"Miroir des projets EPC2i liés à un CAPEX (lu dans keystone.pub_projets)","contenu":"prévue (spécification d'Arche, livraison 0)"},{"app":"crucible","table":"projects","role":"Projets R&D demandeurs : classe de priorité, confidentialité, lien Keystone (keystone_code) ou programme Codex","contenu":"réelle (migration 0000_platform de Crucible)"}],"contenu":"Codex est cohérent avec Keystone. Vigie et Cursus utilisent des codes que Keystone ne connaît pas. Les codes internes de Cursus (INT-…) n'ont pas d'équivalent dans Keystone. Arche : miroir keystone_projects lu dans keystone.pub_projets, conforme à l'option B. Crucible (22/10/2026, livraison 1) : crucible.projects porte les projets R&D qui réservent des moyens d'essai, avec un lien facultatif vers keystone.pub_projets (keystone_code). Application de l'option B : un projet qui existe dans Keystone y garde son code et Crucible le lit ; la réponse S-1 de Crucible (22/10/2026) garde dans Crucible les projets R&D que Keystone ne connaît pas (Keystone n'a pas de nature « R&D »). À surveiller : si Keystone accueille les projets R&D comme projets internes, crucible.projects devient un miroir.","champs":["projects.code ↔ projects.code ↔ keystone_projects.id ↔ projets.code","projects.name ↔ projects.name ↔ keystone_projects.title ↔ projets.nom","clients.name ↔ projects.client ↔ keystone_projects.client ↔ —","projects.code ↔ projects.keystone_code (Crucible)"],"options":[{"id":"A","libelle":"Garder Keystone seul ; les autres deviennent des miroirs synchronisés","effet":"Mêmes codes partout. Les copies sont mises à jour par l'API Keystone et ne sont plus saisies."},{"id":"B","libelle":"Garder Keystone et ajouter les codes internes dans Keystone","effet":"Comme A, et les codes hors projet (INT-…) deviennent des projets internes Keystone, avec leur code analytique."},{"id":"C","libelle":"Garder les tables actuelles","effet":"Trois formats de code restent en circulation."}],"recommandation":"B","raison":"Les heures imputées sur un code interne doivent aussi remonter dans Sage X3 et Lucca, comme celles des projets.","decision":{"option":"B","statut":"definitive","le":"2026-10-15","citation":"D02 Projets : option B (Garder Keystone et ajouter les codes internes dans Keystone)"}},{"id":"D03","objet":"Chantiers (fiche site d'un projet)","nature":"doublon","gravite":"majeur","tables":[{"app":"keystone","table":"site_sheets","role":"Fiche chantier : lieu, pays, dates, contraintes d'accès","contenu":"1 fiche (HLT-026) ; cursus_chantier_id vide"},{"app":"keystone","table":"site_rotations","role":"Équipe et rotations sur le chantier","contenu":"6 rotations"},{"app":"cursus","table":"chantiers","role":"Chantier, exigences d'habilitation et équipe pour le Go / No Go","contenu":"5 chantiers K-26xx ; habs, certs, ressources en JSON"}],"contenu":"Les deux outils décrivent le même chantier (lieu, pays, début, fin, chef, équipe), avec des codes différents. Cursus ajoute les habilitations exigées.","champs":["site_sheets.site_name ↔ chantiers.lieu","site_sheets.country ↔ chantiers.pays","site_sheets.start_on / end_on ↔ chantiers.debut / fin","site_rotations.person_id ↔ chantiers.ressources[]"],"options":[{"id":"A","libelle":"Keystone fait foi, exigences comprises ; Cursus lit","effet":"Keystone stocke les habilitations exigées par chantier. Cursus calcule le verdict à partir de cette fiche."},{"id":"B","libelle":"Keystone pour le chantier, Cursus pour les exigences","effet":"Cursus garde une table réduite (code projet + exigences) et lit le reste dans Keystone."},{"id":"C","libelle":"Garder les deux","effet":"Les dates et l'équipe sont saisies deux fois."}],"recommandation":"B","raison":"Les exigences d'habilitation relèvent des RH ; le reste de la fiche relève du projet.","decision":{"option":"B","statut":"definitive","le":"2026-10-15","citation":"D03 Chantiers (fiche site d'un projet) : option B (Keystone pour le chantier, Cursus pour les exigences)"}},{"id":"D04","objet":"Affectations des personnes aux projets","nature":"miroir","gravite":"majeur","tables":[{"app":"keystone","table":"allocations","role":"Charge par personne, semaine et projet","contenu":"64 lignes"},{"app":"keystone","table":"activity_assignments","role":"Ressources affectées aux activités du planning","contenu":"heures prévues et réalisées"},{"app":"cursus","table":"missions","role":"Affectations recopiées de Keystone (alertes de congés)","contenu":"14 missions"},{"app":"vigie","table":"keystone_assignments","role":"Affectations recopiées de Keystone (alertes d'habilitation)","contenu":"1 affectation"}],"contenu":"Les tables de Cursus et de Vigie portent les mêmes champs (personne, projet, début, fin) et sont remplies uniquement par le jeu de démo.","champs":["allocations.person_id ↔ missions.emp_id ↔ keystone_assignments.person_id","allocations.project_id ↔ missions.projet ↔ keystone_assignments.project","week_start ↔ du / au ↔ start_on / end_on"],"options":[{"id":"A","libelle":"Keystone fait foi ; Cursus et Vigie lisent par API","effet":"Suppression de missions et de keystone_assignments, remplacés par un appel à Keystone."},{"id":"B","libelle":"Keystone fait foi ; copies synchronisées","effet":"Les tables restent comme cache, mises à jour par Keystone."}],"recommandation":"B","raison":"Cursus et Vigie calculent des alertes en masse ; un cache local évite un appel par personne.","decision":{"option":"B","statut":"definitive","le":"2026-10-15","citation":"D04 Affectations des personnes aux projets : option B (Keystone fait foi ; copies synchronisées)"}},{"id":"D05","objet":"Tâches et heures prévues","nature":"miroir","gravite":"mineur","tables":[{"app":"keystone","table":"tasks","role":"Tâches du projet","contenu":"27 tâches"},{"app":"cursus","table":"taches","role":"Tâches Keystone et heures prévues par jour, pour pré-remplir les feuilles","contenu":"32 lignes"}],"contenu":"Cursus recopie les tâches pour proposer les lignes de la feuille de temps.","champs":["tasks.person_id ↔ taches.emp_id","tasks.activity_id → projet ↔ taches.projet","tasks.title ↔ taches.tache"],"options":[{"id":"A","libelle":"Keystone fait foi ; Cursus lit au moment de la saisie","effet":"Suppression de taches ; Keystone expose « tâches d'une personne pour une semaine » (déjà demandé par Cursus)."},{"id":"B","libelle":"Garder la copie Cursus synchronisée","effet":"La table reste, mise à jour par Keystone."}],"recommandation":"A","raison":"La table ne sert qu'à une suggestion ; la lecture directe est plus simple.","decision":{"option":"A","statut":"definitive","le":"2026-10-15","citation":"D05 Tâches et heures prévues : option A (Keystone fait foi ; Cursus s de congés payés","contenu":"à ne pas confondre avec keystone.status_reports"},{"app":"arche","table":"risks","role":"Registre des risques d'un CAPEX","contenu":"prévue (spécification d'Arche, livraison 0)"},{"app":"arche","table":"decisions","role":"Registre des décisions d'un CAPEX","contenu":"prévue (spécification d'Arche, livraison 0)"},{"app":"arche","table":"changes","role":"Changements après G2 (MoC : coût, délai, périmètre)","contenu":"prévue (spécification d'Arche, livraison 0)"},{"app":"arche","table":"reviews","role":"Revues de pilotage d'un CAPEX","contenu":"prévue (spécification d'Arche, livraison 0)"},{"app":"crucible","table":"resources","role":"Moyens d'essai réservables (bancs, cellules, zones du PDE) ; rien à voir avec keystone.resource_requests (demandes de personnes)","contenu":"prévue (spécification de Crucible, docs/spec/02-objets.md)"},{"app":"crucible","table":"incidents","role":"Aléas de planification (panne, absence) ; un événement QHSE reste dans vigie.events","contenu":"prévue (spécification de Crucible, docs/spec/02-objets.md)"}],"contenu":"Aucune fusion à faire. Le risque est la confusion lors d'une requête ou d'une intégration. Arche : risks, decisions, changes et reviews portent sur un CAPEX, pas sur un projet EPC2i ni sur un événement QHSE ; homonymes gardés et toujours nommés avec leur outil (option A). changes n'est pas un ECR / ECO (D12) : il ne modifie ni produit ni document. Crucible (22/10/2026, spécification) : resources (moyens d'essai) et incidents (aléas de planification) sont des homonymes de keystone.resource_requests et des événements de Vigie ; un accident ou un presqu'accident pendant un essai se déclare dans Vigie.","champs":[],"options":[{"id":"A","libelle":"Garder et toujours nommer les tables avec leur outil","effet":"Matrix affiche outil.table partout. Aucun changement de code."},{"id":"B","libelle":"Renommer lors du passage sur le serveur PostgreSQL commun","effet":"Par exemple vigie.certifications → iso_certifications, cursus.reports → reports_conges."}],"recommandation":"A","raison":"Le passage à un schéma par outil suffit à lever l'ambiguïté.","decision":{"option":"A","statut":"definitive","le":"2026-10-15","citation":"D20 Homonymes : même nom, objets différents : option A (Garder et toujours nommer les tables avec leur outil)"}},{"id":"D21","objet":"Filiales et zones du groupe","nature":"chevauchement","gravite":"majeur","tables":[{"app":"arche","table":"zones","role":"Zones (Directeurs de Zone)","contenu":"prévue (spécification d'Arche)"},{"app":"arche","table":"subsidiaries","role":"Filiales : code à 3 lettres, pays, zone, devise","contenu":"prévue (spécification d'Arche)"},{"app":"arche","table":"sites","role":"Usines et terrains des filiales","contenu":"prévue (spécification d'Arche)"},{"app":"keystone","table":"clients","role":"Clients des projets EPC2i, dont les filiales (code3)","contenu":"Les filiales commandent les machines à EPC2i"},{"app":"crucible","table":"entities","role":"Entités : EPC2i (exploitant), partenaires des installations partagées (EPC France)","contenu":"réelle (migration 0000_platform de Crucible)"}],"contenu":"Arche (spécification du 22/10/2026) crée ses propres tables zones, subsidiaries et sites. Or la filiale est aussi le client des projets EPC2i dans Keystone (keystone.clients, code à 3 lettres ; contrôle R-190 d'Arche), et Matrix publie déjà la liste unique des sites (D14) et l'organigramme à niveaux (D15). Sans décision, la même filiale serait saisie dans Arche et dans Keystone, avec deux codes possibles. Crucible (22/10/2026, livraison 1) : crucible.entities (EPC2I, EPCFR) recoupe la liste des filiales. Application de l'option A : EPC France entre dans matrix.filiales (demande M-6 de Crucible ; code à 3 lettres, par exemple EFR) et crucible.entities en devient le miroir, la nature « interne » ou « partenaire » restant propre à Crucible ; matrix.pub_filiales est accordée à crucible_app.","champs":["subsidiaries.code ↔ clients.code3","subsidiaries.name ↔ clients.name","subsidiaries.zone_code ↔ matrix.organigramme (niveau zone)","sites.name, city, country_iso2 ↔ matrix.sites","entities.code (Crucible) ↔ filiales.code","entities.name (Crucible) ↔ filiales.nom"],"options":[{"id":"A","libelle":"Référentiel du groupe dans Matrix : zones, filiales et leurs sites publiés par Matrix","effet":"Matrix ajoute les niveaux groupe › zone › filiale à l'organigramme (ou une liste matrix.filiales) et les sites des filiales à matrix.sites ; Arche les lit (vues pub_) au lieu de les créer ; Keystone relie clients.code3 au code de la filiale."},{"id":"B","libelle":"Arche fait foi pour les filiales et les zones, et les publie","effet":"Arche garde zones, subsidiaries et sites et publie arche.pub_filiales ; Keystone relie ses clients aux filiales ; Matrix les reprend dans ses référentiels."},{"id":"C","libelle":"Keystone fait foi (clients, D16)","effet":"Arche lit keystone.pub_clients et n'ajoute que la zone et la devise ; les sites restent dans Matrix (D14)."}],"recommandation":"A","raison":"Même logique que D14, D15 et D17 : un référentiel transverse est publié par Matrix et lu par tous. La filiale sert à Arche (CAPEX), à Keystone (client) et demain à Vigie et Codex (site, département).","decision":{"option":"A","statut":"definitive","le":"2026-10-22","citation":"D21 : option A (Référentiel du groupe dans Matrix : zones, filiales et leurs sites publiés par Matrix) — réponse au choix proposé, « A · Matrix (Recommandé) »"}},{"id":"D22","objet":"Retours d'expérience (REX)","nature":"chevauchement","gravite":"mineur","tables":[{"app":"keystone","table":"lessons_learned","role":"Leçons apprises des projets EPC2i","contenu":"Keystone détient le REX des projets"},{"app":"keystone","table":"rex_references","role":"Références de REX","contenu":"Liens vers les leçons apprises"},{"app":"arche","table":"rex_entries","role":"REX capitalisé d'un CAPEX, partagé avec les fonctions centrales","contenu":"prévue (spécification d'Arche)"}],"contenu":"Arche prévoit sa propre bibliothèque REX (ajout hors CDC, à valider côté Arche), alors que Keystone tient déjà les leçons apprises des projets EPC2i. Le REX d'un CAPEX porte souvent sur la machine livrée par EPC2i.","champs":["rex_entries.title, text, category ↔ lessons_learned"],"options":[{"id":"A","libelle":"Deux registres, une vue commune","effet":"Arche garde le REX du CAPEX (filiale, investissement), Keystone celui des projets ; chacun publie pub_rex et Matrix les réunit, comme le journal unifié."},{"id":"B","libelle":"Keystone fait foi","effet":"Arche saisit ses REX dans Keystone par API ou les lit dans keystone.pub_rex ; pas de table rex_entries."}],"recommandation":"A","raison":"Les deux REX n'ont ni les mêmes auteurs ni le même objet ; les réunir par une vue évite la double saisie sans faire entrer les filiales dans Keystone.","decision":{"option":"A","statut":"definitive","le":"2026-10-22","citation":"D22 : option A (Deux registres, une vue commune) — réponse au choix proposé, « A · Deux registres (Recommandé) »"}},{"id":"D23","objet":"Contrôles périodiques et indisponibilités des moyens d'essai","nature":"chevauchement","gravite":"majeur","tables":[{"app":"vigie","table":"controls","role":"Contrôles périodiques réglementaires des équipements (dernier, prochain, réserves)","contenu":"réelle"},{"app":"vigie","table":"control_records","role":"Historique des contrôles réalisés","contenu":"réelle"},{"app":"crucible","table":"unavailabilities","role":"Indisponibilités d'un moyen : maintenance, contrôle périodique, panne, travaux (origine : saisie, Vigie, aléa)","contenu":"prévue (spécification de Crucible, docs/spec/02-objets.md)"}],"contenu":"Crucible (spécification du 22/10/2026) bloque un moyen d'essai quand son contrôle périodique est échu (règle R-6) et prévoit des indisponibilités d'origine « Vigie ». Or Vigie tient déjà les contrôles périodiques réglementaires des équipements (vigie.controls : équipement en texte libre, prochaine échéance, réserves). Sans décision, le même contrôle serait saisi dans Vigie et dans Crucible, avec deux dates. Crucible a demandé à Vigie une vue pub_controles avec un code d'équipement commun (V-1) et une vue des interventions qui suspendent les essais (V-2).","champs":["controls.equipment ↔ resources.code (Crucible, code commun à créer : equipement_code)","controls.next_on ↔ unavailabilities (origine Vigie)","controls.reserves ↔ unavailabilities.reason"],"options":[{"id":"A","libelle":"Vigie fait foi pour les contrôles réglementaires ; Crucible les lit","effet":"Vigie publie vigie.pub_controles avec un code d'équipement commun aux moyens de Crucible (V-1) ; Crucible en déduit l'indisponibilité (contrôle échu, réserves) et ne saisit que la maintenance, les pannes et les travaux."},{"id":"B","libelle":"Crucible fait foi pour les contrôles de ses moyens d'essai","effet":"Les contrôles des bancs, cellules et zones d'essai sont saisis dans Crucible et publiés (crucible.pub_controles) ; Vigie ne garde que les autres équipements."},{"id":"C","libelle":"Chacun garde les siens, sans lien","effet":"Les contrôles sont saisis deux fois ; Matrix signale les écarts de date."}],"recommandation":"A","raison":"Le contrôle réglementaire relève de la QHSE (Vigie, qui gère déjà échéances, réserves et alertes) ; Crucible n'a besoin que de savoir si le moyen est utilisable. C'est la demande V-1 de Crucible.","decision":{"option":"A","statut":"definitive","le":"2026-10-22","citation":"D23 : option A (Vigie fait foi ; Crucible lit les contrôles) — réponse au choix proposé, « A · Vigie (Recommandé) »"}}]},"historique":{"evenements":[{"date":"2026-10-18T09:07:07.276Z","app":"keystone","type":"colonne_ajoutee","table":"persons","colonne":"rate_role_id"},{"date":"2026-10-18T09:07:07.276Z","app":"keystone","type":"colonne_ajoutee","table":"persons","colonne":"matricule"},{"date":"2026-10-18T09:07:07.276Z","app":"keystone","type":"colonne_ajoutee","table":"persons","colonne":"directory_team"},{"date": <script>
(() => {
'use strict';
const DATA = JSON.parse(document.getElementById('matrix-data').textContent);
const CAT = DATA.catalogue, FLUX = DATA.flux, USAGES = DATA.usages, DOUBLONS = DATA.doublons.groupes, HIST = DATA.historique.evenements;
// SERVEUR : page servie par Matrix (modifications enregistrées sur le serveur) ; sinon maquette en lecture seule.
const SERVEUR = !!DATA.serveur;
const EDITION = DATA.edition || { documentation: {}, decisions: {}, referentiels: { sites: [], organigramme: [], pays: [], zones: [], filiales: [] }, journal: [] };
async function envoyer(chemin, corps) {
  const r = await fetch(chemin, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(corps) });
  const j = await r.json().catch(() => ({ erreur: 'réponse illisible du serveur' }));
  if (!r.ok) throw new Error(j.erreur || `erreur ${r.status}`);
  Object.assign(EDITION, j.edition);
  return j.resultat;
}

// ── Icônes (tracés Codex + quelques ajouts) ─────────────────────────────
const ICONS = {
  home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  search: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4',
  db: 'M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3',
  table: 'M4 5h16v14H4zM4 10h16M4 15h16M10 5v14',
  graph: 'M5 7a2 2 0 1 0 4 0 2 2 0 1 0-4 0M15 5a2 2 0 1 0 4 0 2 2 0 1 0-4 0M13 18a2 2 0 1 0 4 0 2 2 0 1 0-4 0M9 6.6l6-1.2M8.4 8.7l5.4 7.6',
  flux: 'M4 8h14l-3-3M20 16H6l3 3',
  ref: 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1',
  pulse: 'M3 12h4l3-7 4 14 3-7h4',
  shield: 'M12 3l8 3v6c0 5-3.5 8.5-8 9-4.5-.5-8-4-8-9V6zM9 12l2 2 4-4',
  matrix: 'M4 4h5v5H4zM15 4h5v5h-5zM4 15h5v5H4zM15 15h5v5h-5zM9 6.5h6M6.5 9v6M17.5 9v6M9 17.5h6',
  close: 'M6 6l12 12M18 6L6 18',
  chevronRight: 'M9 6l6 6-6 6', chevronDown: 'M6 9l6 6 6-6',
  key: 'M14.5 4a5.5 5.5 0 1 1-4.3 8.9L4 19v-3h2v-2h2l2-2A5.5 5.5 0 0 1 14.5 4zM16 8.5h.01',
  link: 'M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5',
  eye: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
  lock: 'M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5z',
  tick: 'M5 12l5 5L20 7', dash: 'M8 12h8',
  fit: 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5',
  copy: 'M9 9h11v11H9zM5 15H4V4h11v1',
  refresh: 'M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7',
  pen: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',
  list: 'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',
  plus: 'M12 5v14M5 12h14',
};
const icon = (name, size = 16, sw = 1.6) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[name]}"/></svg>`;
const hydrateIcons = root => root.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon, +(el.dataset.size || 16)); el.removeAttribute('data-icon'); });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => n.toLocaleString('fr-FR');
const $ = id => document.getElementById(id);

// ── Applications ────────────────────────────────────────────────────────
const APPS = {
  keystone: { nom: 'Keystone', role: 'Gestion de projets et de portefeuille', moteur: 'PostgreSQL embarqué (PGlite)', orm: 'Drizzle', port: 3000, init: 'K', donnees: 'KEYSTONE_DATA_DIR/pg' },
  codex: { nom: 'Codex', role: 'GED du groupe', moteur: 'PostgreSQL embarqué (PGlite)', orm: 'Drizzle', port: 3100, init: 'C', donnees: 'CODEX_DATA_DIR/pglite' },
  cursus: { nom: 'Cursus', role: 'RH : formations, temps, déplacements', moteur: 'SQLite (node:sqlite)', orm: 'aucun', port: 3210, init: 'Cu', donnees: 'CURSUS_DB (data/cursus.db)' },
  vigie: { nom: 'Vigie', role: 'QHSE : événements, risques, prévention', moteur: 'PostgreSQL embarqué (PGlite)', orm: 'Drizzle', port: 3200, init: 'V', donnees: 'VIGIE_DATA_DIR' },
  arche: { nom: 'Arche', role: 'CAPEX des filiales (méthode DIG-PRODI)', moteur: 'PostgreSQL (serveur commun)', orm: 'Drizzle', port: 3400, init: 'A', donnees: 'schéma arche' },
  crucible: { nom: 'Crucible', role: 'Planification des moyens d’essai R&D partagés (laboratoire 67, PDE)', moteur: 'PostgreSQL (serveur commun)', orm: 'Drizzle', port: 3500, init: 'Cr', donnees: 'schéma crucible' },
};
const APP_IDS = Object.keys(APPS);
const css = getComputedStyle(document.documentElement);
const cssv = v => css.getPropertyValue(v).trim();
APP_IDS.forEach(a => APPS[a].couleur = cssv('--app-' + a));
const appMark = (a, size = 18) => `<span class="mark" style="color:${APPS[a].couleur};width:${size}px;height:${size}px">${APPS[a].init}</span>`;
const appTag = a => `<span class="tag tag-ghost"><span class="dot" style="background:${APPS[a].couleur}"></span>${APPS[a].nom}</span>`;

const STATUT = {
  reel: ['Réel', 'tag-accent', 'Implémenté des deux côtés'],
  partiel: ['Partiel', 'tag-outline', 'Un seul côté est construit'],
  simule: ['Simulé', 'tag-neutral', 'Remplacé par une écriture locale'],
  copie: ['Copie de démo', 'tag-neutral', 'Données recopiées, sans synchronisation'],
  propose: ['Proposé', 'tag-neutral', 'Contrat écrit, rien de construit'],
  prevu: ['Prévu', 'tag-neutral', 'Annoncé dans l’interface'],
};
const GRAV = { critique: ['Critique', 'tag-accent'], majeur: ['Majeur', 'tag-outline'], mineur: ['Mineur', 'tag-neutral'] };
const statutTag = s => `<span class="tag ${STATUT[s][1]}" title="${esc(STATUT[s][2])}">${STATUT[s][0]}</span>`;
const gravTag = g => `<span class="tag ${GRAV[g][1]}">${GRAV[g][0]}</span>`;

// ── Index du catalogue ──────────────────────────────────────────────────
const T = new Map();               // "app.table" → fiche
const key = (a, t) => a + '.' + t;
for (const app of CAT.apps) for (const t of app.tables) {
  T.set(key(app.id, t.name), { ...t, app: app.id, key: key(app.id, t.name), in: [], lit: [], ecrit: [], flux: [], refs: [] });
}
for (const t of T.values()) for (const fk of t.fks) {
  const target = T.get(key(t.app, fk.table));
  if (target) target.in.push({ from: t.key, columns: fk.columns, refColumns: fk.refColumns, declared: fk.declared });
}
for (const a of APP_IDS) for (const s of USAGES[a] || []) {
  s.lit.forEach(n => T.get(key(a, n))?.lit.push(s.ecran));
  s.ecrit.forEach(n => T.get(key(a, n))?.ecrit.push(s.ecran));
}
for (const f of FLUX.flux) {
  f.source.forEach(n => T.get(key(f.de, n))?.flux.push({ f, sens: 'source' }));
  f.cible.forEach(n => T.get(key(f.vers, n))?.flux.push({ f, sens: 'cible' }));
}
for (const g of DOUBLONS) for (const o of g.tables) T.get(key(o.app, o.table))?.refs.push(g);
// Documentation saisie dans Matrix : elle complète ou remplace ce que dit le schéma.
function appliquerDoc(t, d) {
  t.origine ??= { description: t.description, domain: t.domain };
  t.description = d?.description ?? t.origine.description;
  t.domain = d?.domaine ?? t.origine.domain;
  t.responsable = d?.responsable ?? null;
  t.note = d?.note ?? null;
  t.doc = d ?? null;
}
for (const [k, d] of Object.entries(EDITION.documentation)) { const t = T.get(k); if (t) appliquerDoc(t, d); }
const FUSION = new Set(['doublon', 'miroir', 'chevauchement']);
const NATURE = { doublon: ['Doublon', 'tag-accent'], miroir: ['Miroir', 'tag-outline'], chevauchement: ['Chevauchement', 'tag-outline'], homonyme: ['Homonyme', 'tag-neutral'], technique: ['Technique', 'tag-neutral'] };
const natureTag = n => `<span class="tag ${NATURE[n][1]}">${NATURE[n][0]}</span>`;

// Décisions sur les doublons : enregistrées sur le serveur Matrix ; dans la maquette publiée, propres au navigateur.
const Decisions = (() => {
  let d = {};
  if (SERVEUR) d = Object.fromEntries(Object.entries(EDITION.decisions).map(([k, v]) => [k, v.option]));
  else { try { d = JSON.parse(localStorage.getItem('matrix.decisions') || '{}') || {}; } catch { d = {}; } }
  const officielle = id => DOUBLONS.find(g => g.id === id)?.decision || null;
  return {
    get: id => d[id] || officielle(id)?.option || null,
    officielle,
    async set(id, v) {
      if (SERVEUR) { await envoyer('/api/decisions', { id, option: v }); if (v) d[id] = v; else delete d[id]; }
      else {
        if (v && v !== officielle(id)?.option) d[id] = v; else delete d[id];
        try { localStorage.setItem('matrix.decisions', JSON.stringify(d)); } catch { /* stockage indisponible */ }
      }
      navBadge();
    },
    count: () => DOUBLONS.filter(g => d[g.id] || g.decision).length,
  };
})();
const tablesOf = a => [...T.values()].filter(t => t.app === a);
const linkCount = t => t.fks.length + t.in.length;

const STATS = (() => {
  const all = [...T.values()];
  const fks = all.reduce((n, t) => n + t.fks.length, 0);
  const logical = all.reduce((n, t) => n + t.fks.filter(f => !f.declared).length, 0);
  const cols = all.reduce((n, t) => n + t.columns.length, 0);
  return { tables: all.length, fks, logical, cols, flux: FLUX.flux.length, reels: FLUX.flux.filter(f => f.statut === 'reel').length };
})();

// ── Navigation ──────────────────────────────────────────────────────────
const NAV = [
  ['accueil', 'Accueil', 'home'],
  ['bibliotheque', 'Bibliothèque', 'db'],
  ['graphe', 'Graphe des liens', 'graph'],
  ['flux', 'Flux entre logiciels', 'flux'],
  ['doublons', 'Doublons', 'ref'],
  ['referentiels', 'Référentiels', 'list'],
  ['qualite', 'Qualité des schémas', 'pulse'],
  ['administration', 'Administration', 'shield'],
];
$('nav').innerHTML = NAV.map(([id, label, ic]) => `<a class="nav-item" href="#${id}" data-screen="${id}">${icon(ic)}<span class="label">${label}</span>${id === 'doublons' ? '<span class="tag tag-accent" id="nav-doublons"></span>' : ''}</a>`).join('');
function navBadge() { const el = $('nav-doublons'); if (el) { const n = DOUBLONS.length - Decisions.count(); el.textContent = n; el.hidden = !n; el.title = n + ' groupe(s) à trancher'; } }
navBadge();
$('linked').innerHTML = APP_IDS.map(a => `<div class="linked">${appMark(a)}<span>${APPS[a].nom}</span><span class="sub text-muted" style="margin-left:auto">:${APPS[a].port}</span></div>`).join('');
$('collect-tag').textContent = 'Schémas lus le ' + new Date(CAT.generatedAt).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
hydrateIcons(document);

const rendered = {};
let current = null;
function show(screen) {
  if (!NAV.some(n => n[0] === screen)) screen = 'accueil';
  current = screen;
  document.querySelectorAll('.screen').forEach(s => s.hidden = s.id !== 's-' + screen);
  document.querySelectorAll('.nav-item').forEach(a => a.toggleAttribute('aria-current', a.dataset.screen === screen) || a.dataset.screen === screen && a.setAttribute('aria-current', 'page'));
  $('screen-title').textContent = $('s-' + screen).dataset.title;
  if (!rendered[screen]) { rendered[screen] = true; RENDER[screen](); }
  if (screen === 'graphe') Graph.ensure();
}
function go(screen) { if (location.hash !== '#' + screen) location.hash = screen; else show(screen); }
window.addEventListener('hashchange', () => show(location.hash.slice(1)));

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  $('toasts').appendChild(el); setTimeout(() => el.remove(), 3200);
}
function copy(text) {
  try { navigator.clipboard.writeText(text).then(() => toast('Copié : ' + text), () => toast(text)); } catch { toast(text); }
}
const seg = (name, options, value) => `<div class="seg" role="group" data-seg="${name}">${options.map(([v, l, n]) => `<button type="button" data-v="${esc(v)}" aria-pressed="${v === value}">${l}${n != null ? ` <span class="n">${n}</span>` : ''}</button>`).join('')}</div>`;

// ── Fiche d'une table (bibliothèque et graphe) ──────────────────────────
function tableSheet(t, tab = 'colonnes', opts = {}) {
  const sens = new Set(t.sensitive || []);
  const fkByCol = {}; t.fks.forEach(f => f.columns.forEach(c => fkByCol[c] = f));
  const screens = new Set([...t.lit, ...t.ecrit]);
  let body = '';
  if (tab === 'colonnes') {
    body = `<div class="cols-list">${t.columns.map(c => {
      const fk = fkByCol[c.name]; const flags = [];
      if (c.pk || t.pk.includes(c.name)) flags.push('<span class="tag tag-accent">clé primaire</span>');
      if (fk) flags.push(`<span class="tag ${fk.declared ? 'tag-outline' : 'tag-ghost'}">→ ${esc(fk.table)}.${esc(fk.refColumns.join(', '))}${fk.declared ? '' : ' · logique'}</span>`);
      if (!c.nullable && !c.pk) flags.push('<span class="tag tag-ghost">obligatoire</span>');
      if (sens.has(c.name)) flags.push('<span class="tag tag-outline">' + icon('lock', 10) + ' sensible</span>');
      return `<div class="col-row"><span class="mono">${esc(c.name)}</span><span class="col-type mono">${esc(c.type)}</span>${flags.length ? `<div class="col-flags">${flags.join('')}</div>` : ''}</div>`;
    }).join('')}</div>`;
  } else if (tab === 'liens') {
    const out = t.fks.map(f => `<div class="link-row"><span class="mono">${esc(f.columns.join(', '))}</span><span class="arrow">→</span><button class="link-btn mono" data-open="${esc(key(t.app, f.table))}">${esc(f.table)}</button><span class="text-muted mono">.${esc(f.refColumns.join(', '))}</span>${f.declared ? '' : '<span class="tag tag-ghost">logique</span>'}</div>`).join('');
    const inn = t.in.map(i => { const s = T.get(i.from); return `<div class="link-row"><button class="link-btn mono" data-open="${esc(i.from)}">${esc(s.name)}</button><span class="text-muted mono">.${esc(i.columns.join(', '))}</span>${i.declared ? '' : '<span class="tag tag-ghost">logique</span>'}</div>`; }).join('');
    const refs = t.refs.map(g => `<div class="link-row"><button class="link-btn" data-doublon="${g.id}">${esc(g.id)} · ${esc(g.objet)}</button>${natureTag(g.nature)}<span class="text-muted">· ${g.tables.filter(o => o.table !== '—' && key(o.app, o.table) !== t.key).map(o => APPS[o.app].nom + '.' + o.table).join(', ')}</span></div>`).join('');
    const sim = (t.doublonsPossibles || []).map(d => `<div class="link-row"><button class="link-btn mono" data-open="${esc(key(d.app, d.table))}">${APPS[d.app].nom}.${esc(d.table)}</button><span class="text-muted">· ${Math.round(d.score * 100)} % de colonnes communes${d.memeNom ? ' · même nom' : ''}</span></div>`).join('');
    body = `<div><div class="block-title">Pointe vers <span>${t.fks.length}</span></div>${out || '<p class="text-muted sub">Aucun lien sortant.</p>'}</div>
      <div><div class="block-title">Référencée par <span>${t.in.length}</span></div>${inn || '<p class="text-muted sub">Aucune table ne pointe vers celle-ci.</p>'}</div>
      ${refs ? `<div><div class="block-title">Doublons relevés</div>${refs}</div>` : ''}
      ${sim ? `<div><div class="block-title">Doublons possibles (détection automatique)</div>${sim}</div>` : ''}`;
  } else {
    const fx = t.flux.map(({ f, sens }) => {
      const other = sens === 'source' ? f.vers : f.de;
      return `<div class="link-row"><button class="link-btn" data-flux="${f.id}">${esc(f.id)} · ${esc(f.nom)}</button><span class="text-muted">${sens === 'source' ? 'lue par' : 'alimentée par'} ${APPS[other].nom}</span>${statutTag(f.statut)}</div>`;
    }).join('');
    const ext = FLUX.externes.filter(e => e.app === t.app && e.tables.includes(t.name)).map(e => `<div class="link-row"><span>${esc(e.nom)}</span><span class="text-muted">· ${esc(e.sens)}</span>${statutTag(e.statut)}</div>`).join('');
    body = `<div><div class="block-title">Écrans de ${APPS[t.app].nom} <span>${screens.size}</span></div>
      ${[...screens].map(s => `<div class="link-row"><span>${esc(s)}</span><span class="text-muted" style="margin-left:auto">${t.lit.includes(s) ? 'lit' : ''}${t.lit.includes(s) && t.ecrit.includes(s) ? ' · ' : ''}${t.ecrit.includes(s) ? 'écrit' : ''}</span></div>`).join('') || '<p class="text-muted sub">Aucun écran relevé. La table peut être lue par un calcul ou une tâche de fond.</p>'}</div>
      <div><div class="block-title">Autres logiciels <span>${t.flux.length + (ext ? 1 : 0)}</span></div>${fx + ext || '<p class="text-muted sub">Aucun autre logiciel ne lit ni n’alimente cette table.</p>'}</div>`;
  }
  return `
    <div class="quick-head">
      <div class="quick-title mono">${esc(t.name)}</div>
      ${opts.close ? `<button class="btn btn-ghost btn-icon" data-close aria-label="Fermer l’aperçu">${icon('close', 14)}</button>` : ''}
    </div>
    <div class="tags">${appTag(t.app)}<span class="tag tag-neutral">${esc(t.domain)}</span>${t.sensitive ? `<span class="tag tag-outline">${icon('lock', 10)} Données sensibles</span>` : ''}${t.flux.length ? `<span class="tag tag-accent">Échangée</span>` : ''}${t.nouvelle ? `<span class="tag tag-outline">Nouvelle · à documenter</span>` : ''}</div>
    ${t.description ? `<p class="text-muted" style="font-size:12.5px">${esc(t.description)}</p>` : `<p class="text-muted sub">Pas encore de description.</p>`}
    ${t.responsable || t.note ? `<dl class="dl">${t.responsable ? `<dt>Responsable</dt><dd>${esc(t.responsable)}</dd>` : ''}${t.note ? `<dt>Note</dt><dd style="white-space:pre-wrap">${esc(t.note)}</dd>` : ''}</dl>` : ''}
    ${t.doc ? `<p class="sub text-muted">Documentée par ${esc(t.doc.majPar || '—')} le ${new Date(t.doc.majLe).toLocaleDateString('fr-FR')}</p>` : ''}
    ${SERVEUR ? `<div><button class="btn btn-secondary btn-sm" data-documenter="${esc(t.key)}">${icon('pen', 13)} Documenter</button></div>` : ''}
    <div class="mini-kpis"><div><b>${t.columns.length}</b><span>colonnes</span></div><div><b>${linkCount(t)}</b><span>liens</span></div><div><b>${screens.size + t.flux.length}</b><span>usages</span></div></div>
    <dl class="dl"><dt>Clé</dt><dd class="mono">${esc(t.pk.join(', ') || '—')}</dd>${t.uniques.length ? `<dt>Unicité</dt><dd class="mono">${t.uniques.map(u => esc(u.join(' + '))).join(' · ')}</dd>` : ''}<dt>Base</dt><dd>${esc(APPS[t.app].moteur)}</dd></dl>
    ${seg('tab', [['colonnes', 'Colonnes', t.columns.length], ['liens', 'Liens', linkCount(t)], ['usages', 'Usages', screens.size + t.flux.length]], tab)}
    <div style="display:flex;flex-direction:column;gap:14px">${body}</div>
    ${opts.actions !== false ? `<div class="actions"><button class="btn btn-primary" data-graph="${esc(t.key)}">${icon('graph', 14)} Voir dans le graphe</button><button class="btn btn-secondary" data-copy="${esc(t.name)}">${icon('copy', 14)} Copier le nom</button></div>` : ''}`;
}

function fluxSheet(f, opts = {}) {
  const tl = (a, list) => list.length ? list.map(n => `<button class="link-btn mono" data-open="${esc(key(a, n))}">${esc(n)}</button>`).join(', ') : '<span class="text-muted">aucune table aujourd’hui</span>';
  return `
    <div class="quick-head"><div class="quick-title">${esc(f.nom)}</div>${opts.close ? `<button class="btn btn-ghost btn-icon" data-close aria-label="Fermer">${icon('close', 14)}</button>` : ''}</div>
    <div class="tags"><span class="tag tag-ghost">${esc(f.id)}</span>${statutTag(f.statut)}<span class="tag tag-neutral">${esc(f.mode)}</span></div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${appTag(f.de)}<span class="arrow">→</span>${appTag(f.vers)}</div>
    <dl class="dl"><dt>Point d’accès</dt><dd class="mono">${esc(f.point)}</dd><dt>Sécurité</dt><dd>${esc(f.auth)}</dd>
      <dt>Lit dans ${APPS[f.de].nom}</dt><dd>${tl(f.de, f.source)}</dd><dt>Écrit dans ${APPS[f.vers].nom}</dt><dd>${tl(f.vers, f.cible)}</dd></dl>
    <div><div class="block-title">Informations extraites <span>${f.champs.length}</span></div>
      <div class="table-wrap"><table class="table map-table"><thead><tr><th>${APPS[f.de].nom}</th><th></th><th>${APPS[f.vers].nom}</th></tr></thead>
      <tbody>${f.champs.map(([s, c]) => `<tr><td class="mono">${esc(s)}</td><td class="arrow">→</td><td class="mono">${esc(c)}</td></tr>`).join('')}</tbody></table></div></div>
    <p class="note">${esc(f.note)}</p>
    ${opts.actions !== false ? `<div class="actions"><button class="btn btn-primary" data-graph-flux="${f.id}">${icon('graph', 14)} Voir dans le graphe</button></div>` : ''}`;
}

// Formulaire de documentation d'une table (page servie par Matrix uniquement)
const Documentation = {
  ouvrir(k, conteneur) {
    const t = T.get(k); if (!t || !conteneur) return;
    const domaines = [...new Set(tablesOf(t.app).map(x => x.domain))].sort((a, b) => a.localeCompare(b, 'fr'));
    conteneur.innerHTML = `<div class="quick-head"><div class="quick-title mono">${esc(t.name)}</div></div>
      <div class="tags">${appTag(t.app)}</div>
      <form id="doc-form" style="display:flex;flex-direction:column;gap:12px">
        <div class="field"><label class="field-label" for="doc-description">Description</label><textarea class="input" id="doc-description" rows="4" maxlength="2000">${esc(t.description || '')}</textarea></div>
        <div class="field"><label class="field-label" for="doc-domaine">Domaine</label><input class="input" id="doc-domaine" list="doc-domaines" maxlength="80" value="${esc(t.domain || '')}"><datalist id="doc-domaines">${domaines.map(d => `<option value="${esc(d)}">`).join('')}</datalist></div>
        <div class="field"><label class="field-label" for="doc-responsable">Responsable de la donnée</label><input class="input" id="doc-responsable" maxlength="120" placeholder="Nom ou fonction" value="${esc(t.responsable || '')}"></div>
        <div class="field"><label class="field-label" for="doc-note">Note</label><textarea class="input" id="doc-note" rows="4" maxlength="4000" placeholder="Règles de gestion, précautions, liens utiles…">${esc(t.note || '')}</textarea></div>
        <p class="form-error" id="doc-erreur" hidden></p>
        <div class="actions"><button class="btn btn-primary" type="submit">Enregistrer</button><button class="btn btn-secondary" type="button" id="doc-annuler">Annuler</button></div>
      </form>`;
    const rafraichir = () => { conteneur.innerHTML = tableSheet(t, 'colonnes', { close: true }); Library.refresh(); };
    conteneur.querySelector('#doc-annuler').addEventListener('click', rafraichir);
    conteneur.querySelector('#doc-form').addEventListener('submit', async ev => {
      ev.preventDefault();
      const v = id => conteneur.querySelector(id).value;
      try {
        const d = await envoyer('/api/documentation', { app: t.app, table: t.name, description: v('#doc-description'), domaine: v('#doc-domaine'), responsable: v('#doc-responsable'), note: v('#doc-note') });
        appliquerDoc(t, d); rafraichir(); toast(`${t.name} : documentation enregistrée`);
      } catch (err) { const p = conteneur.querySelector('#doc-erreur'); p.textContent = err.message; p.hidden = false; }
    });
  },
};

// Délégation des clics communs aux fiches
document.addEventListener('click', e => {
  const doc = e.target.closest('[data-documenter]');
  if (doc) { Documentation.ouvrir(doc.dataset.documenter, doc.closest('.quick')); return; }
  const el = e.target.closest('[data-open],[data-flux],[data-graph],[data-graph-flux],[data-copy],[data-go],[data-doublon]');
  if (!el) return;
  if (el.dataset.open) Library.open(el.dataset.open);
  else if (el.dataset.flux) Flows.open(el.dataset.flux);
  else if (el.dataset.graph) Graph.focusTable(el.dataset.graph);
  else if (el.dataset.graphFlux) Graph.focusFlux(el.dataset.graphFlux);
  else if (el.dataset.copy) copy(el.dataset.copy);
  else if (el.dataset.go) go(el.dataset.go);
  else if (el.dataset.doublon) Dups.open(el.dataset.doublon);
});
function onSeg(root, name, fn) {
  root.addEventListener('click', e => {
    const b = e.target.closest(`[data-seg="${name}"] button`); if (!b) return;
    b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    fn(b.dataset.v);
  });
}

// ── Bibliothèque ────────────────────────────────────────────────────────
const Library = (() => {
  const st = { app: null, domain: null, filtre: 'toutes', q: '', sel: null, tab: 'colonnes', open: new Set() };
  let root;
  const FILTRES = {
    toutes: ['Toutes', () => true],
    echangees: ['Échangées', t => t.flux.length > 0],
    partagees: ['En double', t => t.refs.some(g => FUSION.has(g.nature))],
    nouvelles: ['À documenter', t => !!t.nouvelle],
    sensibles: ['Sensibles', t => !!t.sensitive],
    isolees: ['Isolées', t => linkCount(t) === 0],
  };
  function matches(t) {
    if (st.app && t.app !== st.app) return false;
    if (st.domain && t.domain !== st.domain) return false;
    if (!FILTRES[st.filtre][1](t)) return false;
    if (st.q) {
      const q = st.q.toLowerCase();
      return t.name.includes(q) || (t.description || '').toLowerCase().includes(q) || t.columns.some(c => c.name.includes(q)) || t.domain.toLowerCase().includes(q);
    }
    return true;
  }
  function render() {
    root = $('s-bibliotheque');
    root.innerHTML = `<div class="panes">
      <aside class="tree"><div class="tree-head"><h6 class="sec-title">Bases et domaines</h6></div><div class="tree-body" id="lib-tree"></div></aside>
      <div class="list">
        <div class="list-head">
          <div class="crumb" id="lib-crumb"></div>
          <div class="search" style="width:220px"><span>${icon('search', 14)}</span><input class="input" id="lib-q" type="search" placeholder="Filtrer : table, colonne…" aria-label="Filtrer les tables"></div>
          <div id="lib-filtres"></div>
        </div>
        <div class="list-body table-wrap"><table class="table"><thead><tr><th>Table</th><th>Domaine</th><th class="num">Colonnes</th><th class="num">Liens</th><th class="num">Écrans</th><th></th></tr></thead><tbody id="lib-rows"></tbody></table></div>
        <div class="list-foot" id="lib-foot"></div>
      </div>
      <aside class="quick" id="lib-quick"></aside>
    </div>`;
    $('lib-q').addEventListener('input', e => { st.q = e.target.value.trim(); update(); });
    root.addEventListener('click', e => {
      const n = e.target.closest('[data-node]');
      if (n) {

    { selector: 'edge[kind="ref"]', style: { 'line-color': C.accent3, 'line-style': 'dotted', 'width': 2, 'opacity': 0.8, 'curve-style': 'bezier' } },
    { selector: 'edge[kind="lit"]', style: { 'line-color': C.n600, 'curve-style': 'bezier', 'target-arrow-shape': 'triangle', 'target-arrow-color': C.n600, 'arrow-scale': 0.5 } },
    { selector: 'edge[kind="ecrit"]', style: { 'line-color': C.accent, 'width': 1.6, 'opacity': 0.85, 'curve-style': 'bezier', 'target-arrow-shape': 'triangle', 'target-arrow-color': C.accent, 'arrow-scale': 0.6 } },
